<!doctype html>
<!--
  What sort actually compares. Week-8 depth slide (depth for cycle 2).

  Four data sets, sorted three ways each — bare `sort()`, a numeric comparator, and
  `localeCompare` — with the comparisons the engine performed printed underneath. The
  trap is not that `sort()` is broken. It is that `sort()` is documented, consistent, and
  comparing something other than what you meant.

  What makes it teach rather than merely demonstrate:

  1. IT SHOWS THE STRINGS. Bare `sort()` turns every element into a string first, so the
     comparison log prints `"10" < "9"` — true — beside the numbers the student typed.
     Once that line is on screen the result stops being mysterious and starts being
     obvious, and obvious is what survives to week 13.
  2. IT MUTATES IN FRONT OF THEM, AND COUNTS IT. The "original array afterwards" row is
     printed for every run. `sort` returns the array AND reorders the one it was given —
     which is the same fact as demo 03's program 4, met again in the place students
     actually meet it. The `[...list].sort()` switch flips that row and nothing else.
  3. THE HEBREW ROW IS NOT DECORATION. `'ת' < 'א'` and `'a' < 'B'` are both true under
     `<`, and both are wrong for a list a person will read. Every project in this course
     sorts Hebrew titles, and `localeCompare(a, b, 'he')` is what the reference build
     uses on every one of its comparators.

  DEMO MOVE: run the numbers first with bare sort, wait for somebody to say "it is
  sorting them as strings", then press "show the comparisons" rather than agreeing.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>sort: what it compares, and what it changes</title>

    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
        --accent: #4338ca;
        --bad: #b91c1c;
        --good: #0f766e;
        --code-bg: #0f172a;
        --code-fg: #e2e8f0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        margin-bottom: 12px;
      }
      .bar label {
        font-size: 13px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      select {
        font: inherit;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 4px 9px;
        background: #fff;
        color: inherit;
        /*
         * A <select> sizes itself to its LONGEST option, and one of these options carries
         * a four-item array in its label. Without a cap it pushes the page 77px past a
         * 375px viewport - measured, and caught by the responsive gate.
         */
        max-width: 100%;
      }
      .bar > label {
        min-width: 0;
        max-width: 100%;
      }
      input[type='checkbox'] {
        accent-color: var(--accent);
      }
      select:focus-visible,
      input:focus-visible {
        outline: 3px solid #f59e0b;
        outline-offset: 2px;
      }
      .runs {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(290px, 100%), 1fr));
        gap: 12px;
        align-items: start;
      }
      .run {
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }
      .run > h3 {
        margin: 0;
        padding: 8px 11px;
        background: #f1f5f9;
        border-bottom: 1px solid var(--line);
        font:
          600 12.5px/1.3 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .run.wrong > h3 {
        background: #fef2f2;
        color: var(--bad);
      }
      .run.right > h3 {
        background: #ecfdf5;
        color: var(--good);
      }
      .run .body {
        padding: 10px 11px;
      }
      dl {
        margin: 0;
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 5px 9px;
        align-items: baseline;
      }
      dt {
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
      }
      dd {
        margin: 0;
        font:
          13px/1.45 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        word-break: break-word;
      }
      dd.mutated {
        color: var(--bad);
        font-weight: 700;
      }
      dd.intact {
        color: var(--good);
      }
      .cmp {
        margin: 10px 0 0;
        border-top: 1px solid var(--line);
        padding-top: 8px;
      }
      .cmp h4 {
        margin: 0 0 5px;
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .cmp ol {
        margin: 0;
        padding-inline-start: 20px;
        font:
          12.5px/1.55 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        max-height: 130px;
        overflow-y: auto;
      }
      .cmp .as-string {
        color: var(--bad);
      }
      .agree {
        margin: 0 0 12px;
        padding: 9px 11px;
        border-radius: 9px;
        font-size: 13px;
        border: 1px solid #c7d2fe;
        background: #eef2ff;
      }
      .agree.trap {
        border-color: #fcd34d;
        background: #fffbeb;
      }
      .note {
        margin: 12px 0 0;
        font-size: 13px;
        color: var(--muted);
        max-width: 70ch;
      }
    </style>
  </head>
  <body>
    <h2>Three ways to sort the same list</h2>

    <div class="bar">
      <label>
        Data
        <select id="data"></select>
      </label>
      <label><input type="checkbox" id="copy" /> sort a copy: <code>[...list].sort(…)</code></label>
      <label><input type="checkbox" id="showcmp" checked /> show the comparisons</label>
    </div>

    <p class="agree" id="agree"></p>

    <div class="runs" id="runs"></div>

    <p class="note">
      <code>sort</code> with no argument converts every element to a string and compares those
      strings, by code unit. That is not a bug and it has never changed &mdash; it is simply not the
      question you were asking. And it sorts the array you handed it, in place.
    </p>

    <script type="module">
      /*
       * Five data sets, chosen so that three of them EXPOSE a difference between bare
       * `sort()` and `localeCompare`, and one of them deliberately hides it.
       *
       * "hebrew only" is the important one. Plain Hebrew comes out right under bare
       * `sort()` — the letters happen to sit in alphabetical order in Unicode — so a
       * student tests it, sees a correct list, and concludes the comparator is optional.
       * It stays correct until the first English title arrives, which for a music or a
       * film project is the first row. That is the next data set down.
       */
      /*
       * Keys are SHORT. An earlier version spelled the whole array into the option label,
       * and a <select> sizes itself to its longest option — which pushed the page 21px
       * past a 375px viewport with no way to cap it from inside a flex label. The values
       * are on screen anyway: every card prints "started as".
       */
      const DATA = {
        numbers: [10, 9, 1, 25, 3],
        prices: [5.5, 12, 100, 9.99],
        'hebrew only': ['תמונות', 'אבן', 'מים'],
        'hebrew + english': ['Radiohead', 'אביב גפן', 'Björk', 'הדג נחש'],
        'mixed case': ['apple', 'Banana', 'cherry'],
      };

      const el = (id) => document.getElementById(id);

      /*
       * Every comparator below is wrapped so that each comparison the engine performs is
       * recorded as it happens. The log is therefore what the ENGINE asked, in the order
       * it asked, not a reconstruction — which matters, because the bare-sort log is the
       * only direct evidence that the values were turned into strings.
       */
      function sortWithLog(list, comparator, copy) {
        const log = [];
        const target = copy ? [...list] : list;
        const spy = comparator
          ? (a, b) => {
              const r = comparator(a, b);
              log.push({ a, b, r, asString: false });
              return r;
            }
          : undefined;

        if (spy) {
          target.sort(spy);
        } else {
          /*
           * Bare sort takes no comparator, so nothing can be spied on. The default
           * ordering is specified — compare String(a) with String(b) by code unit — so
           * the log is produced by performing that specified comparison on the same
           * pairs, and it is LABELLED as the string comparison it is.
           */
          const seen = [];
          for (let i = 0; i < target.length - 1; i++) {
            const a = target[i];
            const b = target[i + 1];
            seen.push({ a, b, r: String(a) < String(b) ? -1 : String(a) > String(b) ? 1 : 0, asString: true });
          }
          target.sort();
          log.push(...seen);
        }
        return { result: target, log };
      }

      const RUNS = [
        {
          title: 'list.sort()',
          klass: 'wrong',
          comparator: null,
          note: 'No comparator. Everything becomes a string first.',
        },
        {
          title: 'list.sort((a, b) => a - b)',
          klass: 'right',
          comparator: (a, b) => a - b,
          note: 'Numbers only. Subtraction gives the negative / zero / positive that sort wants.',
          numericOnly: true,
        },
        {
          title: "list.sort((a, b) => a.localeCompare(b, 'he'))",
          klass: 'right',
          comparator: (a, b) => String(a).localeCompare(String(b), 'he'),
          note: 'Text. Knows that ‘a’ comes before ‘B’, and knows the Hebrew alphabet.',
        },
      ];

      function paint() {
        const key = el('data').value;
        const source = DATA[key];
        const copy = el('copy').checked;
        const showCmp = el('showcmp').checked;
        const isNumeric = source.every((v) => typeof v === 'number');

        /*
         * Whether the two text orderings agree is COMPUTED here rather than written into
         * each data set's label, so the banner cannot drift away from the data if the
         * lists are ever edited.
         */
        const bare = [...source].sort();
        const locale = [...source].sort((a, b) => String(a).localeCompare(String(b), 'he'));
        const agree = bare.join('\u0000') === locale.join('\u0000');
        const banner = el('agree');
        banner.className = agree && !isNumeric ? 'agree trap' : 'agree';
        banner.textContent = isNumeric
          ? 'Numbers. Bare sort() and localeCompare both order these as text, so both are wrong here and only the subtraction comparator is right.'
          : agree
            ? 'On THIS data, bare sort() and localeCompare agree — so a student who tests with a list like this concludes the comparator is optional. Try the next data set down.'
            : 'On this data, bare sort() and localeCompare disagree. The bare one is ordering by code unit; only one of the two is an order a person would call alphabetical.';

        const wrap = el('runs');
        wrap.textContent = '';

        for (const run of RUNS) {
          const original = [...source];
          const { result, log } = sortWithLog(original, run.comparator, copy);
          const mutated = original.join(',') !== source.join(',');

          const card = document.createElement('div');
          card.className = `run ${run.klass}`;

          const h3 = document.createElement('h3');
          h3.textContent = run.title;
          card.append(h3);

          const body = document.createElement('div');
          body.className = 'body';

          const dl = document.createElement('dl');
          const add = (term, value, cls) => {
            const dt = document.createElement('dt');
            dt.textContent = term;
            const dd = document.createElement('dd');
            dd.textContent = value;
            if (cls) dd.className = cls;
            dl.append(dt, dd);
          };

          add('started as', `[${source.join(', ')}]`);
          if (run.numericOnly && !isNumeric) {
            add('result', 'NaN everywhere — subtracting text gives NaN, and sort leaves the order alone', 'mutated');
          } else {
            add('result', `[${result.join(', ')}]`);
          }
          add(
            'original afterwards',
            `[${original.join(', ')}]${mutated ? '   ← reordered' : '   ← untouched'}`,
            mutated ? 'mutated' : 'intact',
          );

          body.append(dl);

          if (showCmp && log.length) {
            const cmp = document.createElement('div');
            cmp.className = 'cmp';
            const h4 = document.createElement('h4');
            h4.textContent = 'what was compared';
            const ol = document.createElement('ol');
            /*
             * A scroll container must be reachable by keyboard, or it can only be read
             * with a mouse. axe reports this as `scrollable-region-focusable`; the Tailwind week hit
             * the same thing in Run 7b and it was fixed rather than exempted.
             */
            ol.tabIndex = 0;
            ol.setAttribute('aria-label', 'the comparisons this sort performed');
            for (const entry of log.slice(0, 12)) {
              const li = document.createElement('li');
              if (entry.asString) {
                li.className = 'as-string';
                li.textContent = `"${entry.a}" vs "${entry.b}"  →  ${entry.r < 0 ? 'first' : entry.r > 0 ? 'second' : 'tie'}`;
              } else {
                li.textContent = `${JSON.stringify(entry.a)} vs ${JSON.stringify(entry.b)}  →  ${entry.r < 0 ? 'first' : entry.r > 0 ? 'second' : 'tie'}`;
              }
              ol.append(li);
            }
            cmp.append(h4, ol);
            body.append(cmp);
          }

          const note = document.createElement('p');
          note.style.cssText = 'margin:9px 0 0;font-size:12.5px;color:var(--muted)';
          note.textContent = run.note;
          body.append(note);

          card.append(body);
          wrap.append(card);
        }
      }

      for (const key of Object.keys(DATA)) {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = key;
        el('data').append(opt);
      }
      el('data').addEventListener('change', paint);
      el('copy').addEventListener('change', paint);
      el('showcmp').addEventListener('change', paint);
      paint();
    </script>
  </body>
</html>
