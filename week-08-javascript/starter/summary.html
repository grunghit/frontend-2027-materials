<!doctype html>
<!--
  ============================================================================
  summary.html — PART ד. The derived page.

  ── WHAT THIS IS
  The third page, and it has a rule the other two do not: IT HAS NO DATA OF ITS
  OWN. Everything on it is COUNTED from the items on the list page — how many,
  how many per category, the average, the oldest.

  The project brief says it in as many words: "an About page does not satisfy the
  requirement". The reason is week 10 — this page is where `selectSummary(state)`
  proves that derived values are derived and not stored, and a page with its own
  facts cannot prove anything.

  Today the numbers are hand-written and they must AGREE with index.html. If you
  wrote four items there, this page says four. That is the whole exercise.

  ── WHY NO JAVASCRIPT
  Because you would write it twice. In week 9 these pages get behaviour, and in
  week 10 the list stops being markup and starts being drawn from `state`. Anything
  you write today in a `<script>` tag is something you delete in week 10. The markup
  is not wasted: `render()` produces exactly this HTML.

  ── THE ONE RULE THAT MATTERS TODAY
  Decide which parts are STATIC and which are a MOUNT.
      STATIC   the header, the nav, the toolbar, the labels, the empty state.
               Written once, never rebuilt.
      MOUNT    the <ul> of items. In week 10 this is emptied and refilled on every
               state change, so nothing the user operates may live inside it.
  Getting this boundary right today is what makes week 10 a refactor rather than a
  rewrite. It is marked.

  Every marker class (the capital-letter one) is a place you write. DELETE THE MARKER
  when you are done with that element — the grader checks that none are left. A
  marker tagged {challenge} or data-tier="challenge" on its line belongs to the challenge tier:
  it may stay if you skip that part.
  ============================================================================
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>CODE-HERE — שם היישום שלך</title> <!-- {challenge} -->

    <script src="vendor/tailwind.js"></script>
    <style type="text/tailwindcss">
      /*
       * GIVEN, AND IT WORKS AS IT IS. This is the token layer from week 6. Change
       * `--color-brand` to make the page yours; change a lightness only if you
       * re-measure the contrast afterwards.
       */
      @theme static {
        --color-ink: oklch(0.22 0.02 260);
        --color-muted: oklch(0.48 0.02 260);
        --color-line: oklch(0.88 0.01 260);
        --color-page: oklch(0.99 0 0);
        --color-panel: oklch(0.97 0.005 260);
        --color-brand: oklch(0.45 0.17 275);
        --color-brand-ink: oklch(0.98 0 0);
      }
    </style>
  </head>

  <body class="bg-page text-ink font-sans">
    <a
      href="#main"
      class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:right-2 focus:z-10 focus:rounded-md focus:bg-brand focus:px-4 focus:py-2 focus:text-brand-ink"
      >דלג לתוכן</a
    >

    <!-- STATIC. The nav is on all three pages, and `aria-current` moves. -->
    <header class="border-b border-line">
      <nav class="mx-auto flex max-w-5xl flex-wrap items-center gap-6 px-4 py-4" aria-label="ראשי">
        <span class="CODE-HERE font-bold" data-tier="challenge">שם היישום</span>
        <a href="index.html" class="hover:text-brand">הרשימה</a>
        <a href="item.html" class="hover:text-brand">פריט</a>
        <a href="summary.html" aria-current="page" class="text-brand underline underline-offset-4">סיכום</a>
      </nav>
    </header>

    <main id="main" tabindex="-1" class="mx-auto max-w-3xl px-4 py-8">
      <h1 class="CODE-HERE text-2xl font-bold" data-tier="challenge">כותרת</h1>
      <p class="CODE-HERE mt-2 text-muted" data-tier="challenge">משפט אחד: מה מסוכם כאן, ומתוך מה.</p>

      <!-- Numbers COUNTED from index.html. They must agree with it. -->
      <div class="mt-6 grid gap-4 sm:grid-cols-3">
        <div class="rounded-lg border border-line bg-panel p-4">
          <p class="text-sm text-muted">סה"כ פריטים</p>
          <p class="CODE-HERE mt-1 text-3xl font-bold" data-tier="challenge">0</p>
        </div>
        <!-- CODE HERE {challenge} — two more derived numbers -->
      </div>

      <h2 class="CODE-HERE mt-8 text-lg font-semibold" data-tier="challenge">פילוח</h2>
      <ul id="breakdown" class="CODE-HERE mt-3 grid gap-2" data-tier="challenge">
        <!-- CODE HERE {challenge} — one row per group, with its count -->
      </ul>

      <p id="empty" hidden class="CODE-HERE mt-6 rounded-lg border border-line bg-panel p-6 text-muted" data-tier="challenge">
        אין עדיין נתונים לסכם.
      </p>
    </main>
  </body>
</html>
