<!doctype html>
<!--
  ============================================================================
  index.html — GIVEN AND COMPLETE. You do not edit this file.

  Everything you write is JavaScript, and the way you will know the data layer works is
  that a page you did not touch shows six real readings the instant it opens, with no
  network at all.

  ── THE CONTRACT. The grader and your CI both read these.

      #cities        THE MOUNT. Emptied and refilled by render()
      #summary       one sentence about the whole board
      #refresh-all   fetch every city at once
      #clear-cache   forget everything, with a confirmation
      #storage-note  a sentence when a WRITE failed. Hidden when it did not

  Each row that render() builds must be

      <li class="city" data-city="…" data-state="…">

  and `data-state` must always be exactly one of

      idle · loading · fresh · stale · error

  Inside it, whichever of these apply:

      .city-name   .city-temp   .city-sky   .city-wind   .city-age
      .city-empty  .city-error  button.refresh

  `data-state` is the whole assignment in one attribute. Open the Elements tab, press
  refresh, and watch it go idle → loading → fresh. When something is wrong, that
  attribute tells you what the application THINKS is happening, which is nearly always
  the question.
  ============================================================================
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>מזג האוויר — לוח מדידות</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- A module, and therefore deferred: it runs after the markup exists, which is why
         there is no DOMContentLoaded anywhere in this assignment. -->
    <script type="module" src="js/app.js"></script>
  </head>

  <body>
    <a class="skip-link" href="#main">דלג לתוכן</a>

    <header>
      <h1>מזג האוויר</h1>
      <p class="lead">
        שש ערים, מדידה נוכחית לכל אחת, ומטמון שיודע בן כמה הוא. <b>העמוד נפתח בלי רשת</b> — מה שנשמר
        מוצג מיד, ורק אם ביקשת נשלחת בקשה.
      </p>
    </header>

    <main id="main" tabindex="-1">
      <!-- A failed WRITE says so here. role="status" so a screen reader hears it without
           focus moving. Hidden until there is something to say — which is not the same as
           absent: an element that exists and is empty is one `hidden` away from speaking. -->
      <p id="storage-note" role="status" hidden class="storage-note"></p>

      <div class="bar">
        <button id="refresh-all" type="button" class="primary">רענן הכול</button>
        <button id="clear-cache" type="button">נקה מטמון</button>
        <p id="summary" class="summary"></p>
      </div>

      <!-- THE MOUNT. It ships empty. render() fills it. -->
      <ul id="cities" class="cities"></ul>
    </main>
  </body>
</html>
