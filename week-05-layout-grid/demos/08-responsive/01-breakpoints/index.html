<!doctype html>
<!--
  Mobile-first, and why min-width composes where max-width fights. Week 5, cycle 5's debrief.

  Two stylesheets that produce the SAME three layouts at the same three widths. One is
  written mobile-first with min-width, the other desktop-first with max-width. Both
  work. They are not equally good, and the difference is not taste.

  What makes it teach rather than merely demonstrate:

  1. Both stylesheets are printed in full, side by side, and the widths are driven by
     one slider. The room can see that the OUTPUT is identical and the SOURCE is not,
     which is the only honest way to argue about authoring style.
  2. The declaration count is counted, by the page, from its own rules. Desktop-first
     needs more declarations to say the same thing, because each narrower breakpoint
     has to UNDO what the wider one set. That is the actual cost and it is countable.
  3. The active query is highlighted live as the slider moves, and mobile-first shows
     TWO active blocks at desktop width while max-width shows one. That is what
     "composes" means, made visual: min-width rules accumulate, so each breakpoint only
     writes the delta.
  4. The breakpoints are derived from content, not devices. The readout names the exact
     width at which the card text stops fitting, and that number — not 768 — is where
     the query is. The legacy course shipped a table of device widths from 2015; this
     is the replacement for it, and the instructor notes say so by name.

  DEMO MOVE: drag slowly from 320 upward and watch the highlighted blocks. At the first
  breakpoint the mobile-first column lights a second block while keeping the first;
  the desktop-first column swaps one block for another. Ask which one you would rather
  debug at 2am.

  Then: "where did 560 come from?" — from the content. Drag to just under it and show
  the headline going to three lines. Nobody chose 560; the design did.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mobile-first versus desktop-first</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h2 {
        margin: 0 0 6px;
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        align-items: center;
        margin-bottom: 12px;
      }
      .controls label {
        font:
          600 13px/1.5 ui-monospace,
          Menlo,
          monospace;
      }
      input[type='range'] {
        accent-color: #1d4ed8;
        vertical-align: middle;
        min-width: 200px;
      }
      :focus-visible {
        outline: 3px solid #b45309;
        outline-offset: 2px;
      }

      .stage {
        padding: 10px;
        border: 2px dashed #7a8699;
        border-radius: 10px;
        background: #f8fafc;
        margin-bottom: 12px;
      }
      .frame {
        max-width: 100%;
        margin-inline: auto;
      }
      .page {
        display: grid;
        gap: 8px;
      }
      .region {
        padding: 10px;
        border-radius: 6px;
        font:
          700 12px/1.4 ui-monospace,
          Menlo,
          monospace;
        border: 2px solid #1d4ed8;
        background: #dbeafe;
        color: #1e3a8a;
      }
      .region.nav {
        border-color: #6d28d9;
        background: #ede9fe;
        color: #4c1d95;
      }
      .region.aside {
        border-color: #b45309;
        background: #fef3c7;
        color: #7c2d12;
      }
      .region h3 {
        margin: 0 0 4px;
        font-size: 15px;
        font-family: system-ui, sans-serif;
      }

      .sheets {
        display: grid;
        gap: 12px;
        grid-template-columns: minmax(0, 1fr);
      }
      @media (min-width: 52em) {
        .sheets {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      .sheet h2 {
        margin-bottom: 4px;
      }
      pre {
        margin: 0;
        padding: 10px 12px;
        border-radius: 8px;
        background: #14181f;
        color: #e6edf6;
        font:
          12px/1.6 ui-monospace,
          'SF Mono',
          Menlo,
          Consolas,
          monospace;
        overflow-x: auto;
      }
      pre b {
        display: block;
        background: #1e3a8a;
        color: #fff;
        font-weight: 400;
      }
      .count {
        margin: 6px 0 0;
        font:
          600 12px/1.5 ui-monospace,
          Menlo,
          monospace;
        color: var(--muted);
      }
      .readout {
        margin: 12px 0 0;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f1f5f9;
        font:
          13px/1.5 ui-monospace,
          'SF Mono',
          Menlo,
          Consolas,
          monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>

  <body>
    <div class="controls">
      <label for="width">viewport</label>
      <input type="range" id="width" min="320" max="1100" step="5" value="380" />
      <output id="width-out" for="width">380px</output>
    </div>

    <div class="stage">
      <div class="frame" id="frame">
        <div class="page" id="page">
          <div class="region nav">nav</div>
          <div class="region main">
            <h3>A headline that has to fit</h3>
            The width at which this stops fitting is the breakpoint. Not 768.
          </div>
          <div class="region aside">aside</div>
        </div>
      </div>
    </div>

    <div class="sheets">
      <div class="sheet">
        <h2>Mobile-first &mdash; min-width</h2>
        <pre id="mobile"></pre>
        <p class="count" id="mobile-count"></p>
      </div>
      <div class="sheet">
        <h2>Desktop-first &mdash; max-width</h2>
        <pre id="desktop"></pre>
        <p class="count" id="desktop-count"></p>
      </div>
    </div>

    <p class="readout" id="out" aria-live="polite"></p>

    <script>
      const SMALL = 560;
      const LARGE = 860;

      const frame = document.getElementById('frame');
      const page = document.getElementById('page');
      const width = document.getElementById('width');
      const widthOut = document.getElementById('width-out');
      const mobile = document.getElementById('mobile');
      const desktop = document.getElementById('desktop');
      const mobileCount = document.getElementById('mobile-count');
      const desktopCount = document.getElementById('desktop-count');
      const out = document.getElementById('out');

      /* The two stylesheets, as data, so the page can both APPLY them and PRINT them
         and the two can never drift apart. Each block carries the declarations it
         needs; counting them is the argument. */
      const MOBILE = [
        { test: () => true, label: '.page {', body: ['  grid-template-columns: 1fr;'] },
        {
          test: (w) => w >= SMALL,
          label: '@media (min-width: ' + SMALL + 'px) {',
          body: ['  .page { grid-template-columns: 1fr 1fr; }', '  .nav  { grid-column: 1 / -1; }'],
        },
        {
          test: (w) => w >= LARGE,
          label: '@media (min-width: ' + LARGE + 'px) {',
          body: ['  .page { grid-template-columns: 200px 1fr 200px; }'],
        },
      ];

      const DESKTOP = [
        {
          test: (w) => w >= LARGE,
          label: '.page {',
          body: ['  grid-template-columns: 200px 1fr 200px;'],
        },
        {
          test: (w) => w < LARGE && w >= SMALL,
          label: '@media (max-width: ' + (LARGE - 1) + 'px) {',
          body: ['  .page { grid-template-columns: 1fr 1fr; }', '  .nav  { grid-column: 1 / -1; }'],
        },
        {
          test: (w) => w < SMALL,
          label: '@media (max-width: ' + (SMALL - 1) + 'px) {',
          body: ['  .page { grid-template-columns: 1fr; }', '  .nav  { grid-column: auto; }'],
        },
      ];

      function paint(pre, blocks, w) {
        pre.replaceChildren();
        let active = 0;
        for (const block of blocks) {
          const on = block.test(w);
          if (on) active += 1;
          const text = block.label + '\n' + block.body.join('\n') + '\n}\n';
          if (on) {
            const b = document.createElement('b');
            b.textContent = text;
            pre.append(b);
          } else {
            pre.append(document.createTextNode(text));
          }
        }
        return active;
      }

      const declarations = (blocks) => blocks.reduce((n, b) => n + b.body.length, 0);

      function render() {
        const w = Number(width.value);
        widthOut.textContent = w + 'px';
        frame.style.width = w + 'px';

        /* Apply the layout the mobile-first sheet describes at this width. Both sheets
           describe the same thing, so one application is enough. */
        page.style.gridTemplateColumns =
          w >= LARGE ? '200px 1fr 200px' : w >= SMALL ? '1fr 1fr' : '1fr';
        page.querySelector('.nav').style.gridColumn = w >= SMALL ? '1 / -1' : 'auto';

        const mActive = paint(mobile, MOBILE, w);
        const dActive = paint(desktop, DESKTOP, w);
        mobileCount.textContent =
          declarations(MOBILE) + ' declarations, ' + mActive + ' block(s) applying now';
        desktopCount.textContent =
          declarations(DESKTOP) + ' declarations, ' + dActive + ' block(s) applying now';

        out.textContent =
          '  viewport ' +
          w +
          'px\n' +
          '  breakpoints ' +
          SMALL +
          'px and ' +
          LARGE +
          'px\n\n' +
          '  mobile-first   ' +
          declarations(MOBILE) +
          ' declarations   ' +
          mActive +
          ' block(s) live\n' +
          '  desktop-first  ' +
          declarations(DESKTOP) +
          ' declarations   ' +
          dActive +
          ' block(s) live\n\n' +
          '  Both produce the same layout. Look at what each one had to SAY.\n\n' +
          '  Mobile-first blocks ACCUMULATE. The base rule is the simplest case, and\n' +
          '  every breakpoint above it adds only what changed. At the widest size all\n' +
          '  three blocks are live at once and none of them contradicts another.\n\n' +
          '  Desktop-first blocks REPLACE. The base rule is the most complicated case,\n' +
          '  so every narrower breakpoint has to undo it — notice `grid-column: auto`\n' +
          '  in the last block, which exists for no reason except to cancel a line in\n' +
          '  the block above. That line is the whole argument. It is not a nicer style;\n' +
          '  it is one less thing that can be forgotten.\n\n' +
          '  WHERE THE NUMBERS CAME FROM\n' +
          '  Not from a phone. Drag to just under ' +
          SMALL +
          ' and watch the headline and the\n' +
          '  body text run out of room — THAT is where the breakpoint is, and it moved\n' +
          '  when the content changed. Device-width tables age; content does not.\n\n' +
          '  Also: the base rule needs no media query at all. A phone never downloads\n' +
          '  or evaluates the parts of the design it will not use.';
      }

      width.addEventListener('input', render);
      render();
    </script>
  </body>
</html>
