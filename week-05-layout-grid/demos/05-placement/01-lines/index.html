<!doctype html>
<!--
  Line-based placement. Week 5, cycle 2 (placement by line).

  A fixed 4x3 grid with the lines drawn and numbered, and one item you can move around
  by editing its `grid-column` and `grid-row`. The generated CSS is printed as you go,
  so the syntax is read off the thing it produced rather than memorised from a table.

  What makes it teach rather than merely demonstrate:

  1. Items are placed BETWEEN LINES, and this page never once says "cell". The four
     number inputs are labelled column-start, column-end, row-start, row-end, because
     that is what the property actually takes, and the off-by-one that everyone hits
     ("I want the first two columns, so 1 / 2") is visible the moment they try it.
  2. Negative line numbers are first-class. The end inputs accept -1, and there is a
     button for it, because `grid-column: 1 / -1` is the single most useful placement
     in real page layout and it looks like a magic incantation until you have seen the
     numbering run backwards.
  3. `span` is offered as an alternative spelling of the same placement, and the page
     shows both forms of the CURRENT position simultaneously. Students meet `span 2`
     in other people's code long before they would choose it themselves.
  4. Everything else in the grid is ordinary auto-placed content, so the room can watch
     the auto-placement algorithm route items AROUND the explicitly placed one. That
     re-flow is the thing that makes Grid feel alive, and it is invisible in a diagram.

  DEMO MOVE: put the item at 1 / 2 and ask why it only covers one column. Let someone
  say "because you counted cells". Then 1 / 3. Then press the "-1" button and resize
  nothing at all — just change grid-template-columns with the track buttons and show
  that 1 / -1 survives a change of track count while 1 / 5 does not. That is the whole
  argument for negative lines and it takes fifteen seconds.

  Keyboard: the number inputs are real number inputs, so arrow keys nudge the item
  around the grid, which is a pleasant way to show span growth without the mouse.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Line-based placement</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: center;
        margin-bottom: 10px;
      }
      .controls label {
        font:
          600 12px/1.5 ui-monospace,
          Menlo,
          monospace;
      }
      .controls input[type='number'] {
        width: 58px;
        font:
          13px/1.4 ui-monospace,
          Menlo,
          monospace;
        padding: 4px 6px;
        border: 2px solid var(--line);
        border-radius: 6px;
      }
      button {
        font:
          600 12px/1.4 ui-monospace,
          Menlo,
          monospace;
        padding: 5px 10px;
        border: 1px solid #7a8699;
        border-radius: 999px;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid #b45309;
        outline-offset: 2px;
      }

      .stage {
        padding: 10px;
        border: 2px dashed #7a8699;
        border-radius: 10px;
        background: #f8fafc;
      }
      .measured {
        position: relative;
        padding-top: 18px;
        padding-left: 22px;
      }
      .lines span {
        position: absolute;
        font:
          700 11px/1 ui-monospace,
          Menlo,
          monospace;
        color: #b45309;
      }
      .lines .col {
        inset-block-start: 0;
      }
      .lines .row {
        inset-inline-start: 0;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(3, 54px);
        gap: 8px;
      }
      .cell {
        border-radius: 6px;
        background: #e2e8f0;
        border: 2px solid #94a3b8;
        color: var(--muted);
        display: grid;
        place-content: center;
        font:
          600 12px/1.3 ui-monospace,
          Menlo,
          monospace;
      }
      .placed {
        background: #dbeafe;
        border: 3px solid #1d4ed8;
        color: #1e3a8a;
        font-weight: 700;
      }

      pre {
        margin: 12px 0 0;
        padding: 12px 14px;
        border-radius: 8px;
        background: #14181f;
        color: #e6edf6;
        font:
          13px/1.6 ui-monospace,
          'SF Mono',
          Menlo,
          Consolas,
          monospace;
        overflow-x: auto;
      }
      .readout {
        margin: 10px 0 0;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f1f5f9;
        font:
          13px/1.5 ui-monospace,
          'SF Mono',
          Menlo,
          Consolas,
          monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>

  <body>
    <div class="controls">
      <label for="cs">column-start</label>
      <input type="number" id="cs" value="1" min="1" max="5" />
      <label for="ce">column-end</label>
      <input type="number" id="ce" value="3" min="-5" max="5" />
      <label for="rs">row-start</label>
      <input type="number" id="rs" value="1" min="1" max="4" />
      <label for="re">row-end</label>
      <input type="number" id="re" value="2" min="-4" max="4" />
      <button type="button" id="full">column-end = -1</button>
      <button type="button" id="tracks">toggle 4 / 6 columns</button>
    </div>

    <h2>A 4 x 3 grid. One item is placed; the rest flow around it.</h2>
    <div class="stage">
      <div class="measured">
        <div class="lines" id="lines" aria-hidden="true"></div>
        <div class="grid" id="grid"></div>
      </div>
    </div>

    <pre id="css"></pre>
    <p class="readout" id="out" aria-live="polite"></p>

    <script>
      const grid = document.getElementById('grid');
      const lines = document.getElementById('lines');
      const css = document.getElementById('css');
      const out = document.getElementById('out');
      const inputs = {
        cs: document.getElementById('cs'),
        ce: document.getElementById('ce'),
        rs: document.getElementById('rs'),
        re: document.getElementById('re'),
      };
      let columns = 4;

      document.getElementById('full').addEventListener('click', () => {
        inputs.cs.value = 1;
        inputs.ce.value = -1;
        render();
      });
      document.getElementById('tracks').addEventListener('click', () => {
        columns = columns === 4 ? 6 : 4;
        render();
      });

      function render() {
        grid.style.gridTemplateColumns = 'repeat(' + columns + ', 1fr)';

        grid.replaceChildren();
        const placed = document.createElement('div');
        placed.className = 'cell placed';
        placed.textContent = 'placed';
        placed.style.gridColumn = inputs.cs.value + ' / ' + inputs.ce.value;
        placed.style.gridRow = inputs.rs.value + ' / ' + inputs.re.value;
        grid.append(placed);

        /* Ordinary auto-placed content. The interesting thing is not these boxes, it
           is that the algorithm routes them around the explicitly placed one without
           anybody telling it to. */
        for (let i = 0; i < columns * 3 - 1; i += 1) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.textContent = String(i + 1);
          grid.append(cell);
        }

        requestAnimationFrame(() => {
          const box = grid.getBoundingClientRect();
          const cells = [...grid.children];
          lines.replaceChildren();

          /* Column line numbers along the top, row line numbers down the side. Both
             measured off real boxes, so they stay honest when the track count changes. */
          const firstRow = cells.filter((c) => {
            const r = c.getBoundingClientRect();
            return Math.abs(r.top - box.top) < 2;
          });
          const xs = firstRow.map((c) => c.getBoundingClientRect().left - box.left);
          if (firstRow.length) {
            xs.push(firstRow[firstRow.length - 1].getBoundingClientRect().right - box.left);
          }
          xs.forEach((x, i) => {
            const s = document.createElement('span');
            s.className = 'col';
            s.textContent = String(i + 1);
            s.style.insetInlineStart = 22 + x + 'px';
            lines.append(s);
          });

          const ys = [];
          const seen = new Set();
          cells.forEach((c) => {
            const r = c.getBoundingClientRect();
            const top = Math.round(r.top - box.top);
            if (!seen.has(top)) {
              seen.add(top);
              ys.push(top);
            }
          });
          ys.sort((a, b) => a - b);
          ys.push(Math.round(box.height));
          ys.forEach((y, i) => {
            const s = document.createElement('span');
            s.className = 'row';
            s.textContent = String(i + 1);
            s.style.insetBlockStart = 18 + y + 'px';
            lines.append(s);
          });

          const cs = Number(inputs.cs.value);
          const ce = Number(inputs.ce.value);
          const rs = Number(inputs.rs.value);
          const re = Number(inputs.re.value);
          const colSpan = ce < 0 ? columns + 1 + ce - cs : ce - cs;
          const rowSpan = re < 0 ? 4 + re - rs : re - rs;

          css.textContent =
            '.placed {\n' +
            '  grid-column: ' +
            cs +
            ' / ' +
            ce +
            ';\n' +
            '  grid-row: ' +
            rs +
            ' / ' +
            re +
            ';\n}\n\n' +
            '/* the same placement, written with span */\n' +
            '.placed {\n' +
            '  grid-column: ' +
            cs +
            ' / span ' +
            Math.max(colSpan, 1) +
            ';\n' +
            '  grid-row: ' +
            rs +
            ' / span ' +
            Math.max(rowSpan, 1) +
            ';\n}';

          out.textContent =
            '  columns in this grid   ' +
            columns +
            '   (so lines 1 to ' +
            (columns + 1) +
            ')\n' +
            '  the item covers        ' +
            Math.max(colSpan, 1) +
            ' column' +
            (colSpan === 1 ? '' : 's') +
            ', ' +
            Math.max(rowSpan, 1) +
            ' row' +
            (rowSpan === 1 ? '' : 's') +
            '\n\n' +
            (ce === cs + 1
              ? '  Start 1, end 2 covers ONE column, not two. The numbers are the lines\n' +
                '  on either side of the thing, not the things themselves — which is the\n' +
                '  off-by-one everybody meets exactly once.\n\n'
              : '') +
            (ce < 0
              ? '  A negative line is counted from the end, so -1 is the last line in the\n' +
                '  grid whatever the track count turns out to be. Press the track button and\n' +
                '  watch this placement survive a change that a hard-coded ' +
                (columns + 1) +
                ' would not.\n\n' +
                '  `grid-column: 1 / -1` is how a masthead spans a page shell it does not\n' +
                '  need to know the width of.'
              : '  Try the -1 button, then change the track count. A number you wrote by\n' +
                '  hand goes stale the moment the design changes; -1 does not.');
        });
      }

      for (const input of Object.values(inputs)) {
        input.addEventListener('input', render);
      }
      addEventListener('resize', render);
      render();
    </script>
  </body>
</html>
