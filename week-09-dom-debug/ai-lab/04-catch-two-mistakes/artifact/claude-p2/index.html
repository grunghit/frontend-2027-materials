<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Watch later</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <main>
      <h1>Watch later</h1>
      <p class="lead">Talks I mean to watch this week.</p>

      <form id="add-talk" class="add-talk">
        <div class="field">
          <label for="talk-title">Talk</label>
          <input id="talk-title" name="title" type="text" autocomplete="off" />
        </div>
        <div class="field">
          <label for="talk-minutes">Minutes</label>
          <input id="talk-minutes" name="minutes" type="number" />
        </div>
        <button type="submit">Add</button>
      </form>

      <ul id="queue" class="queue"></ul>
    </main>
    <footer class="foot">
      <p>Watch later · the page cycle 4 pastes to Claude</p>
    </footer>
  </body>
</html>
