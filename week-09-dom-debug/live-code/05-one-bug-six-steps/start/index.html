<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>The Tool Shelf</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <header class="masthead">
      <p class="brand">The Tool Shelf</p>
      <button type="button" class="shortcut" data-key="n">New tool <kbd>N</kbd></button>
    </header>
    <main>
      <h1>On the shelf</h1>

      <form id="add-tool" class="add-tool">
        <div class="field">
          <label for="tool-name">Tool</label>
          <input id="tool-name" name="name" type="text" autocomplete="off" />
        </div>
        <div class="field">
          <label for="tool-qty">How many</label>
          <input id="tool-qty" name="qty" type="number" />
        </div>
        <button type="submit">Add to the shelf</button>
      </form>
      <p id="tool-error" class="error" role="status"></p>

      <p class="summary"><span id="count">0</span> tools</p>
      <ul id="shelf" class="shelf"></ul>
      <p id="empty" class="empty" hidden>The shelf is empty. Add the first tool above.</p>
    </main>
  </body>
</html>
