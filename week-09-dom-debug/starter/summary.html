<!doctype html>
<!--
  ============================================================================
  summary.html — the summary page.

  IT HOLDS NO DATA OF ITS OWN. Both numbers are computed from `js/items.js`, which is
  the same module the list page reads — so "the summary disagrees with the list" is a
  bug that cannot happen here. Note what it CANNOT do yet: add an item on the list page
  and reload this one, and the number is back to three. Nothing is saved anywhere until
  week 11, and that is the honest state of the project this week.
  ============================================================================
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>CODE-HERE — עמוד הסיכום</title>

    <script src="vendor/tailwind.js"></script>
    <style type="text/tailwindcss">
      /* GIVEN, AND IT WORKS AS IT IS. The token layer from week 6. */
      @theme static {
        --color-ink: oklch(0.22 0.02 260);
        --color-muted: oklch(0.42 0.02 260);
        --color-line: oklch(0.85 0.01 260);
        --color-page: oklch(0.99 0 0);
        --color-panel: oklch(0.97 0.005 260);
        --color-brand: oklch(0.45 0.17 275);
        --color-brand-ink: oklch(0.98 0 0);
        --color-bad: oklch(0.48 0.19 25);
      }
    </style>

    <!-- Both numbers are COUNTED from the same module the list page reads. This page
         holds no data of its own, so the two can never disagree. -->
    <script type="module" src="js/summary.js"></script>
  </head>

  <body class="bg-page text-ink font-sans">
    <a
      href="#main"
      class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:right-2 focus:z-10 focus:rounded-md focus:bg-brand focus:px-4 focus:py-2 focus:text-brand-ink"
      >דלג לתוכן</a
    >

    <header class="border-b border-line">
      <nav class="mx-auto flex max-w-5xl flex-wrap items-center gap-6 px-4 py-4" aria-label="ראשי">
        <span class="CODE-HERE font-bold">שם היישום</span>
        <a href="index.html" class="hover:text-brand">הרשימה</a>
        <a href="item.html" class="hover:text-brand">פריט</a>
        <a href="summary.html" aria-current="page" class="text-brand underline underline-offset-4"
          >סיכום</a
        >
      </nav>
    </header>

    <main id="main" tabindex="-1" class="mx-auto max-w-5xl px-4 py-8">
      <h1 class="CODE-HERE text-2xl font-bold">סיכום</h1>
      <p class="mt-2 text-muted">
        <span class="CODE-HERE">מה העמוד הזה מסכם, במשפט.</span>
      </p>

      <dl class="mt-6 grid gap-3 rounded-lg border border-line bg-panel p-4 sm:grid-cols-2">
        <div>
          <dt class="text-sm text-muted">מספר פריטים</dt>
          <dd id="summary-count" class="text-2xl font-bold">0</dd>
        </div>
        <div>
          <dt class="text-sm text-muted">CODE-HERE מדד שני משלך</dt>
          <dd id="summary-extra" class="text-2xl font-bold">0</dd>
        </div>
      </dl>

      <p class="mt-6">
        <a href="index.html" class="text-brand underline underline-offset-4">חזרה לרשימה</a>
      </p>
    </main>
