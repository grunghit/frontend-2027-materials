<!doctype html>
<!--
  Week 9 warm-up, the you-do of cycle 3. Eight minutes, AI-free, no git, no grade, and no marks anywhere for it.

  Five small DOM functions in `warmup.js`. Four are wrong and one is already correct.
  The referee runs all five and reports what it expected against what it got — and
  never says which line.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>חימום שבוע 9</title>
    <script type="module" src="referee.js"></script>
    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #4b5563;
        --line: #cbd5e1;
        --ok: #15803d;
        --bad: #b91c1c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        font:
          16px/1.6 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: var(--ink);
        background: #fff;
      }
      main {
        max-width: 48rem;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 1.5rem;
      }
      .sub {
        margin: 0 0 20px;
        color: var(--muted);
      }
      .summary {
        margin: 0 0 16px;
        padding: 12px 16px;
        border-radius: 10px;
        font-weight: 700;
      }
      .summary.ok {
        background: #dcfce7;
        color: #14532d;
      }
      .summary.bad {
        background: #fef2f2;
        color: #7f1d1d;
      }
      .line {
        border: 1px solid var(--line);
        border-inline-start-width: 5px;
        border-radius: 10px;
        padding: 10px 14px;
        margin-block-end: 10px;
        background: #f8fafc;
      }
      .line.ok {
        border-inline-start-color: var(--ok);
      }
      .line.bad {
        border-inline-start-color: var(--bad);
      }
      .line code {
        font:
          700 0.95rem ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .what {
        margin: 2px 0 6px;
        color: var(--muted);
        font-size: 0.92rem;
      }
      .detail {
        margin: 0;
        font-size: 0.92rem;
      }
      .line.bad .detail {
        color: var(--bad);
        font-weight: 600;
      }
      #sandbox {
        display: none;
      }
      /* The stylesheet already knows what a finished row looks like. One of the five
         functions is supposed to reach it. */
      .rows .done {
        text-decoration: line-through;
        opacity: 0.6;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>חימום — חמש פונקציות שנוגעות בעמוד</h1>
      <p class="sub">
        שבע דקות, בלי AI — ה-you-do של מחזור 3. אין git, אין ציון. פתח את <code>warmup.js</code>, הרץ, ותקן עד שכל החמש ירוקות.
        <b>אחת מהן כבר תקינה.</b>
      </p>

      <p id="summary" class="summary">מריץ…</p>
      <div id="report"></div>

      <!-- The referee builds its lists in here. -->
      <div id="sandbox"></div>
    </main>
    <footer class="sub">
      <p>שבוע 9 · מחזור 3 · החימום</p>
    </footer>
  </body>
</html>
