<!doctype html>
<!--
  Finding things. Week 9: the reference deck, pointed at from cycle 1.

  Type a CSS selector. The page runs it against the sample markup below, highlights every
  match, marks which one `querySelector` would have returned, and prints the count. Nine
  preset selectors are one click away, including two that match nothing and one that is
  not a valid selector at all.

  What makes it teach rather than merely demonstrate:

  1. IT IS THE SAME SELECTOR LANGUAGE AS WEEK 3, AND THE PAGE SAYS SO. Students treat
     `querySelectorAll` as a new thing to learn. It is the week-3 selector they already
     write, handed to JavaScript. The preset list is deliberately made of week-3 selectors.
  2. `null` IS A RESULT, NOT AN ERROR — AND IT IS THE ERROR THEY WILL ACTUALLY GET.
     Two presets match nothing. The readout prints `querySelector → null` and then the
     exact TypeError you get one line later, produced by really calling `.textContent`
     on it inside a try/catch. That message is the one from bug 1 of the debug challenge.
  3. LIVE VERSUS STATIC IS MEASURED. `getElementsByClassName` and `querySelectorAll` are
     both taken BEFORE a new card is added, and both lengths are printed after. One
     changed by itself. Nobody believes this until they see the two numbers disagree.
  4. THE INVALID SELECTOR IS CAUGHT AND SHOWN. `querySelectorAll('#')` throws a
     SyntaxError; the page prints it rather than dying, because "my selector is a typo"
     and "my element is missing" produce two different failures and students merge them.

  DEMO MOVE: type `.card p` and then `.card > p` and let the room explain the difference
  from the highlight count alone before you say anything.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>querySelector, measured</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
        --accent: #4338ca;
        --hit: #f59e0b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 10px;
      }
      input,
      button {
        font: inherit;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 7px;
        padding: 5px 11px;
        color: inherit;
      }
      input {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        min-width: 15ch;
        flex: 1 1 22ch;
      }
      button {
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--hit);
        outline-offset: 2px;
      }
      .presets {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 12px;
      }
      .presets button {
        font:
          12.5px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        padding: 3px 8px;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
        gap: 14px;
        align-items: start;
      }
      @media (max-width: 820px) {
        .layout {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .panel {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #f8fafc;
        padding: 11px 12px;
      }
      .panel h3 {
        margin: 0 0 8px;
        font-size: 12px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #sample {
        display: grid;
        gap: 10px;
      }
      #sample article {
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 9px 11px;
        background: #fff;
      }
      #sample h4 {
        margin: 0 0 4px;
        font-size: 15px;
      }
      #sample p {
        margin: 0 0 4px;
        font-size: 13.5px;
      }
      #sample .meta {
        color: var(--muted);
        font-size: 12.5px;
      }
      #sample .sale {
        font-weight: 700;
      }
      .match {
        outline: 3px solid var(--hit);
        outline-offset: 2px;
        border-radius: 4px;
      }
      .first {
        background: #fef3c7;
      }
      .out {
        font:
          13px/1.7 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .out div {
        border-bottom: 1px dashed var(--line);
        padding: 3px 0;
      }
      .out b {
        color: var(--accent);
      }
      .out .bad {
        color: #b91c1c;
      }
      .out .good {
        color: #0f766e;
      }
      .note {
        margin: 10px 0 0;
        padding: 9px 11px;
        border-radius: 9px;
        background: #eef2ff;
        border: 1px solid #c7d2fe;
        font-size: 13px;
      }
      .note code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .disagree {
        background: #fff7ed;
        border-color: #fdba74;
      }
    </style>
  </head>
  <body>
    <h2>One selector, four questions the page answers for you</h2>

    <div class="bar">
      <label for="sel">selector</label>
      <input id="sel" type="text" value=".card p" spellcheck="false" />
      <button type="button" id="run" class="primary">run</button>
      <button type="button" id="addcard">add a card</button>
      <button type="button" id="reset">reset</button>
    </div>

    <div class="presets" id="presets"></div>

    <div class="layout">
      <div class="panel">
        <h3>The markup being searched</h3>
        <div id="sample">
          <article class="card" id="first-card">
            <h4>Coffee grinder</h4>
            <p>Burr, 40 steps, quiet.</p>
            <p class="meta">In stock · <span class="sale">89</span></p>
          </article>
          <article class="card">
            <h4>Kettle</h4>
            <p>Gooseneck, variable temperature.</p>
            <p class="meta">Backorder · <span>120</span></p>
          </article>
          <article class="card wide">
            <h4>Scale</h4>
            <p>0.1 g, two-year battery.</p>
            <p class="meta">In stock · <span class="sale">45</span></p>
          </article>
        </div>
      </div>

      <div class="panel">
        <h3>What the browser answered</h3>
        <div class="out" id="out"></div>
        <p class="note" id="live"></p>
      </div>
    </div>

    <script>
      const sample = document.getElementById('sample');
      const out = document.getElementById('out');
      const input = document.getElementById('sel');
      const ORIGINAL = sample.innerHTML;

      const PRESETS = [
        '.card p',
        '.card > p',
        'p.meta',
        '#first-card',
        'article .sale',
        'article:first-of-type h4',
        '.card:not(.wide)',
        '.cart',
        'button.buy',
        '#',
      ];

      /*
        Taken ONCE, here, before anything is added. That is the whole experiment:
        `getElementsByClassName` returns a live HTMLCollection that keeps looking at the
        document, and `querySelectorAll` returns a static NodeList that was a snapshot.
      */
      const liveCards = sample.getElementsByClassName('card');
      const staticCards = sample.querySelectorAll('.card');

      const esc = (s) =>
        s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
      const label = (el) => {
        const id = el.id ? `#${el.id}` : '';
        const cls = el.className ? `.${String(el.className).trim().split(/\s+/).join('.')}` : '';
        return `${el.tagName.toLowerCase()}${id}${cls}`;
      };

      function clearMarks() {
        for (const el of sample.querySelectorAll('.match, .first'))
          el.classList.remove('match', 'first');
      }

      function run() {
        const selector = input.value.trim();
        clearMarks();
        const lines = [];

        let all = null;
        try {
          all = sample.querySelectorAll(selector);
        } catch (err) {
          lines.push(`<div><b>querySelectorAll</b> threw</div>`);
          lines.push(`<div class="bad">${esc(err.name)}: ${esc(err.message)}</div>`);
          lines.push(
            `<div>A selector the browser cannot parse is a <b>SyntaxError</b>, and it happens the moment you call it.</div>`,
          );
          out.innerHTML = lines.join('');
          liveVsStatic();
          return;
        }

        const first = sample.querySelector(selector);
        for (const el of all) el.classList.add('match');
        if (first) first.classList.add('first');

        lines.push(`<div><b>querySelectorAll</b> → NodeList(${all.length})</div>`);
        lines.push(
          first
            ? `<div><b>querySelector</b> → <span class="good">${esc(label(first))}</span> — the first match in document order, highlighted in yellow</div>`
            : `<div><b>querySelector</b> → <span class="bad">null</span></div>`,
        );

        if (all.length === 0) {
          /* The TypeError is produced for real, not quoted. It is the message from bug 1
             of the debug challenge, and this is where the room meets it first. */
          let message = '';
          try {
            first.textContent = 'x';
          } catch (err) {
            message = `${err.name}: ${err.message}`;
          }
          lines.push(`<div>Then the next line of your code runs:</div>`);
          lines.push(`<div class="bad">${esc(message)}</div>`);
          lines.push(
            `<div>Nothing is broken about the page. <b>The selector matched nothing</b>, and reading a property of <code>null</code> is what says so.</div>`,
          );
        } else {
          lines.push(
            `<div>Matched: ${[...all]
              .map((el) => esc(label(el)))
              .slice(0, 6)
              .join(' · ')}${all.length > 6 ? ' …' : ''}</div>`,
          );
        }

        out.innerHTML = lines.join('');
        liveVsStatic();
      }

      function liveVsStatic() {
        const note = document.getElementById('live');
        const disagree = liveCards.length !== staticCards.length;
        note.classList.toggle('disagree', disagree);
        note.innerHTML =
          `Both of these were taken before you pressed anything: ` +
          `<code>getElementsByClassName('card')</code> → <b>${liveCards.length}</b> · ` +
          `<code>querySelectorAll('.card')</code> → <b>${staticCards.length}</b>. ` +
          (disagree
            ? 'They disagree now. The first is <b>live</b> — it re-answers the question every time you ask. The second was a <b>snapshot</b>.'
            : 'Press “add a card” and watch which of the two numbers changes on its own.');
      }

      for (const p of PRESETS) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = p;
        b.addEventListener('click', () => {
          input.value = p;
          run();
        });
        document.getElementById('presets').append(b);
      }

      document.getElementById('run').addEventListener('click', run);
      input.addEventListener('input', run);

      document.getElementById('addcard').addEventListener('click', () => {
        const art = document.createElement('article');
        art.className = 'card';
        const h = document.createElement('h4');
        h.textContent = 'Filter papers';
        const p = document.createElement('p');
        p.textContent = 'Bleached, 100 per box.';
        const meta = document.createElement('p');
        meta.className = 'meta';
        meta.textContent = 'In stock · 12';
        art.append(h, p, meta);
        sample.append(art);
        run();
      });

      document.getElementById('reset').addEventListener('click', () => {
        sample.innerHTML = ORIGINAL;
        run();
      });

      run();
    </script>
  </body>
</html>
