<!doctype html>
<!--
  em compounding — stage 1 of 2. The bug that looks like a typo and is not.

  Every level of this nested list says exactly the same thing:

      li { font-size: 0.9em; padding-left: 1em; }

  One rule. One value. And the text gets smaller at every level, because `em` means
  "times the font-size of THIS element's parent", and at level 3 the parent's font-size
  was already the result of two previous multiplications:

      16  →  14.4  →  12.96  →  11.66  →  10.49

  The padding does the same thing in the other direction, because 1em is now measured
  against a font that keeps shrinking, so the indent gets tighter as the nesting gets
  deeper — the exact opposite of what a nested list wants.

  DEMO MOVE: ask what font-size the deepest item has. Everyone says 0.9 of something.
  Press the button and read the pixels. Then open ../02-rem/ — identical markup, one
  character changed.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>em compounds</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-size: 16px;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        line-height: 1.5;
        color: #14181f;
        background: #fff;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #5c6675;
      }

      /* ── The one rule. Written once, applied at every level. ──────────────── */
      li {
        font-size: 0.9em;
        padding-left: 1em;
        border-left: 2px solid #fca5a5;
        margin: 3px 0;
      }

      ul {
        margin: 0;
        padding-left: 12px;
        list-style: none;
      }

      .readout {
        margin-top: 14px;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #f1f5f9;
        font: 13px/1.7 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }
      button {
        font: 15px/1.3 system-ui, sans-serif;
        padding: 8px 14px;
        border: 1px solid #14181f;
        border-radius: 999px;
        background: #fff;
        color: #14181f;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #1d4ed8;
        outline-offset: 2px;
      }
    </style>
  </head>

  <body>
    <h2>One rule: li { font-size: 0.9em }</h2>

    <ul>
      <li id="l1">
        Drinks
        <ul>
          <li id="l2">
            Coffee
            <ul>
              <li id="l3">
                Filter
                <ul>
                  <li id="l4">
                    Ethiopia
                    <ul>
                      <li id="l5">Guji, washed</li>
                    </ul>
                  </li>
                </ul>
              </li>
            </ul>
          </li>
        </ul>
      </li>
    </ul>

    <p><button type="button" id="measure">measure every level</button></p>
    <p class="readout" id="out" aria-live="polite">Guess the size of the deepest item first.</p>

    <script>
      document.getElementById('measure').addEventListener('click', () => {
        const lines = ['level   declared   computed font-size   computed padding-left'];
        for (let level = 1; level <= 5; level++) {
          const el = document.getElementById('l' + level);
          const style = getComputedStyle(el);
          lines.push(
            String(level).padEnd(8) +
              '0.9em'.padEnd(11) +
              style.fontSize.padEnd(21) +
              style.paddingLeft,
          );
        }
        lines.push('');
        lines.push('Same rule at every level. Five different sizes.');
        document.getElementById('out').textContent = lines.join('\n');
      });
    </script>
  </body>
</html>
