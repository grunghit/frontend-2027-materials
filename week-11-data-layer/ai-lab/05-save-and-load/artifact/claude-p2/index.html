<!doctype html>
<!--
  claude-p2/: the answer to P2 (the constrained re-ask), pasted in as it came back. On top
  of the start: the class lending library as week 10 left it — it forgets on a
  reload, and the catalogue box at the bottom (#cat-q, #cat-msg, #cat-results) is wired
  to nothing. P1 asks Claude for both halves at once: "save it" and "search Open Library".
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>ספריית ההשאלה — הרשימה</title>
    <script src="vendor/tailwind.js"></script>
    <style type="text/tailwindcss">
      @theme static {
        --color-ink: oklch(0.23 0.02 250);
        --color-soft: oklch(0.43 0.02 250);
        --color-edge: oklch(0.84 0.01 250);
        --color-paper: oklch(0.99 0.003 90);
        --color-card: oklch(0.97 0.006 90);
        --color-accent: oklch(0.44 0.11 165);
        --color-accent-ink: oklch(0.99 0 0);
        --color-warn: oklch(0.48 0.19 25);
      }
    </style>
    <script type="module" src="js/app.js"></script>
  </head>
  <body class="bg-paper text-ink">
    <header class="border-b border-edge">
      <nav class="mx-auto flex max-w-3xl gap-6 px-4 py-4" aria-label="ראשי">
        <span class="font-bold">ספריית ההשאלה</span>
        <a href="index.html" aria-current="page" class="text-accent underline underline-offset-4">הרשימה</a>
        <a href="book.html" class="hover:text-accent">ספר</a>
      </nav>
    </header>

    <main class="mx-auto max-w-3xl px-4 py-8">
      <h1 class="text-2xl font-bold">ספריית ההשאלה של הכיתה</h1>
      <p id="storage-note" role="status" hidden class="mt-4 rounded-lg border-2 border-warn bg-card p-3 font-semibold text-warn"></p>

      <form id="book-form" class="mt-6 flex flex-wrap items-end gap-3 rounded-lg border border-edge bg-card p-4">
        <div>
          <label for="f-title" class="block text-sm text-soft">שם הספר</label>
          <input id="f-title" type="text" autocomplete="off" class="mt-1 rounded-md border border-edge bg-paper px-3 py-2" />
        </div>
        <div>
          <label for="f-copies" class="block text-sm text-soft">עותקים</label>
          <input id="f-copies" type="number" class="mt-1 w-24 rounded-md border border-edge bg-paper px-3 py-2" />
        </div>
        <div>
          <label for="f-genre" class="block text-sm text-soft">מדור</label>
          <input id="f-genre" type="text" autocomplete="off" class="mt-1 w-28 rounded-md border border-edge bg-paper px-3 py-2" />
        </div>
        <button type="submit" class="rounded-md bg-accent px-4 py-2 font-semibold text-accent-ink">הוסף</button>
      </form>
      <p id="form-msg" role="status" class="mt-2 min-h-6 font-semibold text-warn"></p>

      <div class="mt-4 flex flex-wrap items-end gap-3 rounded-lg border border-edge p-4">
        <div>
          <label for="q" class="block text-sm text-soft">חיפוש</label>
          <input id="q" type="search" autocomplete="off" class="mt-1 rounded-md border border-edge bg-paper px-3 py-2" />
        </div>
        <div>
          <label for="genre" class="block text-sm text-soft">מדור</label>
          <select id="genre" class="mt-1 rounded-md border border-edge bg-paper px-3 py-2">
            <option value="all">הכול</option>
          </select>
        </div>
        <div>
          <label for="order" class="block text-sm text-soft">סדר</label>
          <select id="order" class="mt-1 rounded-md border border-edge bg-paper px-3 py-2">
            <option value="title">לפי שם</option>
            <option value="copies">הכי הרבה עותקים</option>
          </select>
        </div>
      </div>

      <p class="mt-4 text-soft">מוצגים: <span id="shown">0</span></p>
      <ul id="books" class="mt-3 grid gap-2"></ul>
      <div id="none" hidden class="mt-3 rounded-lg border border-edge bg-card p-4 text-soft">
        <p id="none-text">אין ספרים להציג.</p>
        <button id="samples" type="button" hidden class="mt-3 rounded-md border border-edge bg-paper px-3 py-1 text-sm font-semibold text-ink">טען ספרים לדוגמה</button>
      </div>

      <section aria-labelledby="cat-heading" class="mt-10 rounded-lg border border-edge p-4">
        <h2 id="cat-heading" class="text-xl font-bold">הוספה מהקטלוג של Open Library</h2>
        <label for="cat-q" class="mt-3 block text-sm text-soft">חיפוש ספר בקטלוג</label>
        <input id="cat-q" type="search" autocomplete="off" class="mt-1 w-full rounded-md border border-edge bg-paper px-3 py-2" />
        <p id="cat-msg" role="status" class="mt-3 text-soft"></p>
        <ul id="cat-results" class="mt-3 grid gap-2"></ul>
      </section>
    </main>
  </body>
</html>
