<!doctype html>
<!--
  The second page. It has no script of its own: it loads the same entry point as the
  list page, and render() replaces whatever is inside #book. (Week 10, cycle 1.)
  #rename is week 11 cycle 1's "you do": OUTSIDE #book, because render() replaces #book
  on every change and a field replaced while you type in it loses your text.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>ספריית ההשאלה — ספר</title>
    <script src="vendor/tailwind.js"></script>
    <style type="text/tailwindcss">
      @theme static {
        --color-ink: oklch(0.23 0.02 250);
        --color-soft: oklch(0.43 0.02 250);
        --color-edge: oklch(0.84 0.01 250);
        --color-paper: oklch(0.99 0.003 90);
        --color-card: oklch(0.97 0.006 90);
        --color-accent: oklch(0.44 0.11 165);
        --color-accent-ink: oklch(0.99 0 0);
        --color-warn: oklch(0.48 0.19 25);
      }
    </style>
    <script type="module" src="js/app.js"></script>
  </head>
  <body class="bg-paper text-ink">
    <header class="border-b border-edge">
      <nav class="mx-auto flex max-w-3xl gap-6 px-4 py-4" aria-label="ראשי">
        <span class="font-bold">ספריית ההשאלה</span>
        <a href="index.html" class="hover:text-accent">הרשימה</a>
        <a href="book.html" aria-current="page" class="text-accent underline underline-offset-4">ספר</a>
      </nav>
    </header>

    <main class="mx-auto max-w-3xl px-4 py-8">
      <div id="book"></div>
      <form id="rename" class="mt-6 flex flex-wrap items-end gap-3 rounded-lg border border-edge bg-card p-4">
        <div>
          <label for="new-title" class="block text-sm text-soft">שם חדש</label>
          <input id="new-title" type="text" autocomplete="off" class="mt-1 rounded-md border border-edge bg-paper px-3 py-2" />
        </div>
        <button type="submit" class="rounded-md bg-accent px-4 py-2 font-semibold text-accent-ink">שמור שם</button>
      </form>
    </main>
  </body>
</html>
