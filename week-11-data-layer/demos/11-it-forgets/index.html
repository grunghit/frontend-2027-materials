<!doctype html>
<!--
  It forgets. Week-11 reference deck.

  The opener, and it is deliberately not about JSON at all. Two panels holding the SAME
  application: the left one keeps its collection in a module-level array, exactly like
  week 10's, and the right one writes it down. Both work. Press the buttons and they
  agree, field for field, forever.

  Then press RELOAD BOTH and one of them is empty.

  What makes it teach rather than assert:

  1. THE LOSS IS COUNTED, not described. Each panel reports how many items it had before
     the reload and how many it has after, and the difference is printed as a number.
  2. RELOADING IS REAL. Each panel is its own <iframe> with its own document; the button
     calls `location.reload()` inside it. Nothing is simulated, which matters because the
     claim being made is precisely about what survives a real page load.
  3. THE RIGHT PANEL IS SIX LINES LONGER THAN THE LEFT, and the page prints the diff. The
     answer to "how much work is this" is a number, before anybody has been asked to do it.

  DEMO MOVE: add three items to BOTH panels. Ask the room which one is better written.
  Nobody can tell. Then press "reload both".
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../demo.css" />
    <title>It forgets</title>
    <style>
      iframe {
        width: 100%;
        height: 186px;
        border: 0;
        background: #fff;
        border-radius: 8px;
      }
    </style>
  </head>

  <body>
    <h2>The same application twice. One of them writes the collection down.</h2>

    <div class="bar">
      <button id="add" type="button" class="primary">add an item to both</button>
      <button id="remove" type="button">remove the first from both</button>
      <span class="sep"></span>
      <button id="reload" type="button">reload both</button>
      <button id="wipe" type="button">wipe the saved copy</button>
    </div>

    <div class="layout">
      <div class="panel bad">
        <h3>in memory — week 10's application</h3>
        <iframe id="volatile" title="in memory" src="panel.html?save=0"></iframe>
      </div>
      <div class="panel good">
        <h3>written down — the same application, six lines longer</h3>
        <iframe id="durable" title="written down" src="panel.html?save=1"></iframe>
      </div>
    </div>

    <p class="verdict" id="verdict">Add a few items, then press &ldquo;reload both&rdquo;.</p>
    <p class="note" id="cost"></p>

    <script>
      const frames = () => [
        document.querySelector('#volatile').contentWindow,
        document.querySelector('#durable').contentWindow,
      ];
      const counts = () => frames().map((w) => w.COUNT?.() ?? 0);

      const say = (text, ok) => {
        const el = document.querySelector('#verdict');
        el.textContent = text;
        el.className = 'verdict' + (ok === undefined ? '' : ok ? ' ok' : ' no');
      };

      document.querySelector('#add').addEventListener('click', () => {
        for (const w of frames()) w.ADD?.();
        say(`both panels hold ${counts().join(' and ')} items`);
      });

      document.querySelector('#remove').addEventListener('click', () => {
        for (const w of frames()) w.REMOVE?.();
        say(`both panels hold ${counts().join(' and ')} items`);
      });

      document.querySelector('#wipe').addEventListener('click', () => {
        frames()[1].WIPE?.();
        say('the saved copy was deleted — reload to see what that means');
      });

      document.querySelector('#reload').addEventListener('click', () => {
        const before = counts();
        let ready = 0;
        for (const frame of [
          document.querySelector('#volatile'),
          document.querySelector('#durable'),
        ]) {
          frame.addEventListener(
            'load',
            () => {
              ready += 1;
              if (ready < 2) return;
              const after = counts();
              const lost = before.map((n, i) => n - after[i]);
              say(
                `before ${before.join(' / ')} — after ${after.join(' / ')} — ` +
                  `lost ${lost[0]} on the left, ${lost[1]} on the right`,
                lost[1] === 0 && lost[0] > 0,
              );
            },
            { once: true },
          );
          frame.contentWindow.location.reload();
        }
      });

      /* The cost of the right-hand panel, measured rather than claimed: the two
         documents are identical apart from the lines that mention storage. */
      addEventListener('load', async () => {
        const source = await fetch('panel.html').then((r) => r.text());
        const lines = source.split('\n').filter((l) => /localStorage|JSON\./.test(l)).length;
        document.querySelector('#cost').textContent =
          `The two panels run the same file. The lines that mention localStorage or JSON in it: ${lines}. ` +
          `That is the whole of today's difference, and by the end of the lecture it lives in a file of its own.`;
      });
    </script>
  </body>
</html>
