<?xml version="1.0" encoding="UTF-8"?>
<!--
  A stand-in photograph for the gallery on bad-page.html. Authored rather than sourced:
  licence-clean, offline, under a kilobyte, and it cannot be mistaken for a real place.

  Note there is no aria-label and no <title> here on purpose. This file is referenced by
  an <img> whose OWN alt attribute is the thing being audited, and an accessible name on
  the SVG itself would quietly rescue the alt that is meant to be useless.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <rect width="300" height="200" fill="#d7ccc8" />
  <rect x="24" y="118" width="252" height="58" fill="#a1887f" />
  <circle cx="72" cy="62" r="26" fill="#a1887f" />
  <rect x="120" y="40" width="156" height="44" fill="#a1887f" />
</svg>
