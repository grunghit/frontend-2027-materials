<!doctype html>
<!--
  Grouping, with one slider. Week-6 deck, act 2.

  Eight fields. No headings, no boxes, no rules, no colour. The only thing that changes
  is the ratio between the gap INSIDE a group and the gap BETWEEN groups — and the room
  reads a different number of groups at each setting.

  What makes it teach rather than merely demonstrate:

  1. IT COUNTS WHAT THE ROOM SEES. Ask "how many groups do you see?" before revealing
     the readout. At ratio 1.0 the answers scatter between one and eight. At 2.0 the
     room says three, in unison, and there is still not one line or box on the panel.
  2. IT SHOWS THE FAILURE OF THE OBVIOUS FIX. The "add boxes" switch draws a border
     around each group at ratio 1.0. It works — and it costs eight borders to say what
     spacing said for free, on a panel that now looks like a form from 1998.
  3. THE NUMBER IS THE POINT, NOT THE PIXELS. 8px inside and 16px between reads exactly
     like 16 and 32. Grouping is a RATIO, which is why "add more whitespace" is not the
     advice — the advice is "make the difference bigger".

  DEMO MOVE: start at 1.0, ask for a show of hands on "three groups", and count the
  hands. Then drag to 2.0 and ask again. Nothing was added; the same eight fields are on
  screen. That gap between the two shows of hands is the whole of proximity.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proximity: grouping with one number</title>

    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
        --accent: #4338ca;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      .bar label {
        font-size: 13px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      input[type='range'] {
        width: 190px;
        accent-color: var(--accent);
      }
      input[type='checkbox'] {
        accent-color: var(--accent);
      }
      output {
        font:
          700 15px/1 ui-monospace,
          Menlo,
          monospace;
        color: var(--accent);
        min-width: 3.2em;
        display: inline-block;
      }
      button {
        font: inherit;
        font-size: 13px;
        padding: 5px 12px;
        border: 1px solid #7a8699;
        border-radius: 999px;
        background: #fff;
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }

      .split {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 280px);
        gap: 18px;
        align-items: start;
      }
      @media (max-width: 720px) {
        .split {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      .panel {
        border: 2px solid var(--line);
        border-radius: 10px;
        padding: 18px;
        max-width: 46ch;
      }

      /*
        THE ONLY TWO NUMBERS IN THIS DEMO. `--inside` is fixed at 8px; `--between` is
        `--inside` times the ratio from the slider. Everything else about the panel is
        constant.
      */
      .form {
        --inside: 8px;
        --between: calc(var(--inside) * var(--ratio, 1));
        display: grid;
        gap: var(--between);
      }
      .group {
        display: grid;
        gap: var(--inside);
      }
      .row {
        display: grid;
        gap: 2px;
      }
      .row span {
        font-size: 12px;
        color: var(--muted);
      }
      .row i {
        display: block;
        height: 26px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: #fbfcfe;
      }

      /* The obvious fix, offered so it can be rejected on the evidence. */
      .form[data-boxes='on'] .group {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
      }

      .readout {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 13px;
      }
      .big {
        font:
          700 30px/1.1 system-ui,
          sans-serif;
        color: var(--accent);
        margin: 2px 0 8px;
      }
      dl {
        margin: 0;
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 3px 10px;
        font-size: 12.5px;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
      }
      .note {
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: 8px;
        border-left: 4px solid var(--line);
        background: #f8fafc;
        font-size: 12.5px;
      }
      .note.bad {
        border-left-color: #b3123b;
        background: #fff1f4;
      }
      .note.good {
        border-left-color: #0f6b52;
        background: #eefaf5;
      }
      .note.warn {
        border-left-color: #a35a06;
        background: #fff8ec;
      }
    </style>
  </head>

  <body>
    <h2>eight fields, no boxes, no headings</h2>

    <div class="bar">
      <label>
        between : inside
        <input type="range" id="ratio" min="1" max="4" step="0.1" value="1"
      /></label>
      <output id="ratio-out">1.0</output>
      <label><input type="checkbox" id="boxes" /> add boxes instead</label>
      <button type="button" id="reveal">how many groups?</button>
    </div>

    <div class="split">
      <div class="panel">
        <!--
          There is no <h3>, no <fieldset>, no <hr> and no colour in here. Whatever
          structure the room reads off this panel is coming from the spacing alone.
        -->
        <div class="form" id="form" data-boxes="off">
          <div class="group">
            <div class="row"><span>Full name</span><i></i></div>
            <div class="row"><span>Date of birth</span><i></i></div>
            <div class="row"><span>Identity number</span><i></i></div>
          </div>
          <div class="group">
            <div class="row"><span>Street and number</span><i></i></div>
            <div class="row"><span>City</span><i></i></div>
            <div class="row"><span>Postcode</span><i></i></div>
          </div>
          <div class="group">
            <div class="row"><span>Email</span><i></i></div>
            <div class="row"><span>Phone</span><i></i></div>
          </div>
        </div>
      </div>

      <div class="readout">
        <span style="color: var(--muted); font-size: 12px">groups a reader will see</span>
        <p class="big" id="groups">?</p>
        <dl>
          <dt>inside a group</dt>
          <dd id="inside">8px</dd>
          <dt>between groups</dt>
          <dd id="between">8px</dd>
          <dt>ratio</dt>
          <dd id="ratio-num">1.0</dd>
          <dt>borders drawn</dt>
          <dd id="borders">0</dd>
        </dl>
        <p class="note" id="note"></p>
      </div>
    </div>

    <script>
      const form = document.getElementById('form');
      const slider = document.getElementById('ratio');
      const boxes = document.getElementById('boxes');
      const out = document.getElementById('ratio-out');
      const note = document.getElementById('note');
      let revealed = false;

      /*
        THE GROUP COUNT IS MEASURED, NOT ASSUMED.

        It reads the real gaps off the rendered boxes — the distance between the last
        row of one group and the first row of the next, versus the distance between two
        rows inside a group — and applies the rule the eye applies: things separated by
        noticeably more space than their neighbours read as separate.

        The threshold is 1.5, which is not a law of physics. It is roughly where a room
        of forty people stops disagreeing, and the demo says so rather than pretending
        to a precision it does not have.
      */
      function measure() {
        const groups = [...form.querySelectorAll('.group')];
        const rowsOf = (g) => [...g.querySelectorAll('.row')].map((r) => r.getBoundingClientRect());

        const insideGaps = [];
        for (const g of groups) {
          const rects = rowsOf(g);
          for (let i = 1; i < rects.length; i++)
            insideGaps.push(rects[i].top - rects[i - 1].bottom);
        }

        const betweenGaps = [];
        for (let i = 1; i < groups.length; i++) {
          const prev = rowsOf(groups[i - 1]).at(-1);
          const next = rowsOf(groups[i])[0];
          betweenGaps.push(next.top - prev.bottom);
        }

        const avg = (list) => (list.length ? list.reduce((a, b) => a + b, 0) / list.length : 0);
        const inside = avg(insideGaps);
        const between = avg(betweenGaps);
        const ratio = inside > 0 ? between / inside : 1;
        const bordered = boxes.checked;

        document.getElementById('inside').textContent = `${inside.toFixed(0)}px`;
        document.getElementById('between').textContent = `${between.toFixed(0)}px`;
        document.getElementById('ratio-num').textContent = ratio.toFixed(2);
        document.getElementById('borders').textContent = bordered ? String(groups.length) : '0';

        const seesGroups = ratio >= 1.5 || bordered;
        if (revealed) {
          document.getElementById('groups').textContent = seesGroups
            ? String(groups.length)
            : '1 (or 8)';
        }

        note.className = 'note';
        if (bordered && ratio < 1.5) {
          note.classList.add('warn');
          note.textContent =
            'The boxes work — and they cost three borders to say what a ratio of 2 says for nothing. ' +
            'Spacing is the cheaper instrument, and it does not make the panel look like a form from 1998.';
        } else if (ratio < 1.3) {
          note.classList.add('bad');
          note.textContent =
            'One rhythm, so there is no grouping. Eight fields in a single undifferentiated column — ' +
            'and nothing on this panel is wrong, misaligned or missing.';
        } else if (ratio < 1.8) {
          note.classList.add('warn');
          note.textContent =
            'Ambiguous. The difference is there but not decisive, and a room will not agree on the count.';
        } else {
          note.classList.add('good');
          note.textContent =
            `Three groups, from one number. Between-group space is ${ratio.toFixed(1)}x the space inside a group, ` +
            'and that ratio — not the pixel values — is what does the work: 8 and 16 read exactly like 16 and 32.';
        }
      }

      function update() {
        const value = Number(slider.value);
        form.style.setProperty('--ratio', String(value));
        out.textContent = value.toFixed(1);
        form.dataset.boxes = boxes.checked ? 'on' : 'off';
        requestAnimationFrame(measure);
      }

      slider.addEventListener('input', update);
      boxes.addEventListener('change', update);
      document.getElementById('reveal').addEventListener('click', () => {
        revealed = true;
        measure();
      });

      update();
    </script>
  </body>
</html>
