<!doctype html>
<!--
  MISCONCEPTION 5 — "height: 100% didn't do anything". Week-4 deck, act 4.

  The blue box asks for height: 100%. It gets the height of its text and nothing more.
  The declaration is not ignored: 100% OF WHAT is the question, and the answer is "of the
  parent's height", which is `auto`, which is "however tall the children turn out to be".
  100% of auto is auto. The browser is being perfectly consistent.

  The chain switches let students repair it from the top down. The point they should leave
  with is how far up the repair has to go: giving the immediate parent a height is not
  enough, because ITS height is also auto. The whole chain — html, body, wrapper — has to
  resolve to something definite before the last 100% means anything.

  Then the modern answer: stop building the chain. `min-height: 100dvh` on the one element
  that needs it needs no cooperation from any ancestor, and `dvh` is the unit that survives
  a mobile browser's toolbar sliding away — the "viewpoint can change height" caveat the
  legacy deck raised (and misspelled) on the `fixed` slide.

  DEMO MOVE: turn the three chain switches on one at a time, left to right, and let the
  room watch the box stay exactly the same height for the first two. Nothing happens until
  the last one. Then clear them all and press the dvh button.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Why height: 100% does nothing</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      /* The heading is a small-caps label; the declaration inside it is not. */
      h2 code {
        text-transform: none;
        letter-spacing: normal;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        align-items: center;
        margin-bottom: 12px;
      }
      .controls label {
        font: 600 13px/1.5 ui-monospace, Menlo, monospace;
        cursor: pointer;
      }
      .controls input {
        accent-color: #1d4ed8;
        margin-right: 4px;
      }
      button {
        font: inherit;
        padding: 5px 12px;
        border: 1px solid #7a8699;
        border-radius: 999px;
        background: #fff;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: #15803d;
        border-color: #15803d;
        color: #fff;
      }
      :focus-visible {
        outline: 3px solid #b45309;
        outline-offset: 2px;
      }

      /* A fake viewport, so the demo is honest inside an iframe of any size. The three
         nested elements below stand in for html, body and a page wrapper. */
      .viewport {
        height: 240px;
        padding: 8px;
        border: 2px dashed #94a3b8;
        border-radius: 10px;
        background: #f8fafc;
        overflow: hidden;
      }
      .fake-html {
        padding: 6px;
        border: 2px solid #a855f7;
        border-radius: 8px;
      }
      .fake-body {
        padding: 6px;
        border: 2px solid #0891b2;
        border-radius: 8px;
      }
      .wrapper {
        padding: 6px;
        border: 2px solid #ca8a04;
        border-radius: 8px;
      }
      .target {
        height: 100%;
        padding: 8px;
        border: 2px solid #1d4ed8;
        border-radius: 8px;
        background: #dbeafe;
        color: #1e3a8a;
        font-weight: 700;
        font-size: 14px;
      }

      /* The three links in the chain. Each is one `height: 100%`. */
      .viewport.h1 .fake-html {
        height: 100%;
      }
      .viewport.h2 .fake-body {
        height: 100%;
      }
      .viewport.h3 .wrapper {
        height: 100%;
      }
      /* The modern answer, which needs none of the above. */
      .viewport.dvh .target {
        height: auto;
        min-height: 180px;
      }

      .tag {
        font: 700 11px/1.4 ui-monospace, Menlo, monospace;
        letter-spacing: 0.04em;
        color: #475569;
      }
      .readout {
        margin: 12px 0 0;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f1f5f9;
        font: 13px/1.7 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>

  <body>
    <div class="controls">
      <label><input type="checkbox" id="c1" />height:100% on &lt;html&gt;</label>
      <label><input type="checkbox" id="c2" />height:100% on &lt;body&gt;</label>
      <label><input type="checkbox" id="c3" />height:100% on .wrapper</label>
      <button type="button" id="dvh">instead: min-height on the box itself</button>
    </div>

    <h2>The blue box says <code>height: 100%</code>. It always has.</h2>

    <div class="viewport" id="viewport">
      <div class="fake-html">
        <span class="tag">html</span>
        <div class="fake-body">
          <span class="tag">body</span>
          <div class="wrapper">
            <span class="tag">.wrapper</span>
            <div class="target" id="target">height: 100%</div>
          </div>
        </div>
      </div>
    </div>

    <p class="readout" id="out" aria-live="polite"></p>

    <script>
      const viewport = document.getElementById('viewport');
      const target = document.getElementById('target');
      const out = document.getElementById('out');
      const boxes = [
        document.getElementById('c1'),
        document.getElementById('c2'),
        document.getElementById('c3'),
      ];
      const dvhButton = document.getElementById('dvh');

      let dvhMode = false;

      const pad = (v, n) => String(v).padStart(n, ' ');

      function render() {
        viewport.classList.toggle('h1', boxes[0].checked);
        viewport.classList.toggle('h2', boxes[1].checked);
        viewport.classList.toggle('h3', boxes[2].checked);
        viewport.classList.toggle('dvh', dvhMode);
        dvhButton.setAttribute('aria-pressed', String(dvhMode));

        requestAnimationFrame(() => {
          const chain = [
            { name: 'html', el: viewport.querySelector('.fake-html'), on: boxes[0].checked },
            { name: 'body', el: viewport.querySelector('.fake-body'), on: boxes[1].checked },
            { name: '.wrapper', el: viewport.querySelector('.wrapper'), on: boxes[2].checked },
          ];

          const lines = chain.map(
            (link) =>
              '    ' +
              link.name.padEnd(10, ' ') +
              (link.on ? 'height: 100%' : 'height: auto ').padEnd(14, ' ') +
              pad(Math.round(link.el.getBoundingClientRect().height), 4) +
              'px  ' +
              (link.on ? 'definite' : '← auto: as tall as its children'),
          );

          const boxHeight = Math.round(target.getBoundingClientRect().height);
          const complete = boxes.every((b) => b.checked);

          out.textContent = dvhMode
            ? '  .target { min-height: 180px }   (in a real page: min-height: 100dvh)\n\n' +
              '  the box is now ' +
              boxHeight +
              'px tall, and NOT ONE ancestor was changed.\n\n' +
              '  This is the answer. A percentage height asks a question of its parent;\n' +
              '  a viewport unit does not ask anyone. `dvh` is the dynamic viewport height,\n' +
              '  which is the one that stays correct when a mobile browser slides its\n' +
              '  toolbar away and the viewport changes size under you.\n\n' +
              '  Use `min-height`, not `height`: content that grows past it should push the\n' +
              '  box taller, not spill out of it.'
            : '  .target { height: 100% }   ← never changes in this demo\n\n' +
              '  the chain above it:\n\n' +
              lines.join('\n') +
              '\n\n' +
              '    .target   height: 100%   ' +
              pad(boxHeight, 4) +
              'px\n\n' +
              (complete
                ? '  Every link is definite, so 100% finally resolves. Note how far up the\n' +
                  '  repair had to go: three elements, none of which is the one you were\n' +
                  '  trying to style.'
                : '  100% OF WHAT? Of the parent\'s height — which is `auto` — which means\n' +
                  '  "however tall the children turn out to be". 100% of auto is auto, so the\n' +
                  '  box is as tall as its text.\n\n' +
                  '  The declaration is not being ignored. It is being resolved against a\n' +
                  '  number that does not exist yet.');
        });
      }

      for (const box of boxes) {
        box.addEventListener('change', () => {
          dvhMode = false;
          render();
        });
      }
      dvhButton.addEventListener('click', () => {
        dvhMode = !dvhMode;
        if (dvhMode) for (const box of boxes) box.checked = false;
        render();
      });

      render();
    </script>
  </body>
</html>
