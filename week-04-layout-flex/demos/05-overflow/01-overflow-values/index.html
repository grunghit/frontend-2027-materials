<!doctype html>
<!--
  What to do when the content does not fit. Week-4 deck, act 4.

  `overflow` is absent from the entire legacy course — the word appears twice in eleven
  decks, once as a quiz distractor. LEGACY_AUDIT.md §8 lists it as W3's to author
  (old numbering: W3 was Flexbox, §0.6 week 4 — this week).

  A fixed 260 × 120 box with more content than fits, and the five values. The interesting
  part is not what they look like — it is the two side effects nobody mentions:

    · `hidden`, `scroll` and `auto` turn the box into a SCROLL CONTAINER. Content is
      still there and still reachable by keyboard and by search — which is why
      `overflow: hidden` is not a way to hide things.
    · a scroll container is also what `position: sticky` sticks inside, which is the
      single most common reason a correct `sticky` declaration does nothing.

  DEMO MOVE: pick `hidden` and then press Ctrl/Cmd-F in the frame and search for the word
  "buried" — the browser scrolls the hidden box to reveal it. The content was never gone.
  Then pick `clip` and try again: `clip` does not create a scroll container, so there is
  nothing to scroll and the text really is unreachable. That is the difference between the
  two, and it is the only reason `clip` exists.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>overflow: visible · hidden · scroll · auto · clip</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      button {
        font: inherit;
        padding: 6px 12px;
        border: 1px solid #7a8699;
        border-radius: 999px;
        background: #fff;
        color: inherit;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: #1d4ed8;
        border-color: #1d4ed8;
        color: #fff;
      }
      button:focus-visible {
        outline: 3px solid #b45309;
        outline-offset: 2px;
      }

      /* The rail is taller than the box so `visible` has somewhere to spill INTO.
         The page itself must never gain a scrollbar — that would fail the responsive
         gate for a reason that has nothing to do with the lesson. */
      .rail {
        height: 210px;
        padding: 14px;
        border: 2px dashed #94a3b8;
        border-radius: 10px;
        background: #f8fafc;
      }
      .box {
        width: 260px;
        height: 120px;
        padding: 10px;
        border: 2px solid #1d4ed8;
        border-radius: 8px;
        background: #dbeafe;
        color: #1e3a8a;
        font-size: 14px;
      }
      .box p {
        margin: 0 0 8px;
      }

      .readout {
        margin: 12px 0 0;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f1f5f9;
        font: 13px/1.7 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>

  <body>
    <div class="controls" id="controls"></div>

    <h2>A 260 × 120 box with about 300px of content in it</h2>
    <div class="rail">
      <div class="box" id="box">
        <p>This box is 120px tall and its content is not.</p>
        <p>The second paragraph already does not fit.</p>
        <p>And the word <strong>buried</strong> is well past the bottom edge.</p>
      </div>
    </div>

    <p class="readout" id="out" aria-live="polite"></p>

    <script>
      const box = document.getElementById('box');
      const controls = document.getElementById('controls');
      const out = document.getElementById('out');

      const MODES = [
        {
          id: 'visible',
          note:
            'The default, and it is not "broken". The content simply paints outside the\n' +
            'box — over whatever is underneath. Nothing is clipped and nothing scrolls.',
        },
        {
          id: 'hidden',
          note:
            'Clipped, and the box becomes a SCROLL CONTAINER with no visible scrollbar.\n' +
            'The content is still in the document: Tab reaches it, Ctrl-F finds it, and\n' +
            'the browser will scroll this box to show it.\n\n' +
            'So `overflow: hidden` is not a way to hide something. It is a way to stop it\n' +
            'painting outside a box.',
        },
        {
          id: 'scroll',
          note:
            'A scrollbar, always — even when everything fits. Useful when you do not want\n' +
            'the layout to jump the moment the content grows past the edge.',
        },
        {
          id: 'auto',
          note:
            'A scrollbar only when it is needed. This is the one you want almost every\n' +
            'time you want a scrollbar at all.',
        },
        {
          id: 'clip',
          note:
            'Clipped like `hidden`, but NO scroll container is created. Nothing can scroll\n' +
            'it back into view — not the user, not Ctrl-F, not a focused element.\n\n' +
            'That is the entire difference between `clip` and `hidden`, and it is why\n' +
            '`clip` is the honest choice when you really mean "cut this off".',
        },
      ];

      function apply(mode) {
        box.style.overflow = mode.id;

        for (const button of controls.children) {
          button.setAttribute('aria-pressed', String(button.dataset.id === mode.id));
        }

        requestAnimationFrame(() => {
          /* scrollHeight > clientHeight tells you there is hidden content; whether it
             can be REACHED is a different question, and it is the one that matters. */
          const hiddenPx = box.scrollHeight - box.clientHeight;
          const style = getComputedStyle(box);
          const scrollable = ['hidden', 'scroll', 'auto'].includes(mode.id);

          out.textContent =
            'overflow: ' +
            mode.id +
            '\n\n' +
            '  content height        ' +
            box.scrollHeight +
            'px in a ' +
            box.clientHeight +
            'px box\n' +
            '  overflowing by        ' +
            Math.max(0, hiddenPx) +
            'px\n' +
            '  is a scroll container ' +
            (scrollable ? 'yes' : 'no') +
            '\n' +
            '  content reachable     ' +
            (mode.id === 'visible'
              ? 'yes — it is painted outside the box'
              : scrollable
                ? 'yes — by scrolling, Tab or Ctrl-F'
                : 'NO — clipped with no way to scroll to it') +
            '\n  computed overflow-y   ' +
            style.overflowY +
            '\n\n' +
            mode.note;
        });
      }

      for (const mode of MODES) {
        const button = document.createElement('button');
        button.textContent = mode.id;
        button.dataset.id = mode.id;
        button.addEventListener('click', () => apply(mode));
        controls.append(button);
      }

      apply(MODES[0]);
    </script>
  </body>
</html>
