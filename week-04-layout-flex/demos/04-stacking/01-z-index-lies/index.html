<!doctype html>
<!--
  MISCONCEPTION 2 — "z-index doesn't work". Week-4 deck, act 3.
  THIS IS THE MOVABLE STACKING CONTEXT the run prompt asks for.

  A dropdown with  z-index: 999  disappears behind a header with  z-index: 1.
  999 is not less than 1. Nothing here is a browser bug.

  The switch marked "opacity: 0.99 on the panel" is the whole demo. That one declaration
  — which changes nothing you can see, 0.99 versus 1 — makes the panel a STACKING CONTEXT,
  and the moment it does, its child's z-index stops being comparable with anything outside
  it. The child is no longer competing with the header; the PANEL is, and the panel's
  z-index is auto.

  The five switches are the five things students actually write by accident:
    opacity < 1 · transform · filter · will-change · isolation: isolate
  Every one of them creates a context. None of them looks like it has anything to do with
  layering, which is exactly why this bug costs people an afternoon.

  DEMO MOVE: start with the dropdown correctly on top. Ask the room to predict what
  `opacity: 0.99` will do — they will say "nothing, you can't even see 0.99". Flip it.
  Then let someone try to fix it by raising 999 to 99999; it will not help, and that is
  the moment the concept lands.

  NOTHING HERE IS SIMULATED. The tree is built by walking the real DOM with
  getComputedStyle and applying the actual rules for what creates a context.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Why z-index 999 loses to z-index 1</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        margin-bottom: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line);
      }
      .controls label {
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .controls input {
        accent-color: #1d4ed8;
        margin-right: 4px;
      }
      .zwrap {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 13px;
        font-weight: 600;
      }
      .zwrap input[type='number'] {
        width: 84px;
        font: inherit;
        padding: 3px 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      input:focus-visible {
        outline: 3px solid #b45309;
        outline-offset: 2px;
      }

      /* ── The specimen ───────────────────────────────────────────────────────── */
      .app {
        position: relative;
        height: 210px;
        border: 2px dashed #94a3b8;
        border-radius: 10px;
        background: #f8fafc;
        overflow: hidden;
      }

      /* The panel that holds the dropdown. Its own z-index is never set. */
      .panel {
        position: relative;
        padding: 10px;
      }
      .panel.o {
        opacity: 0.99;
      }
      .panel.t {
        transform: translateZ(0);
      }
      .panel.f {
        filter: saturate(1);
      }
      .panel.w {
        will-change: transform;
      }
      .panel.i {
        isolation: isolate;
      }

      .trigger {
        display: inline-block;
        padding: 6px 12px;
        border: 2px solid #1d4ed8;
        border-radius: 8px;
        background: #dbeafe;
        color: #1e3a8a;
        font-weight: 700;
      }
      /* Tall on purpose: it has to overlap the header by enough that "behind" is
         obvious from the back of a lecture hall, not a 6px sliver. */
      .dropdown {
        position: absolute;
        inset-block-start: 46px;
        inset-inline-start: 10px;
        width: 210px;
        height: 120px;
        padding: 10px;
        border: 2px solid #15803d;
        border-radius: 8px;
        background: #dcfce7;
        color: #14532d;
        font-weight: 700;
        font-size: 14px;
      }

      /* The header the dropdown has to beat. z-index: 1. That is all. */
      .header {
        position: absolute;
        inset-block-start: 74px;
        inset-inline: 0;
        z-index: 1;
        padding: 14px 10px;
        background: #fecaca;
        border-block: 2px solid #b91c1c;
        color: #7f1d1d;
        font-weight: 700;
      }

      .readout {
        margin: 12px 0 0;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f1f5f9;
        font: 13px/1.7 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }
      .verdict {
        margin: 10px 0 0;
        padding: 8px 12px;
        border-radius: 8px;
        border: 2px solid #15803d;
        background: #dcfce7;
        font-weight: 700;
        font-size: 14px;
      }
      .verdict.bad {
        border-color: #b91c1c;
        background: #fef2f2;
      }
    </style>
  </head>

  <body>
    <div class="controls" id="controls">
      <span class="zwrap">
        <label for="z">dropdown z-index</label>
        <input type="number" id="z" value="999" step="1" />
      </span>
    </div>

    <h2>The green dropdown has z-index 999. The pink header has z-index 1.</h2>

    <div class="app">
      <div class="panel" id="panel">
        <span class="trigger">Menu</span>
        <div class="dropdown" id="dropdown">I am z-index: <span id="zshow">999</span></div>
      </div>
      <div class="header">Site header — z-index: 1</div>
    </div>

    <p class="verdict" id="verdict"></p>
    <p class="readout" id="out" aria-live="polite"></p>

    <script>
      const panel = document.getElementById('panel');
      const dropdown = document.getElementById('dropdown');
      const zInput = document.getElementById('z');
      const zShow = document.getElementById('zshow');
      const controls = document.getElementById('controls');
      const out = document.getElementById('out');
      const verdict = document.getElementById('verdict');

      /* The five things that create a stacking context without looking like they do.
         `css` is the class on the panel; `decl` is what a student would have written. */
      const TRIGGERS = [
        { id: 'o', decl: 'opacity: 0.99', why: 'any opacity below 1' },
        { id: 't', decl: 'transform: translateZ(0)', why: 'any transform other than none' },
        { id: 'f', decl: 'filter: saturate(1)', why: 'any filter other than none' },
        { id: 'w', decl: 'will-change: transform', why: 'will-change naming a context-creating property' },
        { id: 'i', decl: 'isolation: isolate', why: 'isolation: isolate — the only one that is deliberate' },
      ];

      for (const trigger of TRIGGERS) {
        const label = document.createElement('label');
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.dataset.id = trigger.id;
        input.addEventListener('change', render);
        label.append(input, document.createTextNode(trigger.decl + ' on the panel'));
        controls.append(label);
      }

      /* Does this element establish a stacking context? The real rules, for the subset
         that can occur on this page. A root element always does. */
      function createsContext(el) {
        const style = getComputedStyle(el);
        const reasons = [];
        if (el === document.documentElement) reasons.push('it is the root element');
        if (style.position !== 'static' && style.zIndex !== 'auto') {
          reasons.push('position: ' + style.position + ' with z-index: ' + style.zIndex);
        }
        if (parseFloat(style.opacity) < 1) reasons.push('opacity: ' + style.opacity);
        if (style.transform !== 'none') reasons.push('transform is set');
        if (style.filter !== 'none') reasons.push('filter is set');
        if (style.willChange !== 'auto') reasons.push('will-change: ' + style.willChange);
        if (style.isolation === 'isolate') reasons.push('isolation: isolate');
        if (style.mixBlendMode !== 'normal') reasons.push('mix-blend-mode is set');
        return reasons;
      }

      function render() {
        const active = [];
        for (const input of controls.querySelectorAll('input[type="checkbox"]')) {
          panel.classList.toggle(input.dataset.id, input.checked);
          if (input.checked) active.push(TRIGGERS.find((t) => t.id === input.dataset.id));
        }

        const z = zInput.value;
        dropdown.style.zIndex = z;
        zShow.textContent = z;

        const panelReasons = createsContext(panel);
        const trapped = panelReasons.length > 0;

        /* The browser's own answer to "which one is on top": ask what is painted at a
           point where the two overlap. No guessing, no reasoning about paint order. */
        const headerBox = document.querySelector('.header').getBoundingClientRect();
        const dropBox = dropdown.getBoundingClientRect();
        const x = Math.round(Math.max(headerBox.left, dropBox.left) + 30);
        const y = Math.round(Math.max(headerBox.top, dropBox.top) + 8);
        const onTop = document.elementFromPoint(x, y);
        const dropdownWins = onTop === dropdown || dropdown.contains(onTop);

        verdict.className = dropdownWins ? 'verdict' : 'verdict bad';
        verdict.textContent = dropdownWins
          ? 'The dropdown is on top, as asked.'
          : 'The dropdown is BEHIND the header — even though ' + z + ' > 1.';

        out.textContent = trapped
          ? '  .panel  {  ' +
            active.map((a) => a.decl).join(';  ') +
            '  }\n' +
            '     ↳ this makes the panel a STACKING CONTEXT (' +
            active[0].why +
            ')\n\n' +
            '  .dropdown { z-index: ' +
            z +
            ' }   ← now only compared with its siblings INSIDE the panel\n' +
            '  .panel     { z-index: auto }  ← this is what actually competes with the header\n' +
            '  .header    { z-index: 1 }\n\n' +
            '  auto  loses to  1.  The dropdown goes wherever the panel goes, and the\n' +
            '  panel is behind. Raising 999 to 99999 changes nothing: the number is being\n' +
            '  compared inside a box that has already lost.\n\n' +
            '  z-index is only comparable BETWEEN SIBLINGS IN THE SAME CONTEXT.'
          : '  .panel     { }               ← creates no stacking context\n' +
            '  .dropdown  { z-index: ' +
            z +
            ' }\n' +
            '  .header    { z-index: 1 }\n\n' +
            '  Both are in the same stacking context — the root — so the two numbers are\n' +
            '  genuinely comparable, and the bigger one wins.\n\n' +
            '  Now tick any box above. None of them mentions layering.';
      }

      zInput.addEventListener('input', render);
      addEventListener('resize', render);
      render();
    </script>
  </body>
</html>
