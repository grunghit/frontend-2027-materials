<!doctype html>
<!--
  Float, as archaeology. Week-4 deck, act 6. Two minutes, then move on.

  Rebuilt from `שיעור 5/flex/`, which shipped five separate files laying out the SAME
  three columns five different ways — tables, inline-block, absolute, float, flex. That
  folder is the best thing in the legacy CSS material and it deserves to survive; it is
  one page here so the comparison is a click rather than five tabs.

  The point of this demo is NOT to teach float. It is to show students why the thing they
  will find in every Stack Overflow answer written before 2017 looks the way it does, so
  that when they meet it in someone else's stylesheet they can read it and replace it.

  What float is still for: wrapping text around an image. That is what it was invented
  for and it is still the only thing it does well. Everything else on this page is a
  workaround for the absence of a layout system.

  DEMO MOVE: click through the five in order and read the "what it cost" line each time.
  Then say the sentence and move on — this is a two-minute slot, not a lesson.
  "Today, using floats for overall page layout is discouraged."
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Five ways to make three columns, 1998–2017</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      button {
        font: inherit;
        padding: 6px 12px;
        border: 1px solid #7a8699;
        border-radius: 999px;
        background: #fff;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: #0f172a;
        border-color: #0f172a;
        color: #fff;
      }
      button:focus-visible {
        outline: 3px solid #b45309;
        outline-offset: 2px;
      }

      .rail {
        padding: 10px;
        border: 2px dashed #94a3b8;
        border-radius: 10px;
        background: #f8fafc;
      }
      .cols {
        position: relative;
      }
      .col {
        padding: 10px;
        border: 2px solid #1d4ed8;
        border-radius: 8px;
        background: #dbeafe;
        color: #1e3a8a;
        font-size: 13px;
      }
      .col:nth-child(2) {
        border-color: #15803d;
        background: #dcfce7;
        color: #14532d;
      }
      .col:nth-child(3) {
        border-color: #b45309;
        background: #fed7aa;
        color: #7c2d12;
      }

      /* 1 — tables. Layout in markup, which is the part that cannot be undone. */
      .cols.table {
        display: table;
        width: 100%;
        border-spacing: 5px;
      }
      .cols.table .col {
        display: table-cell;
        width: 33.33%;
      }

      /* 2 — inline-block. Note the widths do not add to 100: the whitespace. */
      .cols.inline-block .col {
        display: inline-block;
        width: 32%;
        vertical-align: top;
      }

      /* 3 — absolute. Hand-computed offsets, exactly as the legacy file had them. */
      .cols.absolute {
        height: 130px;
      }
      .cols.absolute .col {
        position: absolute;
        inset-block-start: 0;
        width: 31%;
      }
      .cols.absolute .col:nth-child(1) {
        inset-inline-start: 0;
      }
      .cols.absolute .col:nth-child(2) {
        inset-inline-start: 34.5%;
      }
      .cols.absolute .col:nth-child(3) {
        inset-inline-start: 69%;
      }

      /* 4 — float, with the clearfix that every stylesheet used to carry. */
      .cols.float::after {
        content: '';
        display: block;
        clear: both;
      }
      .cols.float .col {
        float: left;
        width: 32%;
        margin-inline-end: 2%;
      }
      .cols.float .col:nth-child(3) {
        margin-inline-end: 0;
      }

      /* 5 — flex. */
      .cols.flex {
        display: flex;
        gap: 10px;
      }
      .cols.flex .col {
        flex: 1;
        min-width: 0;
      }

      .after {
        margin-top: 10px;
        padding: 8px 12px;
        border: 2px dashed #cbd5e1;
        border-radius: 8px;
        font-size: 13px;
        color: var(--muted);
      }

      pre.snippet {
        margin: 10px 0 0;
        padding: 10px 12px;
        border-radius: 8px;
        background: #0f172a;
        color: #e2e8f0;
        font: 13px/1.6 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        white-space: pre-wrap;
        overflow-x: auto;
      }
      .cost {
        margin: 8px 0 0;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f1f5f9;
        font: 13px/1.7 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>

  <body>
    <div class="controls" id="controls"></div>

    <h2>The same three columns. The markup never changes.</h2>
    <div class="rail">
      <div class="cols" id="cols">
        <div class="col">Column one, with a sentence in it so the boxes have something to be.</div>
        <div class="col">Column two.</div>
        <div class="col">Column three, which is the longest of the three by some way.</div>
      </div>
      <p class="after">A paragraph after the columns.</p>
    </div>

    <pre class="snippet" id="snippet"></pre>
    <p class="cost" id="cost" aria-live="polite"></p>

    <script>
      const cols = document.getElementById('cols');
      const controls = document.getElementById('controls');
      const snippet = document.getElementById('snippet');
      const cost = document.getElementById('cost');

      const MODES = [
        {
          id: 'table',
          label: '1 · tables (1998)',
          code: '.cols { display: table; width: 100%; border-spacing: 5px }\n.col  { display: table-cell; width: 33.33% }',
          cost:
            'What it cost: the layout lives in the markup. A screen reader announces a\n' +
            'table with rows and cells to someone who is trying to read an article, and\n' +
            'the page cannot be rearranged for a narrow screen at all — a table is a\n' +
            'table at every width.\n\n' +
            'Tables are for tabular data. That has never changed.',
        },
        {
          id: 'inline-block',
          label: '2 · inline-block (2007)',
          code: '.col { display: inline-block; width: 32%; vertical-align: top }',
          cost:
            'What it cost: the whitespace gap. The widths are 32% and not 33.33% because\n' +
            'two spaces have to fit somewhere, and nobody knows how wide a space is until\n' +
            'the font loads.\n\n' +
            'Also: vertical-align: top is required, and forgetting it is a bug that only\n' +
            'appears once one column has more text than the others.',
        },
        {
          id: 'absolute',
          label: '3 · absolute (2005)',
          code:
            '.cols { height: 130px }        /* hand-measured. good luck. */\n' +
            '.col  { position: absolute; width: 31% }\n' +
            '.col:nth-child(2) { left: 34.5% }\n' +
            '.col:nth-child(3) { left: 69% }',
          cost:
            'What it cost: every number is a guess, and the container needs a hard-coded\n' +
            'height because absolutely positioned children are out of flow and cannot\n' +
            'stretch it.\n\n' +
            'Add one sentence to any column and it overlaps the paragraph below. The\n' +
            'legacy course shipped this with left: 27.25% — a number arrived at by trying.',
        },
        {
          id: 'float',
          label: '4 · float (2010)',
          code:
            '.cols::after { content: ""; display: block; clear: both } /* clearfix */\n' +
            '.col { float: left; width: 32%; margin-right: 2% }\n' +
            '.col:last-child { margin-right: 0 }',
          cost:
            'What it cost: the clearfix. Floated children are out of flow, so without\n' +
            'those three lines the container collapses to nothing and the paragraph below\n' +
            'climbs into the columns.\n\n' +
            'Equal-height columns are impossible. The margins have to be subtracted from\n' +
            'the widths by hand. This was the state of the art for about seven years, and\n' +
            'every CSS framework of that era existed mostly to hide it.\n\n' +
            '"Today, using floats for overall page layout is discouraged."',
        },
        {
          id: 'flex',
          label: '5 · flex (2017)',
          code: '.cols { display: flex; gap: 10px }\n.col  { flex: 1; min-width: 0 }',
          cost:
            'What it cost: nothing. Two declarations on the container, one on the items.\n\n' +
            'Equal heights are the default. The gap is declared rather than subtracted.\n' +
            'No number adds up to 100 by hand, nothing is out of flow, and there is no\n' +
            'clearfix because nothing needs clearing.\n\n' +
            'The only line that needs explaining is min-width: 0 — see 06-flex/03.',
        },
      ];

      function apply(mode) {
        cols.className = 'cols ' + mode.id;
        for (const button of controls.children) {
          button.setAttribute('aria-pressed', String(button.dataset.id === mode.id));
        }
        snippet.textContent = mode.code;
        cost.textContent = mode.cost;
      }

      for (const mode of MODES) {
        const button = document.createElement('button');
        button.textContent = mode.label;
        button.dataset.id = mode.id;
        button.addEventListener('click', () => apply(mode));
        controls.append(button);
      }

      apply(MODES[0]);
    </script>
  </body>
</html>
