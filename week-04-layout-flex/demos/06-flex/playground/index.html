<!doctype html>
<!--
  THE FLEX PLAYGROUND. Embedded in the week-4 deck (act 5, live-coding break #2).
  This is the artifact the run prompt asks for: toggle every property, watch the boxes move.

  Two halves:
    · container properties  — flex-direction, flex-wrap, justify-content, align-items,
                              align-content, gap
    · item properties       — flex-grow, flex-shrink, flex-basis, align-self, order,
                              applied to whichever box is selected

  Three things make this teach rather than just demonstrate:

    1. THE AXES ARE DRAWN, and they move. The arrow labelled "main" turns with
       flex-direction, so `justify-content` is visibly the main-axis property in every
       mode rather than "the horizontal one". That is misconception 3, killed by geometry.

    2. THE CSS IS WRITTEN OUT as you click. Students read the declaration they just
       produced, which is what makes the playground transfer to their own stylesheet
       instead of staying a toy.

    3. NOTHING IS SIMULATED. The measured row under the CSS is read from
       getBoundingClientRect on the real boxes, so `flex-grow: 1` produces a number that
       students can check against their own arithmetic.

  DEMO MOVE: set flex-direction to `column` and ask which control now centres the boxes
  left-to-right. Half the room will say justify-content. It is align-items — and the arrow
  says so before you do. Then set `flex: 1` on one box and ask what the other two are
  worth; the measured widths answer it.

  Keyboard: the boxes are buttons, so the whole thing is operable with Tab and Enter.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flexbox playground</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
        --main: #b45309;
        --cross: #7c3aed;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 12px;
        font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--ink);
        background: #fff;
      }

      /* Furniture only — week 5. */
      .layout {
        display: grid;
        grid-template-columns: 210px minmax(0, 1fr);
        gap: 14px;
        align-items: start;
      }
      @media (max-width: 760px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
      /* The gotcha this week teaches, appearing in the demo's own furniture: a grid
         and flex item's minimum size is `auto`, so a wide child pushes the track wider
         than its track definition allows and the whole page gains a scrollbar.
         See 06-flex/03-min-width-auto. */
      .layout > * {
        min-width: 0;
      }

      h2 {
        margin: 0 0 6px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h2.item-head {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }

      .field {
        margin-bottom: 7px;
      }
      .field label {
        display: block;
        font: 700 12px/1.5 ui-monospace, Menlo, monospace;
        color: #334155;
      }
      select,
      input[type='number'] {
        width: 100%;
        font: inherit;
        padding: 4px 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: inherit;
      }
      input[type='range'] {
        width: 100%;
        accent-color: #1d4ed8;
      }
      .pair {
        display: flex;
        gap: 6px;
      }
      :focus-visible {
        outline: 3px solid var(--main);
        outline-offset: 2px;
      }

      /* ── The stage ───────────────────────────────────────────────────────────── */
      .stage-wrap {
        position: relative;
        padding: 26px 0 0 26px;
      }
      /* The axis arrows. Rotated by JS to follow flex-direction — this is the part
         that makes justify vs align a fact about geometry rather than a rule to learn.

         PHYSICAL top/left on purpose, not the logical insets used everywhere else in
         this course. A logical inset on a positioned element resolves against THAT
         ELEMENT'S OWN writing mode, so flipping a label to `vertical-rl` also silently
         remaps its inset-inline-start from "left" to "top" and the label lands on the
         opposite edge. These two are a decorative overlay in a fixed LTR frame; physical
         is both correct and the only thing that stays put when the label rotates. */
      .axis {
        position: absolute;
        top: 6px;
        left: 26px;
        font: 700 11px/1 ui-monospace, Menlo, monospace;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }
      .axis-main {
        color: var(--main);
      }
      .axis-cross {
        top: 34px;
        left: 2px;
        color: var(--cross);
        writing-mode: vertical-rl;
      }

      #container {
        display: flex;
        min-height: 240px;
        padding: 10px;
        border: 2px dashed #94a3b8;
        border-radius: 10px;
        background: #f8fafc;
        /* min-width:0 so a wide row cannot push the whole page sideways — the
           very gotcha demo 05 is about, applied here as furniture. */
        min-width: 0;
        overflow: auto;
      }
      .item {
        display: grid;
        place-content: center;
        min-width: 56px;
        min-height: 52px;
        padding: 8px 12px;
        border: 2px solid #1d4ed8;
        border-radius: 8px;
        background: #dbeafe;
        color: #1e3a8a;
        font: 700 15px/1.2 system-ui, sans-serif;
        cursor: pointer;
      }
      .item.selected {
        border-color: var(--main);
        background: #fed7aa;
        color: #7c2d12;
        box-shadow: 0 0 0 3px rgb(180 83 9 / 35%);
      }

      pre {
        margin: 12px 0 0;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #0f172a;
        color: #e2e8f0;
        font: 13px/1.6 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        white-space: pre-wrap;
        overflow-x: auto;
      }
      pre b {
        color: #7dd3fc;
        font-weight: 700;
      }
      .measured {
        margin: 8px 0 0;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f1f5f9;
        font: 12px/1.6 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }
      .reset {
        margin-top: 10px;
        width: 100%;
        font: inherit;
        padding: 5px 10px;
        border: 1px solid #7a8699;
        border-radius: 999px;
        background: #fff;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="layout">
      <div>
        <h2>The container</h2>

        <div class="field">
          <label for="direction">flex-direction</label>
          <select id="direction">
            <option>row</option>
            <option>row-reverse</option>
            <option>column</option>
            <option>column-reverse</option>
          </select>
        </div>

        <div class="field">
          <label for="wrap">flex-wrap</label>
          <select id="wrap">
            <option>nowrap</option>
            <option>wrap</option>
            <option>wrap-reverse</option>
          </select>
        </div>

        <div class="field">
          <label for="justify">justify-content <span id="justify-axis"></span></label>
          <select id="justify">
            <option>flex-start</option>
            <option>flex-end</option>
            <option>center</option>
            <option>space-between</option>
            <option>space-around</option>
            <option>space-evenly</option>
          </select>
        </div>

        <div class="field">
          <label for="align">align-items <span id="align-axis"></span></label>
          <select id="align">
            <option>stretch</option>
            <option>flex-start</option>
            <option>flex-end</option>
            <option>center</option>
            <option>baseline</option>
          </select>
        </div>

        <div class="field">
          <label for="content">align-content <em>(needs wrap)</em></label>
          <select id="content">
            <option>normal</option>
            <option>flex-start</option>
            <option>flex-end</option>
            <option>center</option>
            <option>space-between</option>
            <option>space-around</option>
          </select>
        </div>

        <div class="field">
          <label for="gap">gap</label> <output id="gap-out" for="gap">10px</output>
          <input type="range" id="gap" min="0" max="40" step="2" value="10" />
        </div>

        <h2 class="item-head">The selected item</h2>

        <div class="field">
          <label for="grow">flex-grow</label> <output id="grow-out" for="grow">0</output>
          <input type="range" id="grow" min="0" max="4" step="1" value="0" />
        </div>

        <div class="field">
          <label for="shrink">flex-shrink</label> <output id="shrink-out" for="shrink">1</output>
          <input type="range" id="shrink" min="0" max="4" step="1" value="1" />
        </div>

        <div class="field">
          <label for="basis">flex-basis</label>
          <select id="basis">
            <option>auto</option>
            <option>0%</option>
            <option>80px</option>
            <option>160px</option>
            <option>240px</option>
            <option>50%</option>
          </select>
        </div>

        <div class="field">
          <label for="self">align-self</label>
          <select id="self">
            <option>auto</option>
            <option>flex-start</option>
            <option>flex-end</option>
            <option>center</option>
            <option>stretch</option>
            <option>baseline</option>
          </select>
        </div>

        <div class="field">
          <label for="order">order</label>
          <input type="number" id="order" value="0" step="1" min="-3" max="3" />
        </div>

        <button class="reset" type="button" id="reset">reset everything</button>
      </div>

      <div>
        <div class="stage-wrap">
          <span class="axis axis-main" id="axis-main">main axis →</span>
          <span class="axis axis-cross" id="axis-cross">cross axis →</span>
          <div id="container">
            <button class="item selected" type="button" data-n="1">1</button>
            <button class="item" type="button" data-n="2">2</button>
            <button class="item" type="button" data-n="3">3</button>
            <button class="item" type="button" data-n="4">4</button>
            <button class="item" type="button" data-n="5">5</button>
          </div>
        </div>

        <pre id="css"></pre>
        <p class="measured" id="measured" aria-live="polite"></p>
      </div>
    </div>

    <script>
      const container = document.getElementById('container');
      const items = [...container.querySelectorAll('.item')];
      const cssOut = document.getElementById('css');
      const measured = document.getElementById('measured');
      const axisMain = document.getElementById('axis-main');
      const axisCross = document.getElementById('axis-cross');
      const justifyAxis = document.getElementById('justify-axis');
      const alignAxis = document.getElementById('align-axis');

      const $ = (id) => document.getElementById(id);
      const controls = {
        direction: $('direction'),
        wrap: $('wrap'),
        justify: $('justify'),
        align: $('align'),
        content: $('content'),
        gap: $('gap'),
        grow: $('grow'),
        shrink: $('shrink'),
        basis: $('basis'),
        self: $('self'),
        order: $('order'),
      };

      /* Per-item state, so switching selection does not wipe what you set on box 1. */
      const state = new Map(
        items.map((item) => [item, { grow: 0, shrink: 1, basis: 'auto', self: 'auto', order: 0 }]),
      );
      let selected = items[0];

      /* Item 3 gets more text so `align-items: baseline` and `stretch` have something
         to actually differ about — a row of identical boxes hides both. */
      items[2].textContent = '3 — a taller item, with more words in it';
      items[2].style.maxWidth = '190px';
      items[4].style.fontSize = '26px';

      function select(item) {
        selected = item;
        for (const other of items) other.classList.toggle('selected', other === item);
        const s = state.get(item);
        controls.grow.value = s.grow;
        controls.shrink.value = s.shrink;
        controls.basis.value = s.basis;
        controls.self.value = s.self;
        controls.order.value = s.order;
        render();
      }

      for (const item of items) {
        item.addEventListener('click', () => select(item));
      }

      function render() {
        const s = state.get(selected);
        s.grow = Number(controls.grow.value);
        s.shrink = Number(controls.shrink.value);
        s.basis = controls.basis.value;
        s.self = controls.self.value;
        s.order = Number(controls.order.value);

        container.style.flexDirection = controls.direction.value;
        container.style.flexWrap = controls.wrap.value;
        container.style.justifyContent = controls.justify.value;
        container.style.alignItems = controls.align.value;
        container.style.alignContent = controls.content.value;
        container.style.gap = controls.gap.value + 'px';

        for (const item of items) {
          const is = state.get(item);
          item.style.flexGrow = is.grow;
          item.style.flexShrink = is.shrink;
          item.style.flexBasis = is.basis;
          item.style.alignSelf = is.self;
          item.style.order = is.order;
        }

        $('gap-out').textContent = controls.gap.value + 'px';
        $('grow-out').textContent = s.grow;
        $('shrink-out').textContent = s.shrink;

        paintAxes();
        writeCss(s);
        measure();
      }

      /* The arrows follow flex-direction. This is the anti-memorisation device: the
         labels on the two selects are rewritten too, so at `column` the UI itself says
         justify-content is vertical. */
      function paintAxes() {
        const dir = controls.direction.value;
        const isRow = dir.startsWith('row');
        const reversed = dir.endsWith('reverse');

        axisMain.textContent = isRow
          ? reversed
            ? '← main axis'
            : 'main axis →'
          : reversed
            ? '↑ main axis'
            : 'main axis ↓';
        axisCross.textContent = isRow ? 'cross axis ↓' : 'cross axis →';

        /* Swap which arrow sits along the top and which down the side. Physical
           top/left — see the note on .axis in the stylesheet. */
        axisMain.style.writingMode = isRow ? 'horizontal-tb' : 'vertical-rl';
        axisCross.style.writingMode = isRow ? 'vertical-rl' : 'horizontal-tb';
        axisMain.style.top = isRow ? '6px' : '34px';
        axisMain.style.left = isRow ? '26px' : '2px';
        axisCross.style.top = isRow ? '34px' : '6px';
        axisCross.style.left = isRow ? '2px' : '26px';

        justifyAxis.textContent = isRow ? '— horizontal now' : '— VERTICAL now';
        alignAxis.textContent = isRow ? '— vertical now' : '— HORIZONTAL now';
        justifyAxis.style.color = isRow ? 'var(--muted)' : 'var(--main)';
        alignAxis.style.color = isRow ? 'var(--muted)' : 'var(--main)';
      }

      /* Only non-default declarations are printed. A student copying this out gets the
         short rule a person would write, not a dump of every property. */
      function writeCss(s) {
        const DEFAULTS = {
          direction: 'row',
          wrap: 'nowrap',
          justify: 'flex-start',
          align: 'stretch',
          content: 'normal',
        };
        const lines = ['.container {', '  display: flex;'];
        if (controls.direction.value !== DEFAULTS.direction)
          lines.push('  flex-direction: ' + controls.direction.value + ';');
        if (controls.wrap.value !== DEFAULTS.wrap) lines.push('  flex-wrap: ' + controls.wrap.value + ';');
        if (controls.justify.value !== DEFAULTS.justify)
          lines.push('  justify-content: ' + controls.justify.value + ';');
        if (controls.align.value !== DEFAULTS.align)
          lines.push('  align-items: ' + controls.align.value + ';');
        if (controls.content.value !== DEFAULTS.content)
          lines.push('  align-content: ' + controls.content.value + ';');
        if (controls.gap.value !== '0') lines.push('  gap: ' + controls.gap.value + 'px;');
        lines.push('}');

        const item = [];
        /* The shorthand, when it applies — because `flex: 1` is what they will read in
           real code, and it is on LEGACY_AUDIT §8's list of things never taught. */
        if (s.grow === 1 && s.shrink === 1 && s.basis === '0%') item.push('  flex: 1;');
        else if (s.grow === 1 && s.shrink === 1 && s.basis === 'auto') item.push('  flex: auto;');
        else {
          if (s.grow !== 0) item.push('  flex-grow: ' + s.grow + ';');
          if (s.shrink !== 1) item.push('  flex-shrink: ' + s.shrink + ';');
          if (s.basis !== 'auto') item.push('  flex-basis: ' + s.basis + ';');
        }
        if (s.self !== 'auto') item.push('  align-self: ' + s.self + ';');
        if (s.order !== 0) item.push('  order: ' + s.order + ';');

        if (item.length) {
          lines.push('', '.item-' + selected.dataset.n + ' {', ...item, '}');
        }

        cssOut.textContent = lines.join('\n');
      }

      function measure() {
        requestAnimationFrame(() => {
          const isRow = controls.direction.value.startsWith('row');
          const rows = items.map((item) => {
            const box = item.getBoundingClientRect();
            return (
              '  item ' +
              item.dataset.n +
              '   ' +
              String(Math.round(box.width)).padStart(4, ' ') +
              ' × ' +
              String(Math.round(box.height)).padStart(3, ' ') +
              (item === selected ? '   ← selected' : '')
            );
          });
          const box = container.getBoundingClientRect();
          measured.textContent =
            '  container  ' +
            Math.round(box.width) +
            ' × ' +
            Math.round(box.height) +
            '   main axis is ' +
            (isRow ? 'horizontal' : 'vertical') +
            '\n' +
            rows.join('\n');
        });
      }

      for (const control of Object.values(controls)) {
        control.addEventListener('input', render);
        control.addEventListener('change', render);
      }

      $('reset').addEventListener('click', () => {
        controls.direction.value = 'row';
        controls.wrap.value = 'nowrap';
        controls.justify.value = 'flex-start';
        controls.align.value = 'stretch';
        controls.content.value = 'normal';
        controls.gap.value = '10';
        for (const item of items) {
          state.set(item, { grow: 0, shrink: 1, basis: 'auto', self: 'auto', order: 0 });
        }
        select(items[0]);
      });

      addEventListener('resize', measure);
      select(items[0]);
    </script>
  </body>
</html>
