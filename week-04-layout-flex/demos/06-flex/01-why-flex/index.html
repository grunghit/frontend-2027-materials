<!doctype html>
<!--
  §9.1 for act 5: open with the problem, not the property.

  One navbar, one set of markup, four attempts. The first three are what the web actually
  did for fifteen years, and each one is broken in a way you can point at:

    normal flow    the links stack, because <li> is a block box
    inline-block   they line up, and there are gaps nobody asked for, and vertical
                   alignment is a guess (demo 02-display/02 is the full story)
    float          they line up, the parent collapses to zero height, and the
                   "Sign in" link cannot be pushed to the right without a hack
    flex           three declarations, and every one of those problems is gone

  This is the legacy course's own comparison — lesson 5's "HISTORICAL CONTEXT & PREVIOUS
  METHODS" slide listed exactly these four, and the folder `שיעור 5/flex/` shipped five
  files laying out the same columns five ways. Rebuilt here as one page so the switch is
  instant and the markup provably does not change.

  DEMO MOVE: run the float version and ask why the gold bar has no height. Someone will
  say the links are "outside" it. That is right, and it is why `clearfix` was a thing
  every stylesheet on the internet used to carry. Then switch to flex and delete the
  clearfix in front of them.

  The readout measures the bar's height each time — the collapse is a number, not a claim.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Why flex — the same navbar, four ways</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      button {
        font: inherit;
        padding: 6px 12px;
        border: 1px solid #7a8699;
        border-radius: 999px;
        background: #fff;
        color: inherit;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: #1d4ed8;
        border-color: #1d4ed8;
        color: #fff;
      }
      :focus-visible {
        outline: 3px solid #b45309;
        outline-offset: 2px;
      }

      /* The bar. Gold, like the legacy exercise it is rebuilt from. */
      .bar {
        padding: 10px 14px;
        border: 3px solid #ca8a04;
        border-radius: 8px;
        background: #fef9c3;
      }
      .brand {
        margin: 0;
        font-weight: 700;
        color: #713f12;
      }
      .bar ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .bar a {
        display: block;
        padding: 6px 10px;
        border-radius: 6px;
        color: #713f12;
        text-decoration: none;
        font-weight: 600;
      }
      .bar a:hover {
        background: #fde68a;
      }

      /* ── attempt 1 — normal flow. Nothing added. ─────────────────────────────── */

      /* ── attempt 2 — inline-block ────────────────────────────────────────────── */
      .bar.inline-block li {
        display: inline-block;
      }

      /* ── attempt 3 — float ───────────────────────────────────────────────────── */
      .bar.float li {
        float: left;
      }
      .bar.float .last {
        float: right;
      }

      /* ── attempt 4 — flex. Three declarations. ───────────────────────────────── */
      .bar.flex {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .bar.flex ul {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 1;
      }
      /* The one legitimate use of an auto margin in a flex row: push this item, and
         everything after it, to the end. No float, no absolute, no hack. */
      .bar.flex .last {
        margin-inline-start: auto;
      }

      .after {
        margin-top: 10px;
        padding: 8px 12px;
        border: 2px dashed #94a3b8;
        border-radius: 8px;
        font-size: 14px;
        color: var(--muted);
      }

      .readout {
        margin: 12px 0 0;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f1f5f9;
        font: 13px/1.7 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }
      pre.snippet {
        margin: 8px 0 0;
        padding: 10px 12px;
        border-radius: 8px;
        background: #0f172a;
        color: #e2e8f0;
        font: 13px/1.6 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        white-space: pre-wrap;
        overflow-x: auto;
      }
    </style>
  </head>

  <body>
    <div class="controls" id="controls"></div>

    <h2>The markup never changes. Only the stylesheet does.</h2>

    <nav class="bar" id="bar">
      <p class="brand">Ruppin FE</p>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#work">Work</a></li>
        <li><a href="#about">About</a></li>
        <li class="last"><a href="#in">Sign in</a></li>
      </ul>
    </nav>

    <p class="after">This paragraph comes after the bar in the markup.</p>

    <pre class="snippet" id="snippet"></pre>
    <p class="readout" id="out" aria-live="polite"></p>

    <script>
      const bar = document.getElementById('bar');
      const controls = document.getElementById('controls');
      const out = document.getElementById('out');
      const snippet = document.getElementById('snippet');

      const MODES = [
        {
          id: 'flow',
          label: 'normal flow',
          css: '',
          code: '/* nothing at all */',
          note:
            'Every <li> is a block box, so they stack. This is not a bug — it is the\n' +
            'default, and it is the right default for a list.\n\n' +
            'The question the rest of act 5 answers: how do you ask for a row?',
        },
        {
          id: 'inline-block',
          label: 'inline-block',
          css: 'inline-block',
          code: '.bar li { display: inline-block; }',
          note:
            'A row — with gaps you did not write, from the whitespace between the tags.\n' +
            'The brand is still on its own line, because it is a block box and nothing\n' +
            'made it otherwise. "Sign in" cannot be pushed to the right at all.\n\n' +
            'See 02-display/02-inline-block-gaps for the four ways people fought this.',
        },
        {
          id: 'float',
          label: 'float',
          css: 'float',
          code: '.bar li      { float: left; }\n.bar .last   { float: right; }',
          note:
            'A row, and "Sign in" is on the right — but look at the gold bar. Floated\n' +
            'children are out of flow, so the parent has nothing to size itself against\n' +
            'and collapses. The paragraph below has climbed up into it.\n\n' +
            'This is why every stylesheet on the internet used to carry a `clearfix`.\n' +
            'Floats are for wrapping text around an image. They were never a layout tool;\n' +
            'we used them as one because there was nothing else.',
        },
        {
          id: 'flex',
          label: 'flex',
          css: 'flex',
          code:
            '.bar     { display: flex; align-items: center; gap: 6px; }\n' +
            '.bar ul  { display: flex; align-items: center; gap: 6px; flex: 1; }\n' +
            '.bar .last { margin-inline-start: auto; }',
          note:
            'A row. The brand and the links are on the same line, vertically centred\n' +
            'without anyone guessing at a line-height. The gaps are declared rather than\n' +
            'inherited from the whitespace. The parent has its full height back.\n\n' +
            '`margin-inline-start: auto` on the last item pushes it — and only it — to the\n' +
            'end. That is the one place an auto margin genuinely belongs in a flex row.\n\n' +
            'Flexbox "is designed for components (navbars, cards, toolbars, forms) rather\n' +
            'than full page grids." A navbar is the example, and this is why.',
        },
      ];

      function apply(mode) {
        bar.className = 'bar' + (mode.css ? ' ' + mode.css : '');
        for (const button of controls.children) {
          button.setAttribute('aria-pressed', String(button.dataset.id === mode.id));
        }
        snippet.textContent = mode.code;

        requestAnimationFrame(() => {
          const barBox = bar.getBoundingClientRect();
          const links = [...bar.querySelectorAll('li')];
          const tops = new Set(links.map((li) => Math.round(li.getBoundingClientRect().top)));
          const signIn = bar.querySelector('.last').getBoundingClientRect();
          const pushed = barBox.right - signIn.right < 30;

          out.textContent =
            '  bar height        ' +
            Math.round(barBox.height) +
            'px' +
            (Math.round(barBox.height) < 40 ? '   ← COLLAPSED: its children are out of flow' : '') +
            '\n' +
            '  links on one row  ' +
            (tops.size === 1 ? 'yes' : 'no — they are on ' + tops.size + ' rows') +
            '\n' +
            '  "Sign in" at the end ' +
            (pushed ? 'yes' : 'no') +
            '\n\n' +
            mode.note;
        });
      }

      for (const mode of MODES) {
        const button = document.createElement('button');
        button.textContent = mode.label;
        button.dataset.id = mode.id;
        button.addEventListener('click', () => apply(mode));
        controls.append(button);
      }

      addEventListener('resize', () => {
        const active = controls.querySelector('[aria-pressed="true"]');
        if (active) apply(MODES.find((m) => m.id === active.dataset.id));
      });

      apply(MODES[0]);
    </script>
  </body>
</html>
