<!doctype html>
<!--
  The three numbers behind `flex: 1`. Week-4 deck, act 5.

  `flex-grow`, `flex-shrink` and `flex-basis` are the only part of Flexbox that is
  arithmetic rather than vocabulary, and the arithmetic is worth doing once out loud —
  because after that, `flex: 1` stops being a magic incantation.

  The panel shows the sum the browser actually performs:

      free space  =  container  −  gaps  −  Σ basis
      each item gets  basis + (free × its grow ÷ Σ grow)

  and then prints the browser's measured widths beside the predicted ones. They match,
  which is the point: this is not a model of Flexbox, it is Flexbox.

  The shorthand row is what students will actually read in other people's code. The trap
  worth naming out loud is that `flex: 1` and `flex: auto` are NOT the same:

      flex: 1     →  1 1 0%     content is ignored; equal widths
      flex: auto  →  1 1 auto   content is the starting point; wide items stay wider
      flex: none  →  0 0 auto   never grows, never shrinks

  LEGACY_AUDIT §8 lists the `flex` shorthand as having no legacy source at all — the old
  solution used `flex: 1` without ever teaching it.

  DEMO MOVE: set all three items to `flex: 1` and ask why they are equal even though item
  3 has far more text. Then switch all three to `flex: auto` and watch item 3 keep its
  extra width. The difference is the basis: 0% throws the content away before dividing.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>flex-grow, flex-shrink, flex-basis</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .presets {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      button {
        font: inherit;
        padding: 5px 12px;
        border: 1px solid #7a8699;
        border-radius: 999px;
        background: #fff;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: #1d4ed8;
        border-color: #1d4ed8;
        color: #fff;
      }
      :focus-visible {
        outline: 3px solid #b45309;
        outline-offset: 2px;
      }

      .knobs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 12px;
      }
      .knob {
        flex: 1;
        min-width: 168px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f8fafc;
      }
      .knob h3 {
        margin: 0 0 4px;
        font: 700 12px/1.4 ui-monospace, Menlo, monospace;
        color: #334155;
      }
      .knob label {
        display: block;
        font: 600 11px/1.5 ui-monospace, Menlo, monospace;
        color: var(--muted);
      }
      .knob input[type='range'] {
        width: 100%;
        accent-color: #1d4ed8;
      }
      .knob select {
        width: 100%;
        font: inherit;
        font-size: 13px;
        padding: 3px 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
      }

      /* The container is a fixed width so the arithmetic has a fixed left-hand side. */
      .rail {
        width: 100%;
        max-width: 620px;
        padding: 10px;
        border: 2px dashed #94a3b8;
        border-radius: 10px;
        background: #f8fafc;
      }
      .row {
        display: flex;
        gap: 10px;
      }
      .item {
        min-width: 0; /* the act-5 gotcha, applied as furniture */
        padding: 10px 8px;
        border: 2px solid #1d4ed8;
        border-radius: 8px;
        background: #dbeafe;
        color: #1e3a8a;
        font-size: 13px;
        font-weight: 700;
        overflow: hidden;
      }
      .item:nth-child(2) {
        border-color: #15803d;
        background: #dcfce7;
        color: #14532d;
      }
      .item:nth-child(3) {
        border-color: #b45309;
        background: #fed7aa;
        color: #7c2d12;
      }

      .readout {
        margin: 12px 0 0;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f1f5f9;
        font: 13px/1.65 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        white-space: pre-wrap;
        overflow-x: auto;
      }
    </style>
  </head>

  <body>
    <div class="presets" id="presets"></div>
    <div class="knobs" id="knobs"></div>

    <h2>Three items in a 620px rail, with two 10px gaps</h2>
    <div class="rail">
      <div class="row" id="row">
        <div class="item" data-n="1">one</div>
        <div class="item" data-n="2">two</div>
        <div class="item" data-n="3">three — the item with a good deal more text in it</div>
      </div>
    </div>

    <p class="readout" id="out" aria-live="polite"></p>

    <script>
      const row = document.getElementById('row');
      const items = [...row.querySelectorAll('.item')];
      const knobs = document.getElementById('knobs');
      const presets = document.getElementById('presets');
      const out = document.getElementById('out');

      const state = items.map(() => ({ grow: 0, shrink: 1, basis: 'auto' }));
      const BASES = ['auto', '0%', '80px', '120px', '200px'];

      /* Build one knob per item. */
      items.forEach((item, i) => {
        const box = document.createElement('div');
        box.className = 'knob';
        box.innerHTML =
          '<h3>item ' +
          (i + 1) +
          '</h3>' +
          /* label and output are SIBLINGS, never nested: an <output> is itself a
             labelable control, so a <label for=…> wrapped around one labels two
             controls at once and the markup stops validating. */
          '<label for="grow' +
          i +
          '">flex-grow</label> <output id="g' +
          i +
          '" for="grow' +
          i +
          '">0</output>' +
          '<input type="range" id="grow' +
          i +
          '" min="0" max="4" step="1" value="0">' +
          '<label for="shrink' +
          i +
          '">flex-shrink</label> <output id="s' +
          i +
          '" for="shrink' +
          i +
          '">1</output>' +
          '<input type="range" id="shrink' +
          i +
          '" min="0" max="4" step="1" value="1">' +
          '<label for="basis' +
          i +
          '">flex-basis</label>' +
          '<select id="basis' +
          i +
          '">' +
          BASES.map((b) => '<option>' + b + '</option>').join('') +
          '</select>';
        knobs.append(box);
      });

      const PRESETS = [
        { id: 'default', label: 'the default (0 1 auto)', set: () => ({ grow: 0, shrink: 1, basis: 'auto' }) },
        { id: 'one', label: 'all three: flex: 1', set: () => ({ grow: 1, shrink: 1, basis: '0%' }) },
        { id: 'auto', label: 'all three: flex: auto', set: () => ({ grow: 1, shrink: 1, basis: 'auto' }) },
        {
          id: 'two-one-one',
          label: 'grow 2 / 1 / 1',
          set: (i) => ({ grow: i === 0 ? 2 : 1, shrink: 1, basis: '0%' }),
        },
        {
          id: 'sidebar',
          label: 'a sidebar: 200px + flex: 1',
          set: (i) => (i === 0 ? { grow: 0, shrink: 0, basis: '200px' } : { grow: 1, shrink: 1, basis: '0%' }),
        },
      ];

      for (const preset of PRESETS) {
        const button = document.createElement('button');
        button.textContent = preset.label;
        button.dataset.id = preset.id;
        button.addEventListener('click', () => {
          state.forEach((s, i) => Object.assign(s, preset.set(i)));
          pull();
          for (const b of presets.children) {
            b.setAttribute('aria-pressed', String(b.dataset.id === preset.id));
          }
        });
        presets.append(button);
      }

      /* Push state into the knobs, then render. */
      function pull() {
        state.forEach((s, i) => {
          document.getElementById('grow' + i).value = s.grow;
          document.getElementById('shrink' + i).value = s.shrink;
          document.getElementById('basis' + i).value = s.basis;
        });
        render();
      }

      function shorthand(s) {
        if (s.grow === 1 && s.shrink === 1 && s.basis === '0%') return 'flex: 1';
        if (s.grow === 1 && s.shrink === 1 && s.basis === 'auto') return 'flex: auto';
        if (s.grow === 0 && s.shrink === 0 && s.basis === 'auto') return 'flex: none';
        return 'flex: ' + s.grow + ' ' + s.shrink + ' ' + s.basis;
      }

      function render() {
        state.forEach((s, i) => {
          s.grow = Number(document.getElementById('grow' + i).value);
          s.shrink = Number(document.getElementById('shrink' + i).value);
          s.basis = document.getElementById('basis' + i).value;
          document.getElementById('g' + i).textContent = s.grow;
          document.getElementById('s' + i).textContent = s.shrink;

          items[i].style.flexGrow = s.grow;
          items[i].style.flexShrink = s.shrink;
          items[i].style.flexBasis = s.basis;
        });

        requestAnimationFrame(() => {
          const rowBox = row.getBoundingClientRect();
          const gaps = 20;
          const totalGrow = state.reduce((sum, s) => sum + s.grow, 0);

          /* The basis each item STARTS from. `auto` means "the item's content width",
             which we read back off the browser rather than guessing at. */
          const bases = state.map((s, i) => {
            if (s.basis === 'auto') return null;
            if (s.basis.endsWith('%')) return (parseFloat(s.basis) / 100) * rowBox.width;
            return parseFloat(s.basis);
          });
          const knownBases = bases.map((b, i) =>
            b === null ? items[i].scrollWidth : b,
          );
          const sumBases = knownBases.reduce((a, b) => a + b, 0);
          const free = rowBox.width - gaps - sumBases;

          const lines = state.map((s, i) => {
            const measuredW = Math.round(items[i].getBoundingClientRect().width);
            const share = totalGrow > 0 && free > 0 ? (free * s.grow) / totalGrow : 0;
            const predicted = Math.round(knownBases[i] + share);
            return (
              '  item ' +
              (i + 1) +
              '   ' +
              shorthand(s).padEnd(16, ' ') +
              'basis ' +
              String(Math.round(knownBases[i])).padStart(4, ' ') +
              (totalGrow && free > 0
                ? '  + ' +
                  String(Math.round(share)).padStart(4, ' ') +
                  ' (' +
                  s.grow +
                  '/' +
                  totalGrow +
                  ' of the free space)'
                : '') +
              '   =  ' +
              String(measuredW).padStart(4, ' ') +
              'px' +
              (totalGrow && free > 0 && Math.abs(predicted - measuredW) > 2 ? '  (content minimum held it wider)' : '')
            );
          });

          out.textContent =
            '  container      ' +
            Math.round(rowBox.width) +
            'px\n' +
            '  − two gaps     ' +
            gaps +
            'px\n' +
            '  − Σ basis      ' +
            Math.round(sumBases) +
            'px\n' +
            '  ───────────────────\n' +
            '  free space     ' +
            Math.round(free) +
            'px' +
            (free < 0 ? '   ← NEGATIVE: this is where flex-shrink takes over' : '') +
            '\n\n' +
            lines.join('\n') +
            '\n\n' +
            (free < 0
              ? '  There is not enough room, so the items SHRINK instead. The overflow is\n' +
                '  removed in proportion to flex-shrink × basis — a bigger item gives up more,\n' +
                '  because taking 50px from a 400px item hurts it less than from a 60px one.\n' +
                '  An item with flex-shrink: 0 gives up nothing and forces the rest to.'
              : '  Every "=" above is the browser\'s measured width, not a prediction.\n' +
                '  If the arithmetic and the measurement agree, you have understood the rule.\n\n' +
                '  flex: 1 is  1 1 0%   — basis 0, so content is ignored and widths come out equal.\n' +
                '  flex: auto is 1 1 auto — basis is the content, so wider items stay wider.\n' +
                '  That one difference is most of the confusion around the shorthand.');
        });
      }

      knobs.addEventListener('input', render);
      knobs.addEventListener('change', render);
      addEventListener('resize', render);
      render();
    </script>
  </body>
</html>
