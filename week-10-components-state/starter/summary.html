<!doctype html>
<!--
  ============================================================================
  summary.html — the third page. YOU EDIT EXACTLY ONE LINE IN THIS FILE, IN PART ג.

  IT HOLDS NO DATA OF ITS OWN, and today that stops being a slogan.

  Right now it is served by `js/summary.js`, which imports the seed array and counts
  it. That works, and it is still a SECOND PLACE WHERE THE TRUTH IS COMPUTED: the list
  page's counter and this page's counter are two functions that happen to agree.

  Part ג deletes `js/summary.js` and lets this page be drawn by the SAME `render(state)`
  the list page uses. Nothing here changes except which script tag loads — which is the
  cheapest possible demonstration that the architecture is earning its keep.

  The three mounts render() writes into:

      #summary-count    how many items exist
      #summary-extra    your second measure
      #summary-shelves  one row per category, with its count — DERIVED, so a category
                        with nothing left in it disappears without anybody saying so
  ============================================================================
-->

        --color-line: oklch(0.85 0.01 260);
        --color-page: oklch(0.99 0 0);
        --color-panel: oklch(0.97 0.005 260);
