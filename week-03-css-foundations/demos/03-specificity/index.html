<!doctype html>
<!--
  The specificity calculator. Embedded in the week-3 deck (act 2) and runnable on its own.

  It exists to kill one specific belief: that specificity is a COUNT. The panel shows the
  naive count beside the real triple, and every preset is a case where the two disagree.

  DEMO MOVE: load the first preset — `#cta` against `.site .nav .list .item a`. Five
  selectors against one. Ask the room to vote. Then read the triple: (1,0,0) beats
  (0,4,1), and it is not close, because b never carries into a. Specificity is compared
  column by column, like a version number, not summed.

  Nothing here is hard-coded per preset: the triple is computed by the same function the
  browser's rule is written from, and ../02-cascade/02-explained/ uses an identical copy.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Specificity calculator</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
        --soft: #f1f5f9;
        --win: #15803d;
        --win-bg: #dcfce7;
        --lose: #64748b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h2 {
        margin: 0 0 4px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .row {
        margin-bottom: 12px;
      }
      label {
        display: block;
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 4px;
      }
      input[type='text'] {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
        color: var(--ink);
        font: 15px/1.4 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 3px solid #1d4ed8;
        outline-offset: 2px;
      }
      .readout {
        margin-top: 6px;
        font: 14px/1.6 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        color: var(--muted);
      }
      .triple {
        font: 700 26px/1 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        letter-spacing: 0.04em;
        color: var(--ink);
      }
      .triple b {
        padding: 2px 6px;
        border-radius: 6px;
        background: var(--soft);
      }
      .triple b.hot {
        background: #fef3c7;
      }
      .count {
        font-size: 13px;
        color: var(--muted);
      }
      .verdict {
        margin: 14px 0 12px;
        padding: 10px 14px;
        border-radius: 10px;
        border: 2px solid var(--win);
        background: var(--win-bg);
        font-size: 16px;
        font-weight: 700;
      }
      .verdict.tie {
        border-color: #b45309;
        background: #fffbeb;
      }
      .verdict.bad {
        border-color: #b91c1c;
        background: #fef2f2;
      }
      .presets button {
        font: 13px/1.3 system-ui, sans-serif;
        margin: 0 6px 6px 0;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
      }
      .presets button:hover {
        border-color: #1d4ed8;
        color: #1d4ed8;
      }
      .parts {
        margin: 4px 0 0;
        padding: 0;
        list-style: none;
        font-size: 13px;
        color: var(--muted);
      }
      .parts li {
        display: inline-block;
        margin: 0 6px 4px 0;
        padding: 2px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      }
    </style>
  </head>

  <body>
    <h2>Specificity calculator</h2>

    <div class="presets" id="presets">
      <button type="button" data-a="#cta" data-b=".site .nav .list .item a">
        one id vs five selectors
      </button>
      <button type="button" data-a="nav ul li a" data-b=".nav-link">
        four elements vs one class
      </button>
      <button type="button" data-a="a:hover" data-b="a.button">a tie — so order decides</button>
      <button type="button" data-a="p::first-line" data-b="p">a pseudo-element earns c</button>
      <button type="button" data-a=":where(.card) p" data-b="p">:where() is free</button>
      <button type="button" data-a="input[type='email']" data-b="input:required">
        an attribute weighs like a pseudo-class
      </button>
    </div>

    <div class="row">
      <label for="sel-a">Selector A</label>
      <input type="text" id="sel-a" value="#cta" spellcheck="false" autocomplete="off" />
      <p class="readout" id="out-a"></p>
      <ul class="parts" id="parts-a"></ul>
    </div>

    <div class="row">
      <label for="sel-b">Selector B</label>
      <input
        type="text"
        id="sel-b"
        value=".site .nav .list .item a"
        spellcheck="false"
        autocomplete="off"
      />
      <p class="readout" id="out-b"></p>
      <ul class="parts" id="parts-b"></ul>
    </div>

    <p class="verdict" id="verdict" aria-live="polite"></p>

    <script>
      /* ────────────────────────────────────────────────────────────────────────
         a = #ids · b = .classes [attributes] :pseudo-classes · c = elements ::pseudo-elements
         :is()/:not()/:has() take their strongest argument. :where() contributes nothing.
         The same function runs in ../02-cascade/02-explained/.
         ──────────────────────────────────────────────────────────────────────── */
      function specificity(selector, parts) {
        let a = 0;
        let b = 0;
        let c = 0;
        let s = String(selector).trim();
        const note = (kind, text) => parts && parts.push(kind + ' ' + text);

        s = s.replace(/:(?:is|not|has|matches)\(([^()]*)\)/gi, (m, args) => {
          let best = [0, 0, 0];
          for (const part of args.split(',')) {
            const got = specificity(part);
            if (compare(got, best) > 0) best = got;
          }
          a += best[0];
          b += best[1];
          c += best[2];
          note('(' + best.join(',') + ')', m);
          return ' ';
        });
        s = s.replace(/:where\([^()]*\)/gi, (m) => (note('(0,0,0)', m), ' '));
        s = s.replace(/\[[^\]]*\]/g, (m) => ((b += 1), note('b', m), ' '));
        s = s.replace(/::[a-zA-Z-]+(?:\([^()]*\))?/g, (m) => ((c += 1), note('c', m), ' '));
        s = s.replace(
          /:(?:before|after|first-line|first-letter)\b/gi,
          (m) => ((c += 1), note('c', m), ' '),
        );
        s = s.replace(/:[a-zA-Z-]+(?:\([^()]*\))?/g, (m) => ((b += 1), note('b', m), ' '));
        s = s.replace(/#[\w-]+/g, (m) => ((a += 1), note('a', m), ' '));
        s = s.replace(/\.[\w-]+/g, (m) => ((b += 1), note('b', m), ' '));
        s = s.replace(/[>+~,]/g, ' ');
        for (const token of s.split(/\s+/)) {
          if (!token) continue;
          if (token === '*') {
            note('(0,0,0)', '*');
            continue;
          }
          if (/^[a-zA-Z][\w-]*$/.test(token)) {
            c += 1;
            note('c', token);
          }
        }
        return [a, b, c];
      }

      function compare(x, y) {
        for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] - y[i];
        return 0;
      }

      /** The naive count students actually do in their head: how many pieces are there. */
      function naiveCount(selector) {
        const parts = [];
        specificity(selector, parts);
        return parts.length;
      }

      const els = {
        a: document.getElementById('sel-a'),
        b: document.getElementById('sel-b'),
        outA: document.getElementById('out-a'),
        outB: document.getElementById('out-b'),
        partsA: document.getElementById('parts-a'),
        partsB: document.getElementById('parts-b'),
        verdict: document.getElementById('verdict'),
      };

      function paint(selector, out, list) {
        const parts = [];
        const spec = specificity(selector, parts);
        out.replaceChildren();

        const triple = document.createElement('span');
        triple.className = 'triple';
        ['(', String(spec[0]), ', ', String(spec[1]), ', ', String(spec[2]), ')'].forEach(
          (piece, i) => {
            if (i === 1 || i === 3 || i === 5) {
              const digit = document.createElement('b');
              digit.textContent = piece;
              if (Number(piece) > 0) digit.className = 'hot';
              triple.append(digit);
            } else {
              triple.append(document.createTextNode(piece));
            }
          },
        );

        const count = document.createElement('span');
        count.className = 'count';
        count.textContent =
          '   ' + parts.length + ' selector' + (parts.length === 1 ? '' : 's') + ' counted';

        out.append(triple, count);

        list.replaceChildren(
          ...parts.map((text) => {
            const li = document.createElement('li');
            li.textContent = text;
            return li;
          }),
        );
        return spec;
      }

      function render() {
        const selA = els.a.value;
        const selB = els.b.value;
        const specA = paint(selA, els.outA, els.partsA);
        const specB = paint(selB, els.outB, els.partsB);

        const order = compare(specA, specB);
        const countA = naiveCount(selA);
        const countB = naiveCount(selB);

        let text;
        let cls = 'verdict';
        if (order > 0) {
          text = 'A wins: (' + specA.join(',') + ') beats (' + specB.join(',') + ')';
          if (countA < countB) text += ' — even though B has more pieces in it.';
        } else if (order < 0) {
          text = 'B wins: (' + specB.join(',') + ') beats (' + specA.join(',') + ')';
          if (countB < countA) text += ' — even though A has more pieces in it.';
        } else {
          cls = 'verdict tie';
          text =
            'Tie at (' +
            specA.join(',') +
            '). Specificity has run out of tie-breakers, so ' +
            'the one written LATER in the file wins.';
        }
        els.verdict.className = cls;
        els.verdict.textContent = text;
      }

      for (const input of [els.a, els.b]) input.addEventListener('input', render);

      document.getElementById('presets').addEventListener('click', (event) => {
        const button = event.target.closest('button[data-a]');
        if (!button) return;
        els.a.value = button.dataset.a;
        els.b.value = button.dataset.b;
        render();
      });

      render();
    </script>
  </body>
</html>
