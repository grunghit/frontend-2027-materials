<!doctype html>
<!--
  Three ways to include CSS — stage 2 of 3: INTERNAL (<style> in the head).

  Same pixels as stage 1. Now the brand colour is in four places instead of eight, and
  the markup is readable again.

  DEMO MOVE: this looks like the answer, so make the cost visible — open about.html.
  It is a second page, and it needs its own copy of every rule. Change the brand colour
  here and about.html does not follow.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ruppin Coffee Club — styled in the head</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font: 16px/1.6 system-ui, sans-serif;
        color: #1b2027;
        background: #fff;
      }
      header {
        padding-bottom: 14px;
        border-bottom: 2px solid #0f766e;
      }
      h1 {
        margin: 0;
        font-size: 30px;
        color: #0f766e;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 22px;
        color: #0f766e;
      }
      p {
        max-width: 60ch;
      }
      a {
        color: #0f766e;
        font-weight: 700;
      }
      footer {
        padding-top: 14px;
        border-top: 1px solid #d3dae4;
        color: #5c6675;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Ruppin Coffee Club</h1>
      <p>Third floor, next to the printer that never works.</p>
    </header>

    <main>
      <h2>This week's beans</h2>
      <p>Ethiopia, Guji. Tastes of stone fruit, and of someone else paying.</p>
      <p><a href="about.html">Who runs this</a></p>
    </main>

    <footer>Run by second-years who should have been revising.</footer>
  </body>
</html>
