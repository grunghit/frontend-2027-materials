<!doctype html>
<!--
  "I changed the CSS and nothing happened" — the three real reasons, on one page.

  NOT invalid markup. This file validates cleanly and logs nothing. It is broken in the
  only way CSS is ever broken: the rules the student wrote are all there, and all three
  are losing to something else. That silence is the lesson — do not add a marker, and do
  not fix this file.

  Three planted symptoms, in the order to demo them:

    1. THE HEADING IS STILL GREY. The student edited `.title`. `#page-title` wins on
       specificity, and no amount of editing `.title` will ever beat it.
    2. THE CALLOUT IS STILL AMBER. Two rules, IDENTICAL specificity. The student edited
       the first one. The last one in source order wins.
    3. THE BUTTON TEXT IS STILL BLACK. The student set `color` on the surrounding box and
       expected it to reach inside. Form controls do not inherit colour from the page.

  DEMO MOVE: do not explain. Ask the room which one they would debug first, then open
  DevTools > Elements > Styles and let them watch the struck-through declarations.
  ../02-explained/ is the same page with the cascade shown on the page itself.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Three rules that lose</title>
    <style>
      body {
        margin: 0;
        padding: 22px;
        font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #1b2027;
        background: #fff;
      }

      /* ── Symptom 1 — the student keeps editing this line ─────────────────── */
      .title {
        color: #0f766e;
      }
      /* …and this one wins, from three screens further up the file. */
      #page-title {
        color: #6b7280;
      }

      /* ── Symptom 2 — two rules, same specificity (0,1,0) ─────────────────── */
      /* This is the rule the student edited. Blue, as asked for. */
      .callout {
        border-left: 6px solid #1d4ed8;
        background: #eff6ff;
        padding: 12px 14px;
        border-radius: 8px;
        max-width: 60ch;
      }
      /* …and forty lines later, someone else's rule. Same specificity, later in the
         file, so this is the one that paints. Nothing is "more correct" here — the
         cascade simply ran out of tie-breakers and took the last one. */
      .callout {
        border-left-color: #b45309;
        background: #fffbeb;
      }

      /* ── Symptom 3 — colour set on the box, expected to reach the button ─── */
      .panel {
        color: #b91c1c;
        border: 1px solid #d3dae4;
        border-radius: 10px;
        padding: 14px;
        margin-top: 18px;
        max-width: 60ch;
      }
      button {
        font-size: 16px;
        padding: 8px 16px;
        border: 1px solid #94a3b8;
        border-radius: 999px;
        background: #fff;
      }
      button:focus-visible {
        outline: 3px solid #0f766e;
        outline-offset: 2px;
      }
    </style>
  </head>

  <body>
    <h1 class="title" id="page-title">This heading is supposed to be teal</h1>

    <p class="callout">This callout is supposed to be blue. Someone edited it. Twice.</p>

    <div class="panel">
      <p>Everything in this box is red, because the box says so.</p>
      <p>Everything except this button:</p>
      <p><button type="button">Order a flat white</button></p>
    </div>
  </body>
</html>
