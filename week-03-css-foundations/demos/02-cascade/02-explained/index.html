<!doctype html>
<!--
  The same three broken rules as ../01-conflict/, with the cascade shown ON the page.

  Click any element. Pick a property. The table lists every declaration in this
  stylesheet that targets the clicked element for that property, sorted the way the
  browser sorts them:

      !important   →   specificity (a,b,c)   →   source order

  The winner is the last row standing. That is the entire algorithm — there is no
  fourth tie-breaker, and "inline beats internal beats external" is not one of the
  three (LEGACY_AUDIT.md §7: the old lesson-3 slide got this wrong).

  DEMO MOVE: click the heading with `color` selected. Two rows, `#page-title` on top
  at (1,0,0). Then ask the room to make `.title` win WITHOUT touching `#page-title` —
  they will reach for !important, and that is the moment to talk about debt.

  The inspector is real: it reads document.styleSheets, not a hard-coded list.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The cascade, shown</title>
    <style>
      body {
        margin: 0;
        padding: 22px;
        font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #1b2027;
        background: #fff;
      }

      /* ── Symptom 1 — .title loses to #page-title ─────────────────────────── */
      .title {
        color: #0f766e;
      }
      #page-title {
        color: #6b7280;
      }

      /* ── Symptom 2 — same specificity, later rule wins ───────────────────── */
      .callout {
        border-left: 6px solid #1d4ed8;
        background: #eff6ff;
        padding: 12px 14px;
        border-radius: 8px;
        max-width: 60ch;
      }
      .callout {
        border-left-color: #b45309;
        background: #fffbeb;
      }

      /* ── Symptom 3 — colour does not reach into a form control ───────────── */
      .panel {
        color: #b91c1c;
        border: 1px solid #d3dae4;
        border-radius: 10px;
        padding: 14px;
        margin-top: 18px;
        max-width: 60ch;
      }
      button {
        font-size: 16px;
        padding: 8px 16px;
        border: 1px solid #94a3b8;
        border-radius: 999px;
        background: #fff;
      }

      /* ── The inspector. Chrome, not lesson content. ──────────────────────── */
      .inspector {
        margin-top: 22px;
        padding: 14px 16px;
        border: 2px solid #1b2027;
        border-radius: 12px;
        background: #f8fafc;
      }
      .inspector h2 {
        margin: 0 0 10px;
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #475569;
      }
      .inspector label {
        font-size: 14px;
        font-weight: 700;
      }
      .inspector select {
        font: inherit;
        font-size: 15px;
        padding: 4px 8px;
        border: 1px solid #94a3b8;
        border-radius: 6px;
        background: #fff;
        color: inherit;
      }
      .picked {
        outline: 3px dashed #a03060;
        outline-offset: 3px;
      }
      table {
        border-collapse: collapse;
        margin-top: 12px;
        width: 100%;
        font: 14px/1.5 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      }
      caption {
        text-align: left;
        font: 14px/1.6 system-ui, sans-serif;
        padding-bottom: 6px;
        color: #475569;
      }
      th,
      td {
        border: 1px solid #cbd5e1;
        padding: 6px 9px;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: #e2e8f0;
        font: 700 13px/1.5 system-ui, sans-serif;
        letter-spacing: 0.04em;
      }
      tr.winner td {
        background: #dcfce7;
        font-weight: 700;
      }
      tr.loser td {
        color: #64748b;
        text-decoration: line-through;
      }
      .swatch {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 1px solid #64748b;
        border-radius: 3px;
        vertical-align: -1px;
        margin-right: 6px;
      }
      .note {
        margin: 10px 0 0;
        font: 14px/1.6 system-ui, sans-serif;
        color: #475569;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 3px solid #0f766e;
        outline-offset: 2px;
      }
    </style>
  </head>

  <body>
    <h1 class="title" id="page-title">This heading is supposed to be teal</h1>

    <p class="callout">This callout is supposed to be blue. Someone edited it. Twice.</p>

    <div class="panel">
      <p>Everything in this box is red, because the box says so.</p>
      <p>Everything except this button:</p>
      <p><button type="button">Order a flat white</button></p>
    </div>

    <div class="inspector">
      <h2>Cascade inspector</h2>
      <p class="note" id="hint">Click any element above. Then pick a property.</p>

      <p>
        <label for="prop">Property</label>
        <select id="prop">
          <option value="color">color</option>
          <option value="background-color">background-color</option>
          <option value="border-left-color">border-left-color</option>
          <option value="font-size">font-size</option>
        </select>
      </p>

      <div id="out" aria-live="polite"></div>
    </div>

    <script>
      /* ────────────────────────────────────────────────────────────────────────
         Specificity, computed the way the spec defines it: a triple, not a count.
           a = #ids
           b = .classes, [attributes], :pseudo-classes
           c = element names, ::pseudo-elements
         :is()/:not()/:has() take the specificity of their strongest argument.
         :where() contributes nothing. That is the whole rule set.
         ──────────────────────────────────────────────────────────────────────── */
      function specificity(selector) {
        let a = 0;
        let b = 0;
        let c = 0;
        let s = String(selector).trim();

        s = s.replace(/:(?:is|not|has|matches)\(([^()]*)\)/gi, (_m, args) => {
          let best = [0, 0, 0];
          for (const part of args.split(',')) {
            const got = specificity(part);
            if (compare(got, best) > 0) best = got;
          }
          a += best[0];
          b += best[1];
          c += best[2];
          return ' ';
        });
        s = s.replace(/:where\([^()]*\)/gi, ' ');
        s = s.replace(/\[[^\]]*\]/g, () => ((b += 1), ' '));
        s = s.replace(/::[a-zA-Z-]+(?:\([^()]*\))?/g, () => ((c += 1), ' '));
        s = s.replace(/:(?:before|after|first-line|first-letter)\b/gi, () => ((c += 1), ' '));
        s = s.replace(/:[a-zA-Z-]+(?:\([^()]*\))?/g, () => ((b += 1), ' '));
        s = s.replace(/#[\w-]+/g, () => ((a += 1), ' '));
        s = s.replace(/\.[\w-]+/g, () => ((b += 1), ' '));
        s = s.replace(/[>+~,]/g, ' ');
        for (const token of s.split(/\s+/)) {
          if (token && token !== '*' && /^[a-zA-Z][\w-]*$/.test(token)) c += 1;
        }
        return [a, b, c];
      }

      function compare(x, y) {
        for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] - y[i];
        return 0;
      }

      /** Every style rule in this document, in source order. */
      function allRules() {
        const out = [];
        for (const sheet of document.styleSheets) {
          let rules;
          try {
            rules = sheet.cssRules;
          } catch {
            continue;
          }
          for (const rule of rules) if (rule.style && rule.selectorText) out.push(rule);
        }
        return out;
      }

      /** Which properties inherit — the short list that matters this week. */
      const INHERITS = new Set(['color', 'font-size', 'font-family', 'line-height', 'text-align']);

      const inspector = document.querySelector('.inspector');
      const out = document.getElementById('out');
      const hint = document.getElementById('hint');
      const propSelect = document.getElementById('prop');
      let picked = null;

      function describe(el) {
        let name = el.tagName.toLowerCase();
        if (el.id) name += '#' + el.id;
        /* 'picked' is the inspector's own selection outline, not the page's markup. */
        for (const cls of el.classList) if (cls !== 'picked') name += '.' + cls;
        return name;
      }

      function render() {
        if (!picked) return;
        const prop = propSelect.value;

        const matches = [];
        allRules().forEach((rule, order) => {
          for (const selector of rule.selectorText.split(',')) {
            const sel = selector.trim();
            let hit = false;
            try {
              hit = picked.matches(sel);
            } catch {
              hit = false;
            }
            if (!hit) continue;
            const value = rule.style.getPropertyValue(prop);
            if (!value) continue;
            matches.push({
              selector: sel,
              value: value.trim(),
              important: rule.style.getPropertyPriority(prop) === 'important',
              spec: specificity(sel),
              order,
            });
          }
        });

        /* The browser's own sort: importance, then specificity, then source order. */
        matches.sort((x, y) => {
          if (x.important !== y.important) return x.important ? -1 : 1;
          const bySpec = compare(y.spec, x.spec);
          if (bySpec !== 0) return bySpec;
          return y.order - x.order;
        });

        const computed = getComputedStyle(picked).getPropertyValue(prop).trim();

        if (matches.length === 0) {
          const lines = ['No rule in this stylesheet targets this element for ' + prop + '.'];

          if (!INHERITS.has(prop)) {
            lines.push(
              prop +
                ' does NOT inherit, so setting it on an ancestor changes nothing here. ' +
                "This is the browser's default value.",
            );
          } else {
            /* prop inherits — so either the value really did come down from the parent,
               or the browser's own stylesheet overrode it before inheritance could apply.
               The second case is the whole lesson about form controls, so name it. */
            const parent = picked.parentElement;
            const fromParent = parent ? getComputedStyle(parent).getPropertyValue(prop).trim() : '';
            if (parent && fromParent && fromParent !== computed) {
              lines.push(
                'Its parent computes to ' +
                  fromParent +
                  ', but this element computes to ' +
                  computed +
                  ". The browser's own stylesheet sets " +
                  prop +
                  ' on <' +
                  picked.tagName.toLowerCase() +
                  '> directly, and a set value beats an inherited one. Form controls are the usual ' +
                  'culprit: write ' +
                  prop +
                  ': inherit to opt back in.',
              );
            } else {
              lines.push(
                prop +
                  ' is inherited, so this value came down from an ancestor — or, if no ancestor ' +
                  "sets it, from the browser's own stylesheet.",
              );
            }
          }

          out.replaceChildren(
            ...lines.map((text) => build('p', text, 'note')),
            build('p', 'computed value: ' + computed, 'note'),
          );
          return;
        }

        const table = document.createElement('table');
        const caption = document.createElement('caption');
        caption.textContent =
          matches.length + ' declaration(s) compete for ' + prop + ' on ' + describe(picked) + '.';
        table.append(caption);

        const head = document.createElement('tr');
        for (const label of ['', 'selector', 'a', 'b', 'c', 'order', 'value']) {
          const th = document.createElement('th');
          th.scope = 'col';
          th.textContent = label;
          head.append(th);
        }
        table.append(head);

        matches.forEach((m, i) => {
          const tr = document.createElement('tr');
          tr.className = i === 0 ? 'winner' : 'loser';

          const cells = [
            i === 0 ? 'wins' : '',
            m.selector + (m.important ? ' !important' : ''),
            String(m.spec[0]),
            String(m.spec[1]),
            String(m.spec[2]),
            String(m.order),
            m.value,
          ];
          cells.forEach((text, col) => {
            const td = document.createElement('td');
            if (col === 6 && /^#|^rgb|^hsl/.test(text)) {
              const chip = document.createElement('span');
              chip.className = 'swatch';
              chip.style.background = text;
              td.append(chip);
            }
            td.append(document.createTextNode(text));
            tr.append(td);
          });
          table.append(tr);
        });

        out.replaceChildren(table, build('p', 'computed value: ' + computed, 'note'));
      }

      function build(tag, text, className) {
        const node = document.createElement(tag);
        node.textContent = text;
        if (className) node.className = className;
        return node;
      }

      document.addEventListener('click', (event) => {
        const el = event.target;
        if (inspector.contains(el)) return;
        if (picked) picked.classList.remove('picked');
        picked = el;
        picked.classList.add('picked');
        hint.textContent = 'Selected: ' + describe(picked) + '. Change the property to compare.';
        render();
      });

      propSelect.addEventListener('change', render);
    </script>
  </body>
</html>
