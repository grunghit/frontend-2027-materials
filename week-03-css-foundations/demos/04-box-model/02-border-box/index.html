<!doctype html>
<!--
  The box model — stage 2 of 2: the fix.

  This is ../01-overflow/ with THREE LINES added at the top of the stylesheet:

      *, *::before, *::after { box-sizing: border-box; }

  Nothing else changed. Not one width, not one padding value. `width` now means the width
  of the whole box — content plus padding plus border — which is what everyone thought it
  meant in the first place.

  DEMO MOVE: put the two files side by side, delete the three lines in front of the room,
  watch the boxes break out, put them back. Then say the thing that matters: this rule
  goes at the top of every stylesheet you will write for the rest of your life, and it is
  the first thing in the week-3 assignment.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>box-sizing: border-box</title>
    <style>
      /* ── THE THREE LINES ─────────────────────────────────────────────────────
         ::before and ::after are in there because they are boxes too, and a
         pseudo-element that still measures as content-box is a maddening bug to
         find later. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 16px;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #14181f;
        background: #fff;
      }
      h2 {
        margin: 0 0 2px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #5c6675;
      }
      p.hint {
        margin: 0 0 10px;
        font-size: 14px;
        color: #5c6675;
      }

      .rail {
        width: 260px;
        margin-bottom: 22px;
        padding: 8px;
        border: 2px dashed #94a3b8;
        border-radius: 8px;
        background: #f8fafc;
      }

      .card {
        width: 240px;
        padding: 20px;
        border: 2px solid #15803d;
        border-radius: 8px;
        background: #f0fdf4;
      }
      .card h3 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      .card p {
        margin: 0;
        font-size: 14px;
      }

      .field {
        width: 240px;
        padding: 8px;
        border: 2px dashed #94a3b8;
        border-radius: 8px;
        background: #f8fafc;
      }
      .field label {
        display: block;
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 4px;
      }
      .field input {
        width: 100%;
        padding: 10px;
        border: 1px solid #64748b;
        border-radius: 6px;
        font: inherit;
      }
      .field input:focus-visible {
        outline: 3px solid #1d4ed8;
        outline-offset: 2px;
      }

      .readout {
        margin-top: 6px;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #f1f5f9;
        font: 13px/1.7 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }
      button {
        font: 15px/1.3 system-ui, sans-serif;
        padding: 8px 14px;
        border: 1px solid #14181f;
        border-radius: 999px;
        background: #fff;
        color: #14181f;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #1d4ed8;
        outline-offset: 2px;
      }
    </style>
  </head>

  <body>
    <h2>The same two boxes, with border-box</h2>
    <p class="hint">Same widths. Same padding. Same borders. Three extra lines of CSS.</p>

    <div class="rail">
      <div class="card" id="card">
        <h3>Ethiopia, Guji</h3>
        <p>Stone fruit. Someone else paying.</p>
      </div>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@ruppin.ac.il" />
    </div>

    <p><button type="button" id="measure">measure them</button></p>
    <p class="readout" id="out" aria-live="polite">
      Press the button. Compare with the broken version.
    </p>

    <script>
      document.getElementById('measure').addEventListener('click', () => {
        const report = (label, el) => {
          const style = getComputedStyle(el);
          return (
            label +
            '\n  width declared : ' +
            style.width +
            '\n  padding        : ' +
            style.paddingLeft +
            ' + ' +
            style.paddingRight +
            '\n  border         : ' +
            style.borderLeftWidth +
            ' + ' +
            style.borderRightWidth +
            '\n  ACTUAL on page : ' +
            el.offsetWidth +
            'px' +
            '\n  box-sizing     : ' +
            style.boxSizing
          );
        };
        document.getElementById('out').textContent =
          report('.card', document.getElementById('card')) +
          '\n\n' +
          report('input', document.getElementById('email')) +
          '\n\nThe padding and the border are now INSIDE the 240. Nothing escaped.';
      });
    </script>
  </body>
</html>
