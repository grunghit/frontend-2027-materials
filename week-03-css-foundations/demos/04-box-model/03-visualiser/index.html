<!doctype html>
<!--
  The box-model visualiser. Embedded in the week-3 deck (act 4) and runnable on its own.

  NOTHING HERE IS SIMULATED. The four rings are painted by the browser from the real
  declared values:

    · the content ring  = a background layer clipped to content-box
    · the padding ring  = a second background layer clipped to padding-box
    · the border ring   = the actual border
    · the margin ring   = the striped wrapper showing through the box's own margin

  So when the numbers in the readout disagree with what students expected, they are
  disagreeing with the browser, not with a drawing of one.

  DEMO MOVE: set width 200, padding 20, border 4. Ask how wide the box is. Someone will
  say 200. Read the line marked "on the page": 248. Now flip box-sizing to border-box —
  every slider stays where it is and the number becomes 200.

  The two-column chrome below uses CSS Grid, which is week 5. It is the demo's furniture,
  not today's lesson; say so if anyone asks.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Box model visualiser</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
        --content: #93c5fd;
        --padding: #86efac;
        --border: #334155;
        --margin-a: #fde68a;
        --margin-b: #fef3c7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--ink);
        background: #fff;
      }

      /* Furniture only — week 5. */
      .layout {
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      @media (max-width: 680px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      h2 {
        margin: 0 0 8px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .control {
        margin-bottom: 10px;
      }
      .control-head {
        margin: 0 0 4px;
      }
      .control label {
        font-weight: 700;
        font-size: 14px;
      }
      .control output {
        font: 700 14px/1 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        color: var(--muted);
      }
      input[type='range'] {
        width: 100%;
        accent-color: #1d4ed8;
      }
      select {
        font: inherit;
        padding: 5px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: inherit;
      }
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #1d4ed8;
        outline-offset: 2px;
      }

      .key span {
        display: inline-block;
        margin: 0 10px 0 0;
        font-size: 12px;
        color: var(--muted);
      }
      .key i {
        display: inline-block;
        width: 11px;
        height: 11px;
        margin-right: 4px;
        border-radius: 2px;
        vertical-align: -1px;
      }

      /* The rail the box has to fit inside. Fixed, so "fits / overflows" means something. */
      .rail {
        width: 300px;
        max-width: 100%;
        padding: 0;
        border: 2px dashed #94a3b8;
        border-radius: 6px;
        background: #fff;
      }
      /* overflow:hidden so the box's vertical margins stay INSIDE the striped wrapper
         instead of collapsing through it — margin collapsing is act 4's next slide. */
      .margin-wrap {
        width: fit-content;
        max-width: 100%;
        overflow: hidden;
        background: repeating-linear-gradient(
          45deg,
          var(--margin-a) 0 6px,
          var(--margin-b) 6px 12px
        );
      }
      .box {
        /* Two background layers: one clipped to the content box, one to the padding box.
           The gap between them IS the padding, painted by the browser. */
        background-image:
          linear-gradient(var(--content), var(--content)),
          linear-gradient(var(--padding), var(--padding));
        background-origin: content-box, padding-box;
        background-clip: content-box, padding-box;
        background-repeat: no-repeat;
        border-style: solid;
        border-color: var(--border);
        font: 13px/1.4 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        color: #0b1220;
        overflow-wrap: anywhere;
      }

      .readout {
        margin: 12px 0 0;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f1f5f9;
        font: 13px/1.7 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }
      .verdict {
        margin: 10px 0 0;
        padding: 8px 12px;
        border-radius: 8px;
        border: 2px solid #15803d;
        background: #dcfce7;
        font-weight: 700;
        font-size: 14px;
      }
      .verdict.over {
        border-color: #b91c1c;
        background: #fef2f2;
      }
    </style>
  </head>

  <body>
    <div class="layout">
      <div>
        <h2>The declaration</h2>

        <div class="control">
          <label for="sizing">box-sizing</label>
          <select id="sizing">
            <option value="content-box">content-box (the default)</option>
            <option value="border-box">border-box</option>
          </select>
        </div>

        <div class="control">
          <p class="control-head">
            <label for="width">width</label> <output id="width-out" for="width">200px</output>
          </p>
          <input type="range" id="width" min="80" max="280" step="4" value="200" />
        </div>

        <div class="control">
          <p class="control-head">
            <label for="padding">padding</label>
            <output id="padding-out" for="padding">20px</output>
          </p>
          <input type="range" id="padding" min="0" max="40" step="2" value="20" />
        </div>

        <div class="control">
          <p class="control-head">
            <label for="border">border-width</label>
            <output id="border-out" for="border">4px</output>
          </p>
          <input type="range" id="border" min="0" max="14" step="1" value="4" />
        </div>

        <div class="control">
          <p class="control-head">
            <label for="margin">margin</label> <output id="margin-out" for="margin">16px</output>
          </p>
          <input type="range" id="margin" min="0" max="40" step="2" value="16" />
        </div>

        <p class="key">
          <span><i style="background: #93c5fd"></i>content</span>
          <span><i style="background: #86efac"></i>padding</span>
          <span><i style="background: #334155"></i>border</span>
          <span><i style="background: #fde68a"></i>margin</span>
        </p>
      </div>

      <div>
        <h2>The box, in a 300px rail</h2>
        <div class="rail">
          <div class="margin-wrap">
            <div class="box" id="box">content</div>
          </div>
        </div>

        <p class="readout" id="out" aria-live="polite"></p>
        <p class="verdict" id="verdict"></p>
      </div>
    </div>

    <script>
      const box = document.getElementById('box');
      const out = document.getElementById('out');
      const verdict = document.getElementById('verdict');
      const RAIL = 300;
      const RAIL_BORDER = 2;

      const controls = {
        sizing: document.getElementById('sizing'),
        width: document.getElementById('width'),
        padding: document.getElementById('padding'),
        border: document.getElementById('border'),
        margin: document.getElementById('margin'),
      };
      const outputs = {
        width: document.getElementById('width-out'),
        padding: document.getElementById('padding-out'),
        border: document.getElementById('border-out'),
        margin: document.getElementById('margin-out'),
      };

      /** Pad a number to a fixed width so the readout lines up like a column of sums. */
      const pad = (value, size) => String(value).padStart(size, ' ');

      function render() {
        const width = Number(controls.width.value);
        const padding = Number(controls.padding.value);
        const border = Number(controls.border.value);
        const margin = Number(controls.margin.value);
        const sizing = controls.sizing.value;

        for (const key of ['width', 'padding', 'border', 'margin']) {
          outputs[key].textContent = controls[key].value + 'px';
        }

        box.style.boxSizing = sizing;
        box.style.width = width + 'px';
        box.style.padding = padding + 'px';
        box.style.borderWidth = border + 'px';
        box.style.margin = margin + 'px';

        /* Measured, not calculated: this is the browser's own answer. */
        const onPage = box.offsetWidth;
        const occupied = onPage + margin * 2;
        const available = RAIL - RAIL_BORDER * 2;

        const extra = padding * 2 + border * 2;
        const arithmetic =
          sizing === 'content-box'
            ? 'width is the CONTENT only, so padding and border are ADDED:\n' +
              '  content          ' +
              pad(width, 4) +
              '\n' +
              '  + padding ×2     ' +
              pad(padding * 2, 4) +
              '\n' +
              '  + border  ×2     ' +
              pad(border * 2, 4) +
              '\n' +
              '  = box on page    ' +
              pad(onPage, 4) +
              '   (you asked for ' +
              width +
              ')'
            : 'width is the WHOLE box, so padding and border are taken OUT of it:\n' +
              '  box on page      ' +
              pad(onPage, 4) +
              '   (exactly what you asked for)\n' +
              '  − padding ×2     ' +
              pad(padding * 2, 4) +
              '\n' +
              '  − border  ×2     ' +
              pad(border * 2, 4) +
              '\n' +
              '  = content left   ' +
              pad(Math.max(0, width - extra), 4);

        out.textContent =
          'box-sizing: ' +
          sizing +
          '\n\n' +
          arithmetic +
          '\n\n' +
          '  + margin  ×2     ' +
          pad(margin * 2, 4) +
          '\n' +
          '  = space taken    ' +
          pad(occupied, 4) +
          '   (margin is outside the box, always)';

        const over = occupied - available;
        verdict.className = over > 0 ? 'verdict over' : 'verdict';
        verdict.textContent =
          over > 0
            ? 'Overflows the 300px rail by ' + over + 'px.'
            : 'Fits the 300px rail, with ' + -over + 'px to spare.';
      }

      for (const control of Object.values(controls)) {
        control.addEventListener('input', render);
        control.addEventListener('change', render);
      }
      render();
    </script>
  </body>
</html>
