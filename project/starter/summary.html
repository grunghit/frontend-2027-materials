<!doctype html>
<!--
  ============================================================================
  THE THIRD PAGE — and it must have NO DATA OF ITS OWN.

  Requirement 10. No fetch, no storage read, no state fields that only this page uses.
  Every number on it comes out of `selectSummary(state)` — a pure function of the same
  collection the other two pages show.

  That is why the third page is a summary and not an "About" page: it is the cheapest
  possible proof that the architecture is earning its keep. Add an item on the list
  page, come here, and every count is already right — because there was never a second
  copy of any of them to update.

  ── IF YOU DRAW A CHART, DRAW IT AS AN HTML TABLE

  No chart library is allowed (requirement 5.4) and you do not need one. A bar is a
  `<span>` with a percentage width. What makes it acceptable rather than merely
  possible:

    · every number the bar encodes is ALSO present as text, so a reader who cannot see
      the bar loses nothing;
    · the bar itself carries `aria-hidden="true"`, because it is a second telling of
      the number beside it and reading both is noise;
    · a `<caption>` and a `<th scope="row">` per row make it navigable as what it
      actually is — a table.

  A chart whose only output is a shape excludes people. That is requirement 34, applied
  to a graph.
  ============================================================================
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>סיכום</title>

    <script src="js/theme.js"></script>
    <script src="vendor/tailwind.js"></script>
  </head>

  <body class="min-h-dvh bg-paper text-ink antialiased">
    <a
      href="#main"
      class="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:m-3 focus:rounded-pill focus:bg-brand focus:px-4 focus:py-2 focus:font-semibold focus:text-brand-ink"
      >דלג לתוכן הראשי</a
    >

    <header class="border-b border-line bg-surface">
      <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-6 gap-y-3 px-4 py-4">
        <p class="text-lg font-bold text-brand">הפרויקט שלי</p>
        <nav aria-label="ניווט ראשי">
          <ul class="flex flex-wrap gap-x-5 gap-y-2 text-sm font-semibold">
            <li>
              <a
                href="index.html"
                class="rounded-pill text-ink hover:text-brand hover:underline motion-safe:transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
                >הרשימה</a
              >
            </li>
            <li>
              <a
                href="summary.html"
                aria-current="page"
                class="rounded-pill text-brand underline decoration-2 underline-offset-4 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
                >סיכום</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main" tabindex="-1" class="mx-auto max-w-6xl px-4 py-8">
      <h1 class="text-2xl font-bold text-ink sm:text-3xl">סיכום</h1>
      <p class="mt-2 max-w-measure text-ink-muted">
        כל המספרים בעמוד הזה מחושבים מהאוסף עצמו. אין כאן נתונים נוספים ואין קריאה לרשת.
      </p>

      <div id="notice" role="status" aria-live="polite" class="mt-6 empty:mt-0"></div>

      <!--
        MOUNT. `selectSummary(state)` is rendered in here.

        Remember the empty state: an empty collection gets "nothing to count yet" and a
        link back, NOT a page of zeroes and blank charts. "Average: 0" is a claim that
        everything is terrible; "not rated yet" is the truth.
      -->
      <div id="summary" class="mt-8"></div>
    </main>

    <footer class="mt-16 border-t border-line bg-surface">
      <p class="mx-auto max-w-6xl px-4 py-6 text-sm text-ink-muted"><!-- CODE HERE --></p>
    </footer>

    <noscript>
      <p class="mx-auto max-w-6xl px-4 py-6 text-danger">
        העמוד הזה בונה את התוכן שלו ב-JavaScript, ולכן הוא לא יעבוד כשהוא כבוי.
      </p>
    </noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
