<!doctype html>
<!--

  is CSS or JavaScript.

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ruppin Debate Society — join</title>
  </head>

  <body>
    <header>
      <h1>Ruppin Debate Society</h1>
      <p>Two motions a week, one of them unreasonable on purpose.</p>
    </header>

    <main>
      <section id="join">
        <h2>Join the society</h2>
        <p>Fill in the form and we will put you on next Monday's speaker list.</p>

        <form method="get">
          <p><span>Full name</span> <input type="text" placeholder="Full name" /></p>
          <p><span>Email</span> <input type="text" placeholder="Email" /></p>
          <p><span>Year of study</span> <input type="text" placeholder="1, 2 or 3" /></p>
          <p><span>Why do you want to join?</span> <textarea rows="3"></textarea></p>
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <footer>
      <p>Ruppin Debate Society. Meetings on Mondays, room 118.</p>
    </footer>
  </body>
</html>
