<!doctype html>
<!--
  What came back for P2 (the constrained re-ask), applied to start/index.html exactly as
  the answer described it. Run it and check it yourself.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ruppin Debate Society — join</title>
  </head>

  <body>
    <header>
      <h1>Ruppin Debate Society</h1>
      <p>Two motions a week, one of them unreasonable on purpose.</p>
    </header>

    <main>
      <section id="join">
        <h2>Join the society</h2>
        <p>Fill in the form and we will put you on next Monday's speaker list.</p>

        <form method="get">
          <fieldset>
            <legend>About you</legend>
            <p><label for="full-name">Full name</label> <input type="text" id="full-name" name="full-name" required /></p>
            <p><label for="email">Email</label> <input type="email" id="email" name="email" placeholder="name@example.com" required /></p>
            <p><label for="year">Year of study</label> <input type="number" id="year" name="year" min="1" max="3" /></p>
          </fieldset>
          <p><label for="reason">Why do you want to join?</label> <textarea id="reason" name="reason" rows="3"></textarea></p>
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <footer>
      <p>Ruppin Debate Society. Meetings on Mondays, room 118.</p>
    </footer>
  </body>
</html>
