<!doctype html>
<!--
  The class lending library — the shelf page. Every week-12 cycle types on this page:
  cycle 1 moves js/storage.js to TypeScript, cycle 2 types the DOM, the AI cycle migrates
  js/api.js, cycle 4 refactors js/render.js. The markup does not change in any of them.
  The browser loads js/ — the compiler's output — and has never heard of ts/.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>ספריית ההשאלה — המדף שלי</title>
    <script src="vendor/tailwind.js"></script>
    <style type="text/tailwindcss">
      @theme static {
        --color-ink: oklch(0.23 0.02 250);
        --color-soft: oklch(0.43 0.02 250);
        --color-edge: oklch(0.84 0.01 250);
        --color-paper: oklch(0.99 0.003 90);
        --color-card: oklch(0.97 0.006 90);
        --color-accent: oklch(0.44 0.11 165);
        --color-accent-ink: oklch(0.99 0 0);
        --color-warn: oklch(0.48 0.19 25);
      }
    </style>
    <script type="module" src="js/app.js"></script>
  </head>
  <body class="bg-paper text-ink">
    <header class="border-b border-edge">
      <p class="mx-auto max-w-3xl px-4 py-4 font-bold">ספריית ההשאלה</p>
    </header>

    <main class="mx-auto max-w-3xl px-4 py-8">
      <h1 class="text-2xl font-bold">המדף שלי</h1>
      <p id="status" role="status" class="mt-2 min-h-6 text-soft"></p>

      <section aria-labelledby="shelf-title" class="mt-6">
        <h2 id="shelf-title" class="text-lg font-bold">שמרתי לקריאה</h2>
        <ul id="shelf" class="mt-3 grid gap-2"></ul>
        <p id="shelf-empty" hidden class="mt-3 rounded-lg border border-edge bg-card p-4 text-soft">
          המדף ריק. הוסף ספר מהקטלוג.
        </p>
      </section>

      <section aria-labelledby="catalogue-title" class="mt-8">
        <h2 id="catalogue-title" class="text-lg font-bold">הקטלוג</h2>
        <label for="q" class="mt-3 block text-sm text-soft">חיפוש בקטלוג</label>
        <input id="q" type="search" autocomplete="off" class="mt-1 w-full max-w-sm rounded-md border border-edge bg-paper px-3 py-2" />
        <ul id="catalogue" class="mt-3 grid gap-2"></ul>
      </section>
    </main>
  </body>
</html>
