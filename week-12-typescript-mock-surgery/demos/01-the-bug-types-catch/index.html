<!doctype html>
<!--
  THE WEEK-11 BUG (the data layer), RUNNING — and the one line that would have stopped it.
  Week-12 depth slide (cycle 1's depth). Once the opening demo, and still the argument for the whole subject.

  LEFT: the bug, for real. `add()` puts a `Date` object into the collection, `render`
  calls `.getFullYear()` on it, and everything works. Then SAVE and LOAD — a genuine
  localStorage round trip, not a simulation — and the same line throws
  `created.getFullYear is not a function`, from inside render, which is the last place
  anybody looks for a storage bug.

  RIGHT: the same code, with `created: string`. The compiler's answer to line 13 is
  loaded from `../tsc-output.json`, which was produced by running `tsc` over
  `../tsc-cases/01-date-in-state.ts`. It is not typed out here.

  WHAT THE PAGE COMPUTES: the number of items that survive the round trip with a usable
  `created`, and the exception text, both read off the real objects.

  DEMO MOVE: press ADD twice — it works, and the year shows. Press SAVE, then LOAD.
  The row breaks. THEN say the sentence: "This ran for two weeks. The compiler would
  have refused it before it ran once."
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../demo.css" />
    <title>The bug a type would have caught</title>
  </head>

  <body>
    <h2>A Date in state, and what a reload does to it</h2>

    <div class="bar">
      <button id="add" type="button">add an item</button>
      <button id="save" type="button">save to localStorage</button>
      <button id="load" type="button">load it back</button>
      <button id="reset" type="button">reset</button>
    </div>

    <div class="layout">
      <div class="panel">
        <h3>the collection, drawn</h3>
        <ul id="list" class="mono"></ul>
        <p id="verdict" class="verdict"></p>
        <p id="thrown" class="mono"></p>
      </div>

      <div class="panel">
        <h3>the same code, typed — real <code>tsc</code> output</h3>
        <div id="src" class="src"></div>
        <p id="tsc-verdict" class="verdict"></p>
      </div>
    </div>

    <p class="note">
      The right-hand panel is loaded from <code>tsc-output.json</code>, captured by running the
      compiler over <code>tsc-cases/01-date-in-state.ts</code>. Nothing on this page quotes a
      compiler message from memory.
    </p>

    <script type="module">
      import { caseNamed, renderSource, verdictFor } from '../shared/compiler.js';

      const KEY = 'week12.demo01';
      const list = document.querySelector('#list');
      const verdict = document.querySelector('#verdict');
      const thrown = document.querySelector('#thrown');

      /* The data layer's collection (week 11), exactly as it was written then. */
      let items = [];
      let n = 0;

      /** The line the whole demo is about: `created` is a Date, and nobody said otherwise. */
      const makeItem = () => ({
        id: `i-${(n += 1)}`,
        title: `item ${n}`,
        created: new Date(),
      });

      /**
       * Draw, and REPORT rather than crash.
       *
       * A real render would throw and take the page with it; here the throw is caught so
       * the room can read the message, which is the whole point of the demo.
       */
      function render() {
        list.replaceChildren();
        let usable = 0;
        let error = null;

        for (const item of items) {
          const li = document.createElement('li');
          try {
            /* The line that works for two weeks and then does not. */
            li.textContent = `${item.title} — ${item.created.getFullYear()}`;
            usable += 1;
          } catch (e) {
            error = e instanceof Error ? `${e.constructor.name}: ${e.message}` : String(e);
            li.textContent = `${item.title} — 💥`;
            li.className = 'no';
          }
          list.append(li);
        }

        verdict.textContent =
          items.length === 0
            ? 'nothing in the collection yet'
            : `${usable} of ${items.length} rows drew a year`;
        verdict.className =
          'verdict ' +
          (usable === items.length && items.length > 0 ? 'yes' : items.length === 0 ? '' : 'no');
        thrown.textContent = error === null ? '' : error;
      }

      document.querySelector('#add').addEventListener('click', () => {
        items = [...items, makeItem()];
        render();
      });

      document.querySelector('#save').addEventListener('click', () => {
        localStorage.setItem(KEY, JSON.stringify(items));
        verdict.textContent = `${items.length} items written to localStorage`;
        verdict.className = 'verdict';
        thrown.textContent = '';
      });

      /*
       * THE ROUND TRIP, AND IT IS A REAL ONE. `JSON.stringify` calls `Date.prototype.toJSON`
       * and writes a string; `JSON.parse` has no idea it was ever anything else. Nothing
       * here fakes the conversion — the browser does it.
       */
      document.querySelector('#load').addEventListener('click', () => {
        const raw = localStorage.getItem(KEY);
        if (raw === null) {
          verdict.textContent = 'nothing saved yet — press SAVE first';
          verdict.className = 'verdict';
          return;
        }
        items = JSON.parse(raw);
        render();
      });

      document.querySelector('#reset').addEventListener('click', () => {
        localStorage.removeItem(KEY);
        items = [];
        n = 0;
        render();
      });

      render();

      const entry = await caseNamed('01-date-in-state.ts');
      renderSource(document.querySelector('#src'), entry, { from: 8, to: 14 });
      const tv = document.querySelector('#tsc-verdict');
      tv.textContent = verdictFor(entry);
      tv.className = 'verdict no';
    </script>
  </body>
</html>
