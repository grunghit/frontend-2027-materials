<!doctype html>
<!--
  NARROWING, AND THE TYPO THE COMPILER FINDS. Week-12 reference deck (cycle 1's depth).

  LEFT: the runtime half. Four narrowing tools — `typeof`, `Array.isArray`,
  `instanceof`, and a `value is T` predicate — each run against six real values, and the
  table is COMPUTED from those runs rather than written out. The row that matters is
  `null`: `typeof null === 'object'` is a permanent bug in the language and the table
  shows it agreeing with `{}` in the first column and disagreeing in the last.

  RIGHT: the compile-time half, loaded from ../tsc-output.json. The case file has an
  exhaustive `if` chain over a four-value union — where the last line returns `kind`,
  which type-checks ONLY because every arm is covered, so what reaches it is `never` —
  and a second function with ONE LETTER missing from a literal. `tsc` finds the typo.

  THE SENTENCE: "A union of string literals is not a `string`. That is the difference
  between a field the compiler can check every branch of, and a field that accepts
  `'timout'`."

  DEMO MOVE: run the table, point at the `null` row, and ask what `typeof null` is.
  Then show the typo on the right and ask how long that one takes to find at runtime.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../demo.css" />
    <title>Narrowing, and the typo a union catches</title>
    <style>
      table {
        border-collapse: collapse;
        width: 100%;
        font:
          12.5px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      th,
      td {
        border: 1px solid var(--line);
        padding: 4px 7px;
        text-align: start;
      }
      th {
        background: #f1f5f9;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <h2>Four ways to ask what a value is</h2>

    <div class="bar">
      <button id="run" type="button">run every check against every value</button>
    </div>

    <div class="panel">
      <h3>computed, not written out</h3>
      <div class="scroll-x"><table id="table"></table></div>
      <p id="verdict" class="verdict"></p>
    </div>

    <div class="panel">
      <h3>and the union, through <code>tsc --strict</code></h3>
      <div id="src" class="src"></div>
      <p id="tsc-verdict" class="verdict"></p>
    </div>

    <script type="module">
      import { caseNamed, renderSource } from '../shared/compiler.js';

      /** Six values, chosen because each one breaks a different check. */
      const VALUES = [
        ['{ id: "a" }', { id: 'a' }],
        ['{}', {}],
        ['null', null],
        ['[1, 2]', [1, 2]],
        ['"text"', 'text'],
        ['new Error("x")', new Error('x')],
      ];

      const isRecord = (v) => typeof v === 'object' && v !== null && !Array.isArray(v);
      /** The predicate form: the only one whose answer the compiler carries forward. */
      const isItem = (v) => isRecord(v) && typeof v.id === 'string' && v.id !== '';

      const CHECKS = [
        ['typeof v === "object"', (v) => typeof v === 'object'],
        ['Array.isArray(v)', (v) => Array.isArray(v)],
        ['v instanceof Error', (v) => v instanceof Error],
        ['isItem(v)  // v is Item', isItem],
      ];

      document.querySelector('#run').addEventListener('click', () => {
        const table = document.querySelector('#table');
        table.replaceChildren();

        const head = document.createElement('tr');
        head.append(document.createElement('th'));
        for (const [label] of CHECKS) {
          const th = document.createElement('th');
          th.textContent = label;
          head.append(th);
        }
        table.append(head);

        let agreements = 0;
        for (const [label, value] of VALUES) {
          const tr = document.createElement('tr');
          const th = document.createElement('th');
          th.textContent = label;
          tr.append(th);

          const answers = [];
          for (const [, fn] of CHECKS) {
            const answer = fn(value);
            answers.push(answer);
            const td = document.createElement('td');
            td.textContent = answer ? 'true' : 'false';
            td.className = answer ? 'yes' : 'no';
            tr.append(td);
          }
          /* `null` and `{}` agree on the first column and differ on the last: that pair
             is the whole reason `isRecord` has three parts. */
          if (label === 'null' && answers[0] === true && answers[3] === false) agreements += 1;
          table.append(tr);
        }

        const verdict = document.querySelector('#verdict');
        verdict.textContent =
          agreements === 1
            ? '`typeof null === "object"` — the first column says null is an object, and only the predicate disagrees. That is why isRecord is three checks and not one.'
            : 'something changed in the table — read it again';
        verdict.className = 'verdict ' + (agreements === 1 ? 'yes' : 'no');
      });

      const entry = await caseNamed('04-narrowing.ts');
      renderSource(document.querySelector('#src'), entry, { from: 1, to: 15 });
      const tv = document.querySelector('#tsc-verdict');
      const m = entry.messages[0];
      tv.textContent = m
        ? `line ${m.line} — ${m.code}. One letter, found before it ran.`
        : 'no diagnostics';
      tv.className = 'verdict yes';
    </script>
  </body>
</html>
