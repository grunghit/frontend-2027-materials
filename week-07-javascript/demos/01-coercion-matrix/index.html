<!doctype html>
<!--
  The == table, computed by the browser. Week-7 deck, act 2.

  Ten values down, the same ten across. Every cell is a real `a == b` evaluated live by
  the engine running this page — not a table I typed, and not a table copied off a blog.
  Click any cell and it prints the steps the specification actually took to get there.

  What makes it teach rather than merely demonstrate:

  1. NOBODY CAN CLAIM I GOT THE TABLE WRONG. The cell is `a == b`. The explanation is
     generated beside it from the same values. If the engine and my explanation ever
     disagreed, the explanation would say so out loud — there is an assertion in the
     code for exactly that, and it prints a red row rather than staying quiet.
  2. IT SHOWS THAT == IS NOT TRANSITIVE, AND THE ROOM FINDS IT THEMSELVES. Switch on
     "highlight the broken triangle": `'' == 0` is true, `0 == '0'` is true, and
     `'' == '0'` is FALSE. Three cells, already on screen, that no mental model of
     "it converts types" survives. This is the single moment the act is built around.
  3. IT PUTS === BESIDE IT, NOT INSTEAD OF IT. The toggle redraws the same grid with
     `===`. The diagonal survives and everything else empties. "Use ===" stops being a
     rule they were told and becomes the shape of a picture they just watched collapse.

  DEMO MOVE: do NOT reveal the triangle switch. Ask the room for `'' == 0`, then for
  `0 == '0'`, and let them feel clever. Then ask for `'' == '0'` and wait. Somebody will
  say true. Click it. Then switch on the triangle.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>The == table, computed live</title>

    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
        --accent: #4338ca;
        --true: #0f766e;
        --false: #b91c1c;
        --true-bg: #ecfdf5;
        --false-bg: #fef2f2;
        --code: #0f172a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
        margin-bottom: 12px;
      }
      .bar label {
        font-size: 13px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      input[type='checkbox'],
      input[type='radio'] {
        accent-color: var(--accent);
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(260px, 340px);
        gap: 14px;
        align-items: start;
      }
      @media (max-width: 760px) {
        .layout {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .scroller {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        font:
          13px/1.2 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      th,
      td {
        border: 1px solid var(--line);
        padding: 0;
        text-align: center;
      }
      th {
        background: #f8fafc;
        color: var(--muted);
        font-weight: 600;
        padding: 5px 7px;
        white-space: nowrap;
      }
      th.corner {
        background: #fff;
        border-top-color: #fff;
        border-left-color: #fff;
      }
      td button {
        width: 100%;
        min-width: 44px;
        min-height: 30px;
        border: 0;
        background: none;
        font: inherit;
        cursor: pointer;
        padding: 5px 4px;
        color: inherit;
      }
      td.t {
        background: var(--true-bg);
        color: var(--true);
      }
      td.f {
        background: var(--false-bg);
        color: var(--false);
      }
      td.diag button {
        font-weight: 700;
      }
      td button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: -3px;
      }
      td.lit {
        box-shadow: inset 0 0 0 3px #f59e0b;
      }
      td.sel {
        box-shadow: inset 0 0 0 3px var(--accent);
      }
      .panel {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        background: #f8fafc;
      }
      .panel h3 {
        margin: 0 0 8px;
        font-size: 13px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .expr {
        font:
          16px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: var(--code);
        margin: 0 0 10px;
      }
      ol.steps {
        margin: 0;
        padding-inline-start: 20px;
        font-size: 13px;
      }
      ol.steps li {
        margin-bottom: 6px;
      }
      ol.steps code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #e2e8f0;
        border-radius: 3px;
        padding: 0 3px;
      }
      .verdict {
        margin-top: 10px;
        padding-top: 9px;
        border-top: 1px solid var(--line);
        font-weight: 700;
      }
      .verdict.t {
        color: var(--true);
      }
      .verdict.f {
        color: var(--false);
      }
      .mismatch {
        margin-top: 8px;
        padding: 7px 9px;
        border-radius: 7px;
        background: #7f1d1d;
        color: #fff;
        font-size: 13px;
      }
      .note {
        margin: 10px 0 0;
        font-size: 13px;
        color: var(--muted);
        max-width: 62ch;
      }
      .legend {
        font-size: 12px;
        color: var(--muted);
        margin: 8px 0 0;
      }
    </style>
  </head>
  <body>
    <h2>Loose equality, evaluated by this page</h2>

    <div class="bar">
      <label><input type="radio" name="op" value="==" checked /> compare with <code>==</code></label>
      <label><input type="radio" name="op" value="===" /> compare with <code>===</code></label>
      <label><input type="checkbox" id="triangle" /> highlight the broken triangle</label>
    </div>

    <div class="layout">
      <div class="scroller" tabindex="0" role="group" aria-label="the equality table, scrollable">
        <table id="grid">
          <caption class="legend">
            Click a cell to see how the specification got there.
          </caption>
        </table>
      </div>

      <div class="panel">
        <h3>How it got there</h3>
        <p class="expr" id="expr">Pick a cell.</p>
        <ol class="steps" id="steps"></ol>
        <p class="verdict" id="verdict"></p>
        <div id="mismatch"></div>
      </div>
    </div>

    <p class="note" id="note"></p>

    <script>
      /*
       * The ten values. `label` is what is printed; `make` returns the value itself.
       * A function rather than a literal so that the two array cells are DIFFERENT
       * arrays each time — otherwise `[] == []` would compare one array with itself
       * and come out true, which is a fact about my table and not about JavaScript.
       */
      const VALUES = [
        { label: '0', make: () => 0 },
        { label: '1', make: () => 1 },
        { label: "'0'", make: () => '0' },
        { label: "''", make: () => '' },
        { label: "'false'", make: () => 'false' },
        { label: 'false', make: () => false },
        { label: 'true', make: () => true },
        { label: 'null', make: () => null },
        { label: 'undefined', make: () => undefined },
        { label: 'NaN', make: () => NaN },
        { label: '[]', make: () => [] },
        { label: '[0]', make: () => [0] },
      ];

      /* The three cells of the non-transitive triangle, by label. */
      const TRIANGLE = [
        ["''", '0'],
        ['0', "'0'"],
        ["''", "'0'"],
      ];

      const show = (v) => {
        if (typeof v === 'string') return JSON.stringify(v);
        if (Array.isArray(v)) return `[${v.join(', ')}]`;
        if (typeof v === 'number' && Number.isNaN(v)) return 'NaN';
        return String(v);
      };

      const kind = (v) => (v === null ? 'null' : typeof v);

      /*
       * A narration of the Abstract Equality Comparison, in the order the specification
       * runs it. It returns the steps AND its own conclusion — and the caller compares
       * that conclusion with the real operator. The point of the demo is that the table
       * is true; a narration that could drift away from the truth without saying so
       * would quietly turn this into the blog post it exists to replace.
       */
      function narrateLoose(a, b) {
        const steps = [];
        const ta = kind(a);
        const tb = kind(b);

        if (ta === tb) {
          steps.push(`Both sides are <code>${ta}</code>. Same type, so <code>==</code> does exactly what <code>===</code> does — no conversion happens at all.`);
          if (ta === 'number' && (Number.isNaN(a) || Number.isNaN(b))) {
            steps.push('One side is <code>NaN</code>, and <code>NaN</code> is not equal to anything, including itself.');
            return { steps, result: false };
          }
          if (ta === 'object') {
            steps.push('Two objects are equal only if they are the <em>same</em> object in memory. These are two separate ones.');
            return { steps, result: a === b };
          }
          return { steps, result: a === b };
        }

        if ((a === null && b === undefined) || (a === undefined && b === null)) {
          steps.push('<code>null</code> and <code>undefined</code> are equal to each other, and to nothing else. This is a special case written into the specification.');
          return { steps, result: true };
        }

        if (a === null || a === undefined || b === null || b === undefined) {
          steps.push(`One side is <code>${a === null || b === null ? 'null' : 'undefined'}</code> and the other is not <code>null</code> or <code>undefined</code>. There is no rule that converts either of them, so the answer is false without any conversion.`);
          return { steps, result: false };
        }

        /* An object meets a primitive: ToPrimitive first, then start over. */
        if (ta === 'object' || tb === 'object') {
          const objSide = ta === 'object' ? 'left' : 'right';
          const obj = ta === 'object' ? a : b;
          const prim = obj.valueOf() === obj ? obj.toString() : obj.valueOf();
          steps.push(
            `The ${objSide} side is an object, so it is converted to a primitive first: <code>valueOf()</code> gives back the array itself, so <code>toString()</code> runs instead and produces <code>${show(String(prim))}</code>. An empty array becomes the empty string; <code>[0]</code> becomes <code>"0"</code>.`,
          );
          const na = ta === 'object' ? prim : a;
          const nb = tb === 'object' ? prim : b;
          steps.push(`Now compare <code>${show(na)} == ${show(nb)}</code> and start the rules again.`);
          const inner = narrateLoose(na, nb);
          return { steps: steps.concat(inner.steps), result: inner.result };
        }

        /* Boolean meets anything: the boolean becomes a number. */
        if (ta === 'boolean' || tb === 'boolean') {
          const side = ta === 'boolean' ? 'left' : 'right';
          const bv = ta === 'boolean' ? a : b;
          steps.push(
            `The ${side} side is a boolean, so it becomes a number: <code>${bv}</code> becomes <code>${Number(bv)}</code>. Note what this means — <code>true</code> is compared as <code>1</code>, so <code>'yes' == true</code> is false.`,
          );
          const na = ta === 'boolean' ? Number(a) : a;
          const nb = tb === 'boolean' ? Number(b) : b;
          const inner = narrateLoose(na, nb);
          return { steps: steps.concat(inner.steps), result: inner.result };
        }

        /* String meets number: the string becomes a number. */
        if ((ta === 'string' && tb === 'number') || (ta === 'number' && tb === 'string')) {
          const str = ta === 'string' ? a : b;
          const num = ta === 'number' ? a : b;
          steps.push(
            `A string is compared with a number, so the <em>string</em> becomes a number: <code>${show(str)}</code> becomes <code>${show(Number(str))}</code>. The empty string becomes <code>0</code>, and that single line is where most of the surprises on this table come from.`,
          );
          steps.push(`Both sides are numbers now, so they are compared directly: <code>${show(Number(str))} === ${show(num)}</code>.`);
          return { steps, result: Number(str) === num };
        }

        steps.push('No conversion rule applies.');
        return { steps, result: false };
      }

      function narrateStrict(a, b) {
        const ta = kind(a);
        const tb = kind(b);
        if (ta !== tb) {
          return {
            steps: [`Left is <code>${ta}</code>, right is <code>${tb}</code>. <code>===</code> compares the type first, finds them different, and stops. <strong>Nothing is converted.</strong>`],
            result: false,
          };
        }
        if (ta === 'number' && (Number.isNaN(a) || Number.isNaN(b))) {
          return { steps: ['Same type. But <code>NaN</code> is not equal to itself — this is the one place <code>===</code> is still surprising.'], result: false };
        }
        if (ta === 'object') {
          return { steps: ['Same type. Two objects are equal only if they are the same object; these are two different ones.'], result: a === b };
        }
        return { steps: [`Same type (<code>${ta}</code>), so the values are compared directly.`], result: a === b };
      }

      const grid = document.getElementById('grid');
      const exprEl = document.getElementById('expr');
      const stepsEl = document.getElementById('steps');
      const verdictEl = document.getElementById('verdict');
      const mismatchEl = document.getElementById('mismatch');
      const noteEl = document.getElementById('note');
      const triangleBox = document.getElementById('triangle');

      let selected = null;

      const op = () => document.querySelector('input[name="op"]:checked').value;

      const inTriangle = (ra, rb) =>
        TRIANGLE.some(([x, y]) => (x === ra && y === rb) || (x === rb && y === ra));

      function build() {
        const strict = op() === '===';
        grid.textContent = '';

        const cap = document.createElement('caption');
        cap.className = 'legend';
        cap.textContent = 'Click a cell to see how the specification got there.';
        grid.append(cap);

        const head = document.createElement('tr');
        const corner = document.createElement('th');
        corner.className = 'corner';
        corner.scope = 'col';
        corner.textContent = strict ? '===' : '==';
        head.append(corner);
        for (const v of VALUES) {
          const th = document.createElement('th');
          th.scope = 'col';
          th.textContent = v.label;
          head.append(th);
        }
        grid.append(head);

        let trues = 0;
        for (const rowV of VALUES) {
          const tr = document.createElement('tr');
          const th = document.createElement('th');
          th.scope = 'row';
          th.textContent = rowV.label;
          tr.append(th);

          for (const colV of VALUES) {
            const a = rowV.make();
            const b = colV.make();
            /* The real operator. Everything else on this page is commentary on it. */
            const real = strict ? a === b : a == b;
            if (real) trues += 1;

            const td = document.createElement('td');
            td.className = real ? 't' : 'f';
            if (rowV.label === colV.label) td.classList.add('diag');
            if (!strict && triangleBox.checked && inTriangle(rowV.label, colV.label)) {
              td.classList.add('lit');
            }

            const btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = real ? 'true' : 'false';
            btn.setAttribute(
              'aria-label',
              `${rowV.label} ${strict ? '===' : '=='} ${colV.label} is ${real}. Explain.`,
            );
            btn.addEventListener('click', () => {
              selected = [rowV.label, colV.label];
              explain(rowV, colV);
              paintSelection();
            });
            td.append(btn);
            tr.append(td);
          }
          grid.append(tr);
        }

        const total = VALUES.length * VALUES.length;
        noteEl.textContent = strict
          ? `${trues} of ${total} pairs are equal under ===. Every one of them is on the diagonal, minus NaN, minus the two arrays.`
          : `${trues} of ${total} pairs are equal under ==. The diagonal accounts for ${VALUES.length - 3} of them. Everything else is a conversion you did not ask for.`;

        paintSelection();
      }

      function paintSelection() {
        for (const td of grid.querySelectorAll('td')) td.classList.remove('sel');
        if (!selected) return;
        const rowIdx = VALUES.findIndex((v) => v.label === selected[0]);
        const colIdx = VALUES.findIndex((v) => v.label === selected[1]);
        if (rowIdx < 0 || colIdx < 0) return;
        const row = grid.querySelectorAll('tr')[rowIdx + 1];
        if (row) row.querySelectorAll('td')[colIdx]?.classList.add('sel');
      }

      function explain(rowV, colV) {
        const strict = op() === '===';
        const a = rowV.make();
        const b = colV.make();
        const real = strict ? a === b : a == b;
        const told = strict ? narrateStrict(a, b) : narrateLoose(a, b);

        exprEl.textContent = `${rowV.label} ${strict ? '===' : '=='} ${colV.label}`;

        stepsEl.textContent = '';
        for (const s of told.steps) {
          const li = document.createElement('li');
          li.innerHTML = s;
          stepsEl.append(li);
        }

        verdictEl.textContent = `The engine says ${real}.`;
        verdictEl.className = `verdict ${real ? 't' : 'f'}`;

        /*
         * The honesty check. If the narration above ever disagrees with the operator,
         * the narration is wrong and the page says so rather than quietly teaching it.
         */
        mismatchEl.textContent = '';
        if (told.result !== real) {
          const warn = document.createElement('p');
          warn.className = 'mismatch';
          warn.textContent = `This explanation concluded ${told.result} and the engine says ${real}. The explanation is wrong — trust the cell, not the prose, and tell me.`;
          mismatchEl.append(warn);
        }
      }

      for (const r of document.querySelectorAll('input[name="op"]')) {
        r.addEventListener('change', build);
      }
      triangleBox.addEventListener('change', build);
      build();
    </script>
  </body>
</html>
