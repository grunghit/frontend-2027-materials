<!doctype html>
<!--
  Dark mode, and why @theme IS the token file. Week-6 deck, act 5.

  Week 3 built shared/tokens.css: a :root block of custom properties and a second block
  that redefines them for a dark ramp. Week 6's claim is that @theme is that same file
  with one extra job - it also generates utilities. This demo is the proof, laid out so
  the two halves can be compared line by line.

  The same card is rendered twice, in two real iframes, one light and one dark, side by
  side. Every colour in both is a @theme token, and the table underneath lists each token
  with its resolved value in both ramps and the week-3 name it corresponds to. The panel
  computes the AA contrast of the pairs that carry text, in BOTH ramps.

  ── ONE PIECE OF STAGE MACHINERY, DECLARED

  By default `dark:` compiles to `@media (prefers-color-scheme: dark)` and nothing else,
  and there is NO way for a page to force that preference on part of itself. Setting
  `color-scheme: dark` on an iframe does not do it (measured: the preference inside the
  frame still follows the operating system) - which means the honest side-by-side this
  demo needs cannot be built on the default variant at all.

  So the two frames re-point the variant at a class:

      @custom-variant dark (&:where(.dark, .dark *));

  That is a real Tailwind feature, it is what every tutorial with a moon-icon toggle is
  using, and it is worth ten seconds of the lecture. It is ALSO not what CA6 uses. The
  readout says so, and prints the DEFAULT generated rule beside it - produced live by a
  probe in this outer document, which runs Tailwind with no custom variant at all. So the
  claim "dark: is a media query" is still verified on screen rather than asserted.

  What makes it teach rather than merely demonstrate:

  1. BOTH RAMPS ARE ON SCREEN AT ONCE. Toggling is the usual way to show dark mode and it
     is the wrong way to teach it: a student who sees them one at a time cannot tell which
     values changed, and which values changed is the entire design decision.
  2. Contrast is computed for both, live, from rendered pixels. A dark ramp that passes AA
     in light and fails in dark is the most common accessibility regression in this course
     and here it would be impossible to miss.
  3. The table names the week-3 token beside each Tailwind one, because they are the same
     values. Pretending otherwise would waste the four weeks behind us.

  DEMO MOVE: open it, say nothing, ask "what changed?" Give it fifteen seconds. Someone
  says "the background", someone says "everything". Then point at the brand swatch: it
  moved from 500 to 300, and it HAD to, or the number in the right-hand column drops
  under 4.5. That is the dark-mode lesson - not that colours invert, but that a dark ramp
  is a second set of decisions under the same constraint.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dark mode and the theme block</title>

    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h2 {
        margin: 0 0 6px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .pair {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }
      .side {
        min-width: 0;
        border: 3px solid var(--line);
        border-radius: 12px;
        padding: 8px;
      }
      .side.is-light {
        border-color: #94a3b8;
        background: #f8fafc;
      }
      .side.is-dark {
        border-color: #334155;
        background: #1e293b;
      }
      .side.is-dark h2 {
        color: #94a3b8;
      }
      iframe {
        display: block;
        width: 100%;
        height: 240px;
        border: 0;
        border-radius: 8px;
      }
      table {
        margin: 14px 0 0;
        border-collapse: collapse;
        width: 100%;
        font:
          12.5px/1.6 ui-monospace,
          Menlo,
          Consolas,
          monospace;
      }
      caption {
        text-align: left;
        padding: 8px 0;
        color: var(--muted);
        font-size: 13px;
      }
      th,
      td {
        border: 1px solid var(--line);
        padding: 5px 8px;
        text-align: left;
        vertical-align: middle;
      }
      th {
        background: #f1f5f9;
      }
      .sw {
        display: inline-block;
        width: 14px;
        height: 14px;
        border-radius: 3px;
        border: 1px solid #94a3b8;
        vertical-align: -2px;
        margin-right: 6px;
      }
      .readout {
        margin: 14px 0 0;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f1f5f9;
        font:
          12.5px/1.7 ui-monospace,
          'SF Mono',
          Menlo,
          Consolas,
          monospace;
        white-space: pre-wrap;
      }
      :focus-visible {
        outline: 3px solid #b45309;
        outline-offset: 2px;
      }
    </style>

    <!--
      The OUTER document loads Tailwind with NO custom variant, purely so the readout can
      print what `dark:` compiles to by default. Nothing here is styled with it.
    -->
    <script src="../vendor/tailwind.js"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-probe: hsl(222 30% 9%);
      }
    </style>
  </head>

  <body>
    <div class="pair">
      <div class="side is-light">
        <h2>light ramp</h2>
        <iframe id="f-light" title="The card in the light ramp"></iframe>
      </div>
      <div class="side is-dark">
        <h2>dark ramp</h2>
        <iframe id="f-dark" title="The card in the dark ramp"></iframe>
      </div>
    </div>

    <table>
      <caption>
        every colour in both cards, resolved from the rendered page &mdash; and what week 3
        called it
      </caption>
      <thead>
        <tr>
          <th scope="col"><code>@theme</code> token</th>
          <th scope="col">week 3 (<code>tokens.css</code>)</th>
          <th scope="col">light</th>
          <th scope="col">dark</th>
        </tr>
      </thead>
      <tbody id="tokens"></tbody>
    </table>

    <p class="readout" id="out" aria-live="polite"></p>

    <script>
      /*
        Both frames run the SAME document, byte for byte. The only difference is the
        `dark` class on the root element of one of them — which is what makes this a
        comparison rather than two unrelated screenshots.
      */
      const card = (rootClass) => `<!doctype html>
<html lang="en" class="${rootClass}"><head><meta charset="utf-8"><title>card</title>
<!-- The closing tag is escaped because this markup lives inside a JS template literal:
     an unescaped </scr!pt> would end the OUTER script element mid-string. -->
<script src="../vendor/tailwind.js"><\/script>
<style type="text/tailwindcss">
  /* Re-point the dark variant at a class so both ramps can be on screen at once.
     See this file's header comment: the default is a media query, and a page cannot
     force a media query on part of itself. CA6 uses the default. */
  @custom-variant dark (&:where(.dark, .dark *));

  /* This block IS shared/tokens.css from week 3 — same values, same roles, same
     reasoning — and now every one of them also generates a utility. */
  @theme {
    --color-page: hsl(0 0% 100%);
    --color-surface: hsl(222 44% 98%);
    --color-edge: hsl(222 22% 82%);
    --color-ink: hsl(222 47% 11%);
    --color-ink-muted: hsl(222 20% 34%);
    --color-brand: hsl(234 89% 52%);

    --color-page-dark: hsl(222 30% 9%);
    --color-surface-dark: hsl(222 26% 13%);
    --color-edge-dark: hsl(222 18% 30%);
    --color-ink-dark: hsl(210 30% 96%);
    --color-ink-muted-dark: hsl(214 18% 76%);
    /* The brand moves from the 500 cut to the 300 cut in the dark ramp. Not for
       taste — for the ratio. 500 on a near-black ground is about 3:1, which is
       legal for a border and illegal for a word. */
    --color-brand-dark: hsl(232 100% 76%);
  }
</style>
<style>body{margin:0;padding:14px;font:14px/1.55 system-ui,sans-serif}</style>
</head>
<body class="bg-page dark:bg-page-dark">
  <article id="card" class="rounded-xl border border-edge bg-surface p-4 dark:border-edge-dark dark:bg-surface-dark">
    <p id="eyebrow" class="m-0 text-xs font-bold tracking-wider uppercase text-brand dark:text-brand-dark">Gateway</p>
    <h1 id="title" class="mt-1 mb-2 text-xl font-bold text-ink dark:text-ink-dark">Certificate expires in 6 days</h1>
    <p id="body" class="m-0 text-ink-muted dark:text-ink-muted-dark">
      Renew it before Friday or the gateway starts refusing connections.
    </p>
    <button id="cta" type="button" class="mt-3 cursor-pointer rounded-lg bg-brand px-4 py-2 font-semibold text-white dark:bg-brand-dark dark:text-page-dark">
      Renew now
    </button>
  </article>
</body></html>`;

      const light = document.getElementById('f-light');
      const dark = document.getElementById('f-dark');
      light.srcdoc = card('');
      dark.srcdoc = card('dark');

      /* ── WCAG contrast, same formula as week 3 and demo 04 ───────────────── */
      const channel = (v) => {
        const c = v / 255;
        return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
      };
      const luminance = ([r, g, b]) =>
        0.2126 * channel(r) + 0.7152 * channel(g) + 0.0722 * channel(b);
      const ratio = (a, b) => {
        const [hi, lo] = [luminance(a), luminance(b)].sort((x, y) => y - x);
        return (hi + 0.05) / (lo + 0.05);
      };
      const rgb = (value) => (value.match(/-?[\d.]+/g) || [0, 0, 0]).slice(0, 3).map(Number);

      /* Each row: the token, what week 3 called it, and the element + property to read it
         off in each frame. Reading the RENDERED value rather than the declaration is the
         point — a token nothing actually uses would show up here as a blank cell. */
      const ROWS = [
        ['--color-page', '--color-bg', 'body', 'backgroundColor'],
        ['--color-surface', '--color-surface', '#card', 'backgroundColor'],
        ['--color-edge', '--color-border', '#card', 'borderTopColor'],
        ['--color-ink', '--color-text', '#title', 'color'],
        ['--color-ink-muted', '--color-text-muted', '#body', 'color'],
        ['--color-brand', '--color-accent', '#eyebrow', 'color'],
      ];

      const read = (frame, selector, property) => {
        const doc = frame.contentDocument;
        const el = doc && doc.querySelector(selector);
        return el ? getComputedStyle(el)[property] : '';
      };

      const swatch = (value) => '<span class="sw" style="background:' + value + '"></span>' + value;

      /** What `dark:` compiles to with no custom variant — probed in THIS document. */
      async function defaultDarkRule() {
        const stage = document.createElement('div');
        stage.setAttribute('aria-hidden', 'true');
        stage.style.cssText = 'position:absolute;left:-9999px;top:0';
        const probe = document.createElement('div');
        probe.className = 'dark:bg-probe';
        stage.append(probe);
        document.body.append(stage);

        const esc = '.' + CSS.escape('dark:bg-probe');
        for (let frame = 0; frame < 120; frame++) {
          let hit = null;
          const walk = (rules, context) => {
            for (const rule of rules) {
              if (rule.selectorText && rule.selectorText.trim().startsWith(esc)) {
                hit = { context, selector: rule.selectorText, body: rule.style.cssText };
              }
              if (rule.cssRules) {
                const label =
                  rule.conditionText !== undefined && rule.media !== undefined
                    ? '@media ' + rule.conditionText
                    : context;
                walk(rule.cssRules, label);
              }
            }
          };
          for (const sheet of document.styleSheets) {
            try {
              walk(sheet.cssRules, null);
            } catch {
              /* not ours */
            }
          }
          if (hit) return hit;
          await new Promise((r) => requestAnimationFrame(r));
        }
        return null;
      }

      async function render() {
        document.getElementById('tokens').innerHTML = ROWS.map(
          ([token, legacy, selector, property]) => {
            const l = read(light, selector, property);
            const d = read(dark, selector, property);
            return (
              '<tr><td><code>' +
              token +
              '</code></td><td><code>' +
              legacy +
              '</code></td><td>' +
              (l ? swatch(l) : '&mdash;') +
              '</td><td>' +
              (d ? swatch(d) : '&mdash;') +
              '</td></tr>'
            );
          },
        ).join('');

        const pairs = [
          ['body text on the card', '#body', 'color', '#card', 'backgroundColor'],
          ['the brand eyebrow', '#eyebrow', 'color', '#card', 'backgroundColor'],
          ['the button label', '#cta', 'color', '#cta', 'backgroundColor'],
        ];

        const lines = pairs.map(([label, fg, fgProp, bg, bgProp]) => {
          const lr = ratio(rgb(read(light, fg, fgProp)), rgb(read(light, bg, bgProp)));
          const dr = ratio(rgb(read(dark, fg, fgProp)), rgb(read(dark, bg, bgProp)));
          const mark = (n) => (n.toFixed(2) + (n >= 4.5 ? ' AA' : ' FAILS')).padEnd(12);
          return '    ' + label.padEnd(24) + 'light ' + mark(lr) + 'dark ' + mark(dr);
        });

        const rule = await defaultDarkRule();

        document.getElementById('out').textContent =
          '  contrast, measured off the rendered pixels in both frames:\n\n' +
          lines.join('\n') +
          '\n\n' +
          '  Both ramps have to clear 4.5:1 independently. That is the whole reason the\n' +
          '  brand token moves from hsl(234 89% 52%) to hsl(232 100% 76%) in the dark\n' +
          '  block. A dark ramp is a SECOND set of decisions under the same constraint,\n' +
          '  not an inversion of the first set.\n\n' +
          '  ── and the mechanism, so nobody thinks this is special ──\n\n' +
          '  By DEFAULT, dark: compiles to exactly this — probed live in this page, which\n' +
          '  runs Tailwind with no custom variant:\n\n' +
          (rule
            ? '    ' + rule.context + '\n      ' + rule.selector + ' { ' + rule.body + ' }\n'
            : '    (probe did not resolve)\n') +
          '\n' +
          '  An ordinary media query on an ordinary user preference — the one week 3\n' +
          '  taught. That is why CA6 has no toggle button: a switch needs a click handler,\n' +
          "  and that is week 8. The user's operating system has already answered the\n" +
          '  question, for free, and more accurately than a button in the corner of one\n' +
          '  website ever will.\n\n' +
          '  The two frames above are the exception, and it is declared: they re-point the\n' +
          '  variant at a class with\n\n' +
          '    @custom-variant dark (&:where(.dark, .dark *));\n\n' +
          '  because a page cannot force a media query on part of itself, and a real\n' +
          '  side-by-side is worth more here than purity. That line is also what every\n' +
          '  tutorial with a moon icon in the corner is using. You will need it in the\n' +
          '  project, in week 10, when you have somewhere to put the click handler.';
      }

      let loaded = 0;
      for (const frame of [light, dark]) {
        frame.addEventListener('load', () => {
          loaded++;
          /* Both frames must have compiled before anything is read off them. */
          if (loaded === 2) setTimeout(render, 250);
        });
      }
    </script>
  </body>
</html>
