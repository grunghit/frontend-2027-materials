<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Film club — highlights</title>
    <script src="vendor/tailwind.js"></script>
  </head>
  <body class="bg-white text-gray-900">
    <header class="mx-auto max-w-6xl px-4 pt-6">
      <p class="text-lg font-bold">Film club</p>
    </header>
    <main class="mx-auto max-w-6xl px-4 py-12">
      <h1 class="text-3xl font-bold text-[hsl(234_89%_52%)]">This term at the film club</h1>

      <section aria-labelledby="highlights-title" class="mt-8">
        <h2 id="highlights-title" class="sr-only">Highlights</h2>
        <div class="grid grid-cols-1 gap-6 md:grid-cols-3">
          <article class="rounded-xl border border-gray-200 bg-white p-6">
            <h3 class="text-lg font-semibold">Twelve films</h3>
            <p class="mt-2 text-gray-600">One a week, Thursdays at eight, in Hall B.</p>
            <a
              href="#programme"
              class="mt-4 inline-block rounded-md bg-[hsl(234_89%_52%)] px-4 py-2 text-sm font-medium text-white hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-[hsl(234_89%_52%)] focus:ring-offset-2"
              >See the programme</a
            >
          </article>
          <article class="rounded-xl border border-gray-200 bg-white p-6">
            <h3 class="text-lg font-semibold">Introduced by students</h3>
            <p class="mt-2 text-gray-600">Three of the films come with a ten-minute introduction.</p>
            <a
              href="#introductions"
              class="mt-4 inline-block rounded-md bg-[hsl(234_89%_52%)] px-4 py-2 text-sm font-medium text-white hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-[hsl(234_89%_52%)] focus:ring-offset-2"
              >Who is speaking</a
            >
          </article>
          <article class="rounded-xl border border-gray-200 bg-white p-6">
            <h3 class="text-lg font-semibold">84 seats</h3>
            <p class="mt-2 text-gray-600">Members book first; the rest open on Tuesday.</p>
            <a
              href="#seats"
              class="mt-4 inline-block rounded-md bg-[hsl(234_89%_52%)] px-4 py-2 text-sm font-medium text-white hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-[hsl(234_89%_52%)] focus:ring-offset-2"
              >Book a seat</a
            >
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
