<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Film club — this week</title>
    <!-- Tailwind, from the copy beside this page. Step 1 of the cycle takes the comment off. -->
    <!-- <script src="vendor/tailwind.js"></script> -->
    <style>
      body {
        margin: 0;
        padding: 2rem;
        color: hsl(222 47% 11%);
        background: hsl(0 0% 100%);
      }

      .screening {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        max-width: 24rem;
        padding: 1rem;
        border: 1px solid hsl(222 22% 82%);
        border-radius: 0.75rem;
        background: hsl(222 44% 98%);
      }

      .screening-title {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 600;
        color: hsl(234 89% 52%);
      }

      .screening-meta {
        margin: 0;
        font-size: 0.875rem;
        color: hsl(222 20% 34%);
      }

      .screening-book {
        align-self: flex-start;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        background: hsl(234 89% 52%);
        color: hsl(0 0% 100%);
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>This week at the film club</h1>
      <article class="screening">
        <h2 class="screening-title">Paris, Texas</h2>
        <p class="screening-meta">Thursday 20:00 · Hall B · 147 minutes</p>
        <p class="screening-meta">Wim Wenders, 1984. Introduced by the second-year society.</p>
        <a class="screening-book" href="#book">Book a seat</a>
      </article>
    </main>
    <footer>Film club · Ruppin · Thursdays at eight</footer>
  </body>
</html>
