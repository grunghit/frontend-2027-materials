<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Film club — the programme</title>
    <!-- Tailwind, from the copy beside this page — not a CDN: week 13 has no network. -->
    <script src="vendor/tailwind.js"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-page: hsl(0 0% 100%);
        --color-surface: hsl(222 44% 98%);
        --color-edge: hsl(222 22% 82%);
        --color-ink: hsl(222 47% 11%);
        --color-ink-muted: hsl(222 20% 34%);
        --color-brand-500: hsl(234 89% 52%);
        --color-brand-700: hsl(234 78% 38%);
      }
    </style>
  </head>
  <body class="bg-page p-8 text-ink">
    <main class="mx-auto flex max-w-2xl flex-col gap-6">
      <h1 class="m-0 text-2xl font-bold">The autumn programme</h1>

      <!--
        THE GALLERY. The one place the Book button is defined. Every copy on the page is
        pasted from here, never typed — the assignment's components.html is this, one page long.
      -->
      <section class="rounded-xl border border-dashed border-edge p-4" aria-label="Components">
        <h2 class="m-0 mb-3 text-sm font-semibold text-ink-muted">Components — the definition</h2>
        <button class="rounded-lg bg-brand-500 px-5 py-2 text-sm font-semibold text-white motion-safe:transition-colors hover:bg-brand-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-500" type="button" data-kind="definition">Book</button>
      </section>

      <ul class="m-0 flex list-none flex-col gap-3 p-0">
        <li class="flex items-center justify-between gap-4 rounded-xl border border-edge bg-surface p-4">
          <p class="m-0"><b class="block">Paris, Texas</b> <span class="text-sm text-ink-muted">Thursday 2 Oct · 20:00</span></p>
          <button class="rounded-lg bg-brand-500 px-5 py-2 text-sm font-semibold text-white motion-safe:transition-colors hover:bg-brand-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-500" type="button" data-kind="book-button">Book</button>
        </li>
        <li class="flex items-center justify-between gap-4 rounded-xl border border-edge bg-surface p-4">
          <p class="m-0"><b class="block">Stalker</b> <span class="text-sm text-ink-muted">Thursday 9 Oct · 20:00</span></p>
          <button class="rounded-lg bg-brand-500 px-5 py-2 text-sm font-semibold text-white motion-safe:transition-colors hover:bg-brand-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-500" type="button" data-kind="book-button">Book</button>
        </li>
        <li class="flex items-center justify-between gap-4 rounded-xl border border-edge bg-surface p-4">
          <p class="m-0"><b class="block">Tokyo Story</b> <span class="text-sm text-ink-muted">Thursday 16 Oct · 20:00</span></p>
          <button class="rounded-lg bg-brand-500 px-4 py-2 text-sm font-semibold text-white motion-safe:transition-colors hover:bg-brand-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-500" type="button" data-kind="book-button">Book</button>
        </li>
        <li class="flex items-center justify-between gap-4 rounded-xl border border-edge bg-surface p-4">
          <p class="m-0"><b class="block">Cléo from 5 to 7</b> <span class="text-sm text-ink-muted">Thursday 23 Oct · 20:00</span></p>
          <button class="rounded-lg bg-brand-500 px-5 py-2 text-sm font-semibold text-white motion-safe:transition-colors hover:bg-brand-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-500" type="button" data-kind="book-button">Book</button>
        </li>
        <li class="flex items-center justify-between gap-4 rounded-xl border border-edge bg-surface p-4">
          <p class="m-0"><b class="block">Close-Up</b> <span class="text-sm text-ink-muted">Thursday 30 Oct · 20:00</span></p>
          <button class="rounded-lg bg-brand-500 px-5 py-2 text-sm font-semibold text-white motion-safe:transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-500" type="button" data-kind="book-button">Book</button>
        </li>
      </ul>
    </main>
    <footer class="mx-auto mt-8 max-w-2xl text-sm text-ink-muted">Film club · Ruppin · Thursdays at eight</footer>
  </body>
</html>
