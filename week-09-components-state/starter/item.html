<!doctype html>
<!--
  ============================================================================
  item.html — the detail page. YOU EDIT EXACTLY ONE LINE IN THIS FILE, IN PART ג.

  Week 8 left this page static, and its header comment promised week 9 would render it
  from state like everything else. This is that week, and it is part ג.

  Right now the page has NO SCRIPT AT ALL and the markup inside #detail is a picture of
  an item — hard-coded, always the same one, true of nothing. That is worth looking at
  once, because it is what the whole application was in week 7.

  Part ג adds one line — `<script type="module" src="js/app.js">` — and the picture
  becomes the item. You do not delete the markup below: render() replaces it.

  The whole page is ONE MOUNT:

      #detail   render() writes into it, reading the id from `location.search`

  What makes this worth ten minutes rather than being a chore: `js/app.js` does not
  know which of the three pages it is on. `render(state)` writes into every mount it
  can find and returns immediately from every mount it cannot. Adding a page means
  adding a mount and a renderer — and changing nothing anywhere else.

  Open it with an id that does not exist. `?id=nope` is an EMPTY STATE with a way
  back, not an error and not a blank page. Week 6 called that one of the four states;
  here it costs two lines.
  ============================================================================
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>CODE-HERE — עמוד הפריט</title>

    <script src="vendor/tailwind.js"></script>
    <style type="text/tailwindcss">
      /* GIVEN, AND IT WORKS AS IT IS. The token layer from week 5. */
      @theme static {
        --color-ink: oklch(0.22 0.02 260);
        --color-muted: oklch(0.42 0.02 260);
        --color-line: oklch(0.85 0.01 260);
        --color-page: oklch(0.99 0 0);
        --color-panel: oklch(0.97 0.005 260);
        --color-brand: oklch(0.45 0.17 275);
        --color-brand-ink: oklch(0.98 0 0);
        --color-bad: oklch(0.48 0.19 25);
      }
    </style>

    <!-- PART ג ADDS ONE LINE HERE: the same entry point the other two pages use.
         There is no per-page script anywhere in this application. -->
  </head>

  <body class="bg-page text-ink font-sans">
    <a
      href="#main"
      class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:right-2 focus:z-10 focus:rounded-md focus:bg-brand focus:px-4 focus:py-2 focus:text-brand-ink"
      >דלג לתוכן</a
    >

    <header class="border-b border-line">
      <nav class="mx-auto flex max-w-5xl flex-wrap items-center gap-6 px-4 py-4" aria-label="ראשי">
        <span class="CODE-HERE font-bold">המזווה</span>
        <a href="index.html" class="hover:text-brand">הרשימה</a>
        <a href="item.html" aria-current="page" class="text-brand underline underline-offset-4"
          >פריט</a
        >
        <a href="summary.html" class="hover:text-brand">סיכום</a>
      </nav>
    </header>

    <main id="main" tabindex="-1" class="mx-auto max-w-5xl px-4 py-8">
      <!-- THE MOUNT. It ships holding a PICTURE of an item: correct-looking markup
           that is true of nothing. render() replaces every child of it, including with
           the empty state for an id that is not in the collection. -->
      <div id="detail">
        <h1 class="text-2xl font-bold">קמח מלא</h1>
        <dl class="mt-6 grid gap-3 rounded-lg border border-line bg-panel p-4 sm:grid-cols-2">
          <div>
            <dt class="text-sm text-muted">מדף</dt>
            <dd class="font-semibold">יבשים</dd>
          </div>
          <div>
            <dt class="text-sm text-muted">כמות</dt>
            <dd class="font-semibold">2</dd>
          </div>
        </dl>
      </div>

      <p class="mt-6">
        <a href="index.html" class="text-brand underline underline-offset-4">חזרה לרשימה</a>
      </p>
    </main>
  </body>
</html>
