<!doctype html>
<!--
  ============================================================================
  index.html — the list page. GIVEN AND COMPLETE. You do not edit this file.

  ── WHY IT IS GIVEN THIS WEEK
  Today is a REFACTOR. The screen must look and behave exactly the same when you are
  finished as it does now — that is what makes it a refactor rather than a rewrite,
  and it is how you will know you have not broken anything. If the markup were also
  moving, you would have no fixed point to measure against.

  Three controls are new since week 8, and all three are already wired to nothing:

      #query          a text box. Narrows the list.
      #category       a <select>. Its <option>s are BUILT FROM THE DATA, not written
                      here — remove the last item of a category and the option has to
                      disappear by itself.
      #sort           a <select>. Reorders the list.

  ── THE CONTRACT (unchanged from week 8, plus the three above)
  The ids and class names below are FIXED, because the grader and your own CI both
  look for them. Everything else — the words, the colours, the entity — is yours.

      #item-form      the add form
      #field-title    the text field (your entity's name)
      #field-number   the numeric field
      #form-error     where a failed submit says what went wrong
      #list           THE MOUNT. Emptied and refilled by render(). Nothing the user
                      operates may live inside it.
      #empty          the empty state, shown only when there is nothing to show
      #count          how many items are ON SCREEN — which after today is not always
                      how many items exist
      #undo           where the undo offer appears, for the challenge tier

  Each row that render() builds must be
      <li data-id="…">  … <span class="item-title">…</span> …
                        <button class="remove"><span>הסר</span></button> </li>

  `data-id`, and never `data-index`. The row's position changes every time somebody
  sorts, searches or filters; its identity does not. This is graded.
  ============================================================================
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>CODE-HERE — שם היישום שלך</title>

    <script src="vendor/tailwind.js"></script>
    <style type="text/tailwindcss">
      /* GIVEN, AND IT WORKS AS IT IS. The token layer from week 5. */
      @theme static {
        --color-ink: oklch(0.22 0.02 260);
        --color-muted: oklch(0.42 0.02 260);
        --color-line: oklch(0.85 0.01 260);
        --color-page: oklch(0.99 0 0);
        --color-panel: oklch(0.97 0.005 260);
        --color-brand: oklch(0.45 0.17 275);
        --color-brand-ink: oklch(0.98 0 0);
        --color-bad: oklch(0.48 0.19 25);
      }
    </style>

    <!-- ONE ENTRY POINT, for all three pages. It is a module, and therefore deferred:
         it runs after the markup exists, which is why there is no DOMContentLoaded
         anywhere in this assignment. -->
    <script type="module" src="js/app.js"></script>
  </head>

  <body class="bg-page text-ink font-sans">
    <a
      href="#main"
      class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:right-2 focus:z-10 focus:rounded-md focus:bg-brand focus:px-4 focus:py-2 focus:text-brand-ink"
      >דלג לתוכן</a
    >

    <header class="border-b border-line">
      <nav class="mx-auto flex max-w-5xl flex-wrap items-center gap-6 px-4 py-4" aria-label="ראשי">
        <span class="CODE-HERE font-bold">המזווה</span>
        <a href="index.html" aria-current="page" class="text-brand underline underline-offset-4"
          >הרשימה</a
        >
        <a href="item.html" class="hover:text-brand">פריט</a>
        <a href="summary.html" class="hover:text-brand">סיכום</a>
      </nav>
    </header>

    <main id="main" tabindex="-1" class="mx-auto max-w-5xl px-4 py-8">
      <h1 class="CODE-HERE text-2xl font-bold">המזווה</h1>

      <!-- STATIC, and outside #list on purpose. A field that is destroyed while you are
           typing in it loses your text and your focus — and from today #list is rebuilt
           on every single keystroke. -->
      <form
        id="item-form"
        class="mt-6 flex flex-wrap items-end gap-4 rounded-lg border border-line bg-panel p-4"
      >
        <div>
          <label for="field-title" class="CODE-HERE block text-sm text-muted">שם</label>
          <input
            id="field-title"
            name="title"
            type="text"
            autocomplete="off"
            class="mt-1 rounded-md border border-line bg-page px-3 py-2 aria-[invalid=true]:border-2 aria-[invalid=true]:border-bad"
          />
        </div>
        <div>
          <label for="field-number" class="CODE-HERE block text-sm text-muted">כמות</label>
          <input
            id="field-number"
            name="number"
            type="number"
            class="mt-1 w-32 rounded-md border border-line bg-page px-3 py-2 aria-[invalid=true]:border-2 aria-[invalid=true]:border-bad"
          />
        </div>
        <div>
          <label for="field-category" class="CODE-HERE block text-sm text-muted">מדף</label>
          <input
            id="field-category"
            name="category"
            type="text"
            autocomplete="off"
            class="mt-1 w-32 rounded-md border border-line bg-page px-3 py-2 aria-[invalid=true]:border-2 aria-[invalid=true]:border-bad"
          />
        </div>
        <button
          type="submit"
          class="rounded-md bg-brand px-4 py-2 font-semibold text-brand-ink hover:opacity-90 focus-visible:outline-2 focus-visible:outline-offset-2"
        >
          הוסף
        </button>
      </form>

      <!-- role="status" so a screen reader announces a failed submit without moving
           focus away from wherever the user is. Week 6, in code. -->
      <p id="form-error" role="status" class="mt-2 min-h-6 font-semibold text-bad"></p>

      <!-- THE THREE VIEW CONTROLS. They change what you SEE. They never change what
           exists — which is why not one of them may touch the collection. -->
      <div class="mt-6 flex flex-wrap items-end gap-4 rounded-lg border border-line p-4">
        <div>
          <label for="query" class="block text-sm text-muted">חיפוש</label>
          <input
            id="query"
            type="search"
            autocomplete="off"
            class="mt-1 rounded-md border border-line bg-page px-3 py-2"
          />
        </div>
        <div>
          <label for="category" class="CODE-HERE block text-sm text-muted">מדף</label>
          <!-- Only the "all" option is written here. Every other <option> is derived
               from the collection at render time. -->
          <select id="category" class="mt-1 rounded-md border border-line bg-page px-3 py-2">
            <option value="all">הכול</option>
          </select>
        </div>
        <div>
          <label for="sort" class="block text-sm text-muted">מיון</label>
          <select id="sort" class="mt-1 rounded-md border border-line bg-page px-3 py-2">
            <option value="title">לפי שם</option>
            <option value="number">CODE-HERE — לפי כמות</option>
          </select>
        </div>
      </div>

      <p class="mt-4 text-muted">מוצג: <span id="count">0</span></p>

      <!-- Where the undo offer appears (challenge tier). Outside #list, like every
           other control on this page. -->
      <div id="undo" role="status" class="mt-2 min-h-9"></div>

      <!-- THE MOUNT. It ships empty. render() fills it. -->
      <ul id="list" class="mt-4 grid gap-3"></ul>

      <p id="empty" hidden class="mt-4 rounded-lg border border-line bg-panel p-6 text-muted">
        <span class="CODE-HERE">אין כאן עדיין כלום. הוסף פריט ראשון בטופס שלמעלה.</span>
      </p>
    </main>
  </body>
</html>
