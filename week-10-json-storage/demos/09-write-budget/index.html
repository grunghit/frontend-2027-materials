<!doctype html>
<!--
  How often should it save? Week-10 deck, act 6.

  `subscribe(save)` is one line and it is correct. It is also a write to disk on every
  single state change — and after week 9, typing in the search box IS a state change.
  This page types a word into three copies of the same application and counts.

  Three strategies, measured, not argued:

    every change     save on every notification            — the one-liner
    identity guard   save only when `state.items` is a     — one line, exact
                     DIFFERENT ARRAY than last time
    debounce 300ms   save 300ms after the last change      — the general tool

  What makes it teach:

  1. THE TYPING IS REAL. A word is fed in one character at a time with a delay, the way
     a person types, and every `setState` runs. The counters are incremented inside the
     save functions themselves.
  2. THE IDENTITY GUARD IS FREE, AND THE PAGE SAYS WHY. It works because of a rule from
     week 9 that had nothing to do with storage: handlers build NEW arrays instead of
     editing the one in state. So `!==` is an exact answer to "did the collection
     change", with no comparison and no timer.
  3. THE DEBOUNCE HAS A COST AND IT IS SHOWN. There is a window in which the change is
     on screen and not on disk, and the "close the tab NOW" button demonstrates exactly
     what is lost. The fix — flushing on `pagehide` — is one line, and the fourth
     column shows it working.
  4. MILLISECONDS PER WRITE ARE MEASURED. localStorage is SYNCHRONOUS: every write in
     that column blocked the main thread for the time shown.

  DEMO MOVE: type into the box yourself. Ask which counter should be moving.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../demo.css" />
    <title>The write budget</title>
  </head>

  <body>
    <h2>One word typed into a search box, three saving strategies</h2>

    <div class="bar">
      <label for="box">search</label>
      <input id="box" type="search" size="18" autocomplete="off" placeholder="type here" />
      <button id="auto" type="button" class="primary">type "פפריקה" for me</button>
      <span class="sep"></span>
      <button id="add" type="button">add an item (a real change)</button>
      <button id="kill" type="button">close the tab NOW</button>
      <button id="reset" type="button">reset</button>
    </div>

    <div class="scroll-x">
      <table>
        <thead>
          <tr>
            <th>strategy</th>
            <th>writes</th>
            <th>total ms blocking the main thread</th>
            <th>on disk right now</th>
            <th>correct?</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <p class="verdict" id="verdict"></p>

    <p class="note">
      localStorage is <b>synchronous</b>. The millisecond column is time the page spent unable to do
      anything else &mdash; not time in the background.
    </p>

    <script>
      const BASE = [
        { id: 'a1', title: 'קמח מלא', number: 2, category: 'יבשים' },
        { id: 'a2', title: 'פפריקה מעושנת', number: 3, category: 'תבלינים' },
      ];

      /* Three independent copies of the same application, differing only in when they
         write. Each keeps its own key so "what is on disk" is a real read. */
      const makeApp = (name, mode) => ({
        name,
        mode,
        key: `demo09.${mode}`,
        items: BASE.slice(),
        query: '',
        writes: 0,
        ms: 0,
        last: null,
        timer: null,
        pending: false,
      });

      const APPS = [
        makeApp('every change', 'every'),
        makeApp('identity guard', 'guard'),
        makeApp('debounce 300ms', 'debounce'),
      ];

      function write(app) {
        const t0 = performance.now();
        try {
          localStorage.setItem(app.key, JSON.stringify({ v: 1, items: app.items }));
        } catch {
          /* full — demo 08's subject, not this one */
        }
        app.ms += performance.now() - t0;
        app.writes += 1;
        app.last = app.items;
        app.pending = false;
        /* A DEBOUNCED WRITE HAPPENS OUTSIDE EVERY HANDLER. Without this line the table
           keeps saying "NOT YET" until somebody clicks something else — which during a
           lecture is for as long as nobody touches anything. Found by the test suite. */
        paint();
      }

      /* The subscriber, one per strategy. This function IS the difference between the
         three columns; everything else on the page is identical. */
      function persist(app) {
        if (app.mode === 'every') return write(app);

        if (app.mode === 'guard') {
          /* Week 9's rule, cashed in: handlers build NEW arrays, so `!==` is an exact
             answer to "did the collection change" — no comparison, no timer. */
          if (app.items === app.last) return;
          return write(app);
        }

        app.pending = true;
        clearTimeout(app.timer);
        app.timer = setTimeout(() => write(app), 300);
      }

      const setState = (patch) => {
        for (const app of APPS) {
          Object.assign(app, patch(app));
          persist(app);
        }
        paint();
      };

      const onDisk = (app) => {
        try {
          const raw = localStorage.getItem(app.key);
          return raw === null ? 0 : JSON.parse(raw).items.length;
        } catch {
          return -1;
        }
      };

      function paint() {
        document.querySelector('#rows').replaceChildren(
          ...APPS.map((app) => {
            const stored = onDisk(app);
            const correct = stored === app.items.length;
            const tr = document.createElement('tr');
            for (const [text, cls] of [
              [app.name, ''],
              [String(app.writes), 'mono'],
              [app.ms.toFixed(1), 'mono'],
              [`${stored} items${app.pending ? ' · one change still pending' : ''}`, 'mono'],
              [correct ? 'yes' : 'NOT YET', correct ? 'good' : 'bad'],
            ]) {
              const td = document.createElement('td');
              td.className = cls;
              td.textContent = text;
              tr.append(td);
            }
            return tr;
          }),
        );

        const [every, guard] = APPS;
        const saved = every.writes - guard.writes;
        document.querySelector('#verdict').textContent =
          saved <= 0
            ? 'Type something, or press the button, and watch the first two columns separate.'
            : `The identity guard skipped ${saved} of ${every.writes} writes — ` +
              `every one of them a write of a collection that had not changed. ` +
              `It is one line, and it is exact, because week 9 made handlers build new arrays.`;
      }

      const box = document.querySelector('#box');
      box.addEventListener('input', () => setState(() => ({ query: box.value })));

      document.querySelector('#add').addEventListener('click', () =>
        setState((app) => ({
          items: [
            ...app.items,
            { id: 'x' + app.items.length, title: 'חדש', number: 1, category: 'בדיקה' },
          ],
        })),
      );

      document.querySelector('#auto').addEventListener('click', async () => {
        const word = 'פפריקה';
        box.value = '';
        for (const ch of word) {
          box.value += ch;
          setState(() => ({ query: box.value }));
          await new Promise((r) => setTimeout(r, 90));
        }
      });

      /*
       * The cost of a debounce, shown rather than described: a window in which the
       * change is on screen and not on disk. `pagehide` is where you close it — one
       * line, and it is the line the challenge tier asks for.
       */
      document.querySelector('#kill').addEventListener('click', () => {
        const debounced = APPS[2];
        const lostBefore = onDisk(debounced) !== debounced.items.length;
        const el = document.querySelector('#verdict');
        el.className = 'verdict ' + (lostBefore ? 'no' : 'ok');
        el.textContent = lostBefore
          ? 'The tab closed inside the 300ms window. The debounced column has just lost the last change — ' +
            'which is what `addEventListener("pagehide", flush)` is for, and it is one line.'
          : 'Nothing was pending, so nothing was lost. Type a character and press this again.';
      });

      document.querySelector('#reset').addEventListener('click', () => {
        for (const app of APPS) {
          clearTimeout(app.timer);
          try {
            localStorage.removeItem(app.key);
          } catch {
            /* blocked */
          }
          Object.assign(app, makeApp(app.name, app.mode));
        }
        box.value = '';
        paint();
      });

      addEventListener('pagehide', () => {
        for (const app of APPS) {
          clearTimeout(app.timer);
          try {
            localStorage.removeItem(app.key);
          } catch {
            /* blocked */
          }
        }
      });

      /*
       * THE BOOT WRITE, DONE AND NOT COUNTED.
       *
       * The real application hydrates BEFORE anything is subscribed, so the collection
       * that came off disk is already on disk. Doing the same here means the three
       * counters start at zero and every write they then report was caused by the user
       * — which is the only comparison this page is making.
       *
       * IT HAS TO BE HERE, at the bottom: `write` calls `paint`, `paint` calls `onDisk`,
       * and `onDisk` is a `const`. Running this loop further up put it inside that
       * const's temporal dead zone, the page threw before drawing a single row, and
       * the table was simply empty. Week 7, in the course's own material.
       */
      for (const app of APPS) {
        write(app);
        app.writes = 0;
        app.ms = 0;
      }

      paint();
    </script>
  </body>
</html>
