<!doctype html>
<!--
  ============================================================================
  summary.html — the third page. GIVEN AND COMPLETE. You do not edit this file.

  IT HOLDS NO DATA OF ITS OWN, and today that stops being a slogan.

  It is drawn by the same `render(state)` the list page is drawn by, from the same
  object — and as of this week, from the same saved object. Add three items on the list
  page, come here, and reload: the numbers are right, and nothing on this page knows
  that anything was ever written to disk.

  The three mounts render() writes into:

      #summary-count    how many items exist
      #summary-extra    your second measure
      #summary-shelves  one row per category, with its count — DERIVED, so a category
                        with nothing left in it disappears without anybody saying so
  ============================================================================
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>המזווה — סיכום</title>

    <script src="vendor/tailwind.js"></script>
    <style type="text/tailwindcss">
      /* GIVEN, AND IT WORKS AS IT IS. The token layer from week 5. */
      @theme static {
        --color-ink: oklch(0.22 0.02 260);
        --color-muted: oklch(0.42 0.02 260);
        --color-line: oklch(0.85 0.01 260);
        --color-page: oklch(0.99 0 0);
        --color-panel: oklch(0.97 0.005 260);
        --color-brand: oklch(0.45 0.17 275);
        --color-brand-ink: oklch(0.98 0 0);
        --color-bad: oklch(0.48 0.19 25);
      }
    </style>

    <!-- The same entry point as the other two pages. There is no per-page script. -->
    <script type="module" src="js/app.js"></script>
  </head>

  <body class="bg-page text-ink font-sans">
    <a
      href="#main"
      class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:right-2 focus:z-10 focus:rounded-md focus:bg-brand focus:px-4 focus:py-2 focus:text-brand-ink"
      >דלג לתוכן</a
    >

    <header class="border-b border-line">
      <nav class="mx-auto flex max-w-5xl flex-wrap items-center gap-6 px-4 py-4" aria-label="ראשי">
        <span class="font-bold">המזווה</span>
        <a href="index.html" class="hover:text-brand">הרשימה</a>
        <a href="item.html" class="hover:text-brand">פריט</a>
        <a href="summary.html" aria-current="page" class="text-brand underline underline-offset-4"
          >סיכום</a
        >
      </nav>
    </header>

    <main id="main" tabindex="-1" class="mx-auto max-w-5xl px-4 py-8">
      <h1 class="text-2xl font-bold">סיכום המזווה</h1>
      <p class="mt-2 text-muted">כמה פריטים יש, ואיך הם מתחלקים בין המדפים.</p>

      <dl class="mt-6 grid gap-3 rounded-lg border border-line bg-panel p-4 sm:grid-cols-2">
        <div>
          <dt class="text-sm text-muted">מספר פריטים</dt>
          <dd id="summary-count" class="text-2xl font-bold">0</dd>
        </div>
        <div>
          <dt class="text-sm text-muted">סך הכמויות</dt>
          <dd id="summary-extra" class="text-2xl font-bold">0</dd>
        </div>
      </dl>

      <h2 class="mt-8 text-lg font-bold">לפי מדף</h2>
      <!-- THE MOUNT for part ג. It ships empty, exactly like #list. -->
      <ul id="summary-shelves" class="mt-3 grid gap-2"></ul>

      <p class="mt-6">
        <a href="index.html" class="text-brand underline underline-offset-4">חזרה לרשימה</a>
      </p>
    </main>
  </body>
</html>
