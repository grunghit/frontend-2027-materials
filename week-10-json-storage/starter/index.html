<!doctype html>
<!--
  ============================================================================
  index.html — the list page. GIVEN AND COMPLETE. You do not edit this file.

  ── WHY IT IS GIVEN AGAIN THIS WEEK
  The markup is a fixed point. Everything you write today is JavaScript, and the way
  you will know that persistence works is that a page you did not touch shows the same
  thing after a reload as it did before one. If the markup were also moving you would
  have nothing to measure against.

  Four things are new since week 9, and all four are wired to nothing:

      button.edit      one per row, built by render(). The U of CRUD.
      #form-cancel     leaves edit mode. Hidden while the form is adding.
      #clear-all       deletes every item. The one destructive control on the page.
      #storage-note    where the application says that a write FAILED. Empty and
                       hidden when everything is fine, which is almost always.

  ── THE CONTRACT (week 9's, plus the four above)
  The ids and class names below are FIXED, because the grader and your own CI both
  look for them. Everything else — the words, the colours, the entity — is yours.

      #item-form      the add/edit form. ONE form for both, because they ask for the
                      same fields; what changes is what happens on submit.
      #field-title    the text field (your entity's name)
      #field-number   the numeric field
      #field-category the shelf field
      #form-submit    the submit button. Its LABEL is drawn from state
      #form-cancel    leaves edit mode without saving
      #form-mode      a sentence naming what is being edited, or empty
      #form-error     where a failed submit says what went wrong
      #query #category #sort   the three view controls
      #list           THE MOUNT. Emptied and refilled by render()
      #count          how many items are ON SCREEN
      #empty          the empty state, shown only when there is nothing to show
      #reset-demo     inside #empty: the offer to restore the demo data
      #clear-all      delete everything, with a confirmation
      #storage-note   a sentence when a write failed

  Each row that render() builds must be
      <li data-id="…">  … <span class="item-title">…</span> …
                        <button class="plus">…</button>
                        <button class="edit">…</button>
                        <button class="remove">…</button> </li>

  `data-id`, and never `data-index` — and this week it earns its keep twice more: it
  is what the edit button carries, and it is the one part of a row that means the same
  thing tomorrow morning. An array position does not survive a sort, let alone a
  reload. This is graded.
  ============================================================================
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>המזווה — הרשימה</title>

    <script src="vendor/tailwind.js"></script>
    <style type="text/tailwindcss">
      /* GIVEN, AND IT WORKS AS IT IS. The token layer from week 5. */
      @theme static {
        --color-ink: oklch(0.22 0.02 260);
        --color-muted: oklch(0.42 0.02 260);
        --color-line: oklch(0.85 0.01 260);
        --color-page: oklch(0.99 0 0);
        --color-panel: oklch(0.97 0.005 260);
        --color-brand: oklch(0.45 0.17 275);
        --color-brand-ink: oklch(0.98 0 0);
        --color-bad: oklch(0.48 0.19 25);
      }
    </style>

    <!-- ONE ENTRY POINT, for all three pages. It is a module, and therefore deferred:
         it runs after the markup exists, which is why there is no DOMContentLoaded
         anywhere in this assignment. -->
    <script type="module" src="js/app.js"></script>
  </head>

  <body class="bg-page text-ink font-sans">
    <a
      href="#main"
      class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:right-2 focus:z-10 focus:rounded-md focus:bg-brand focus:px-4 focus:py-2 focus:text-brand-ink"
      >דלג לתוכן</a
    >

    <header class="border-b border-line">
      <nav class="mx-auto flex max-w-5xl flex-wrap items-center gap-6 px-4 py-4" aria-label="ראשי">
        <span class="font-bold">המזווה</span>
        <a href="index.html" aria-current="page" class="text-brand underline underline-offset-4"
          >הרשימה</a
        >
        <a href="item.html" class="hover:text-brand">פריט</a>
        <a href="summary.html" class="hover:text-brand">סיכום</a>
      </nav>
    </header>

    <main id="main" tabindex="-1" class="mx-auto max-w-5xl px-4 py-8">
      <h1 class="text-2xl font-bold">המזווה</h1>

      <!-- A write that failed says so HERE. role="status" so a screen reader hears it
           without focus moving. Hidden until there is something to say — which is not
           the same as absent: an element that exists and is empty is one `hidden`
           away from speaking. -->
      <p
        id="storage-note"
        role="status"
        hidden
        class="mt-4 rounded-lg border-2 border-bad bg-panel p-3 font-semibold text-bad"
      ></p>

      <!-- ONE FORM, TWO JOBS. It adds an item, and it edits one. STATIC, and outside
           #list on purpose: a field that is destroyed while you are typing in it
           loses your text and your focus, and #list is rebuilt on every keystroke. -->
      <form
        id="item-form"
        class="mt-6 flex flex-wrap items-end gap-4 rounded-lg border border-line bg-panel p-4"
      >
        <div>
          <label for="field-title" class="block text-sm text-muted">שם</label>
          <input
            id="field-title"
            name="title"
            type="text"
            autocomplete="off"
            class="mt-1 rounded-md border border-line bg-page px-3 py-2 aria-[invalid=true]:border-2 aria-[invalid=true]:border-bad"
          />
        </div>
        <div>
          <label for="field-number" class="block text-sm text-muted">כמות</label>
          <input
            id="field-number"
            name="number"
            type="number"
            class="mt-1 w-32 rounded-md border border-line bg-page px-3 py-2 aria-[invalid=true]:border-2 aria-[invalid=true]:border-bad"
          />
        </div>
        <div>
          <label for="field-category" class="block text-sm text-muted">מדף</label>
          <input
            id="field-category"
            name="category"
            type="text"
            autocomplete="off"
            class="mt-1 w-32 rounded-md border border-line bg-page px-3 py-2 aria-[invalid=true]:border-2 aria-[invalid=true]:border-bad"
          />
        </div>
        <!-- The LABEL of this button is drawn from state: "הוסף" or "שמור". -->
        <button
          id="form-submit"
          type="submit"
          class="rounded-md bg-brand px-4 py-2 font-semibold text-brand-ink hover:opacity-90 focus-visible:outline-2 focus-visible:outline-offset-2"
        >
          הוסף
        </button>
        <button
          id="form-cancel"
          type="button"
          hidden
          class="rounded-md border border-line px-4 py-2 font-semibold hover:border-brand focus-visible:outline-2 focus-visible:outline-offset-2"
        >
          ביטול
        </button>
        <p id="form-mode" class="basis-full text-sm text-muted"></p>
      </form>

      <!-- role="status" so a screen reader announces a failed submit without moving
           focus away from wherever the user is. Week 6, in code. -->
      <p id="form-error" role="status" class="mt-2 min-h-6 font-semibold text-bad"></p>

      <!-- THE THREE VIEW CONTROLS. They change what you SEE. They never change what
           exists — and, as of this week, they never change what is SAVED either. -->
      <div class="mt-6 flex flex-wrap items-end gap-4 rounded-lg border border-line p-4">
        <div>
          <label for="query" class="block text-sm text-muted">חיפוש</label>
          <input
            id="query"
            type="search"
            autocomplete="off"
            class="mt-1 rounded-md border border-line bg-page px-3 py-2"
          />
        </div>
        <div>
          <label for="category" class="block text-sm text-muted">מדף</label>
          <!-- Only the "all" option is written here. Every other <option> is derived
               from the collection at render time. -->
          <select id="category" class="mt-1 rounded-md border border-line bg-page px-3 py-2">
            <option value="all">הכול</option>
          </select>
        </div>
        <div>
          <label for="sort" class="block text-sm text-muted">מיון</label>
          <select id="sort" class="mt-1 rounded-md border border-line bg-page px-3 py-2">
            <option value="title">לפי שם</option>
            <option value="number">לפי כמות</option>
          </select>
        </div>
      </div>

      <div class="mt-4 flex flex-wrap items-center justify-between gap-4">
        <p class="text-muted">מוצג: <span id="count">0</span></p>
        <!-- The one destructive control on the page, and therefore the only one that
             asks first. -->
        <button
          id="clear-all"
          type="button"
          class="rounded-md border border-line px-3 py-1 text-sm hover:border-bad hover:text-bad focus-visible:outline-2 focus-visible:outline-offset-2"
        >
          נקה הכול
        </button>
      </div>

      <!-- THE MOUNT. It ships empty. render() fills it. -->
      <ul id="list" class="mt-4 grid gap-3"></ul>

      <p id="empty" hidden class="mt-4 rounded-lg border border-line bg-panel p-6 text-muted">
        <span>אין כאן כלום. הוסף פריט בטופס שלמעלה.</span>
        <!-- Inside #empty, which render() hides and shows but never replaces — so a
             listener on this button survives every redraw. -->
        <button
          id="reset-demo"
          type="button"
          hidden
          class="mt-3 block rounded-md border border-line px-3 py-1 text-sm hover:border-brand focus-visible:outline-2 focus-visible:outline-offset-2"
        >
          שחזר את נתוני הדוגמה
        </button>
      </p>
    </main>
  </body>
</html>
