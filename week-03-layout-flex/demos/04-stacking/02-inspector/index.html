<!doctype html>
<!--
  The stacking-context inspector. Week-3 deck, act 3.

  Same idea as week 2's cascade inspector: the rule is not explained on a slide, it is run
  against the real page in front of the room.

  Click any coloured box. The panel walks from that element up to <html>, and for each
  ancestor says whether it establishes a stacking context AND WHY — reading the live
  computed style, not a hard-coded list. The nearest one that does is the box your z-index
  is actually being compared inside.

  The tree below is deliberately nasty: three nested wrappers, two of which create a
  context for reasons that have nothing to do with layering, and z-index values that look
  like they should settle the argument and do not.

  DEMO MOVE: click the box labelled 9999 and read its chain out loud. Then click 5, whose
  chain is shorter, and ask which of the two is painted on top. The answer is 5, and the
  reason is three lines up the chain from either of them.

  The paint-order line at the bottom is the browser's own answer: it is read with
  elementFromPoint, so it cannot disagree with what is on screen.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stacking-context inspector</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* Furniture only — week 4. */
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
        gap: 16px;
        align-items: start;
      }
      @media (max-width: 720px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      .stage {
        position: relative;
        height: 260px;
        border: 2px dashed #94a3b8;
        border-radius: 10px;
        background: #f8fafc;
      }

      /* Three wrappers. Two of them create a context, for reasons that look cosmetic. */
      .wrap-a {
        position: absolute;
        inset-block-start: 12px;
        inset-inline-start: 12px;
        width: 260px;
        height: 150px;
        z-index: 5;
        padding: 8px;
        border: 2px solid #7c3aed;
        border-radius: 8px;
        background: rgb(237 233 254 / 70%);
      }
      .wrap-b {
        position: absolute;
        inset-block-start: 70px;
        inset-inline-start: 90px;
        width: 260px;
        height: 150px;
        z-index: 2;
        opacity: 0.99; /* ← creates a context. Looks like nothing. */
        padding: 8px;
        border: 2px solid #0891b2;
        border-radius: 8px;
        background: rgb(207 250 254 / 70%);
      }
      .wrap-c {
        position: absolute;
        inset-block-start: 130px;
        inset-inline-start: 30px;
        width: 300px;
        height: 100px;
        transform: translateY(0); /* ← creates a context. Looks like nothing. */
        padding: 8px;
        border: 2px solid #ca8a04;
        border-radius: 8px;
        background: rgb(254 249 195 / 80%);
      }

      .chip {
        position: absolute;
        inset-block-start: 40px;
        inset-inline-start: 20px;
        padding: 8px 12px;
        border: 2px solid #0f172a;
        border-radius: 8px;
        background: #fff;
        font: 700 13px/1.3 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        cursor: pointer;
      }
      .chip:focus-visible {
        outline: 3px solid #b45309;
        outline-offset: 2px;
      }
      .chip.selected {
        box-shadow: 0 0 0 3px #b45309;
      }
      .label {
        position: absolute;
        inset-block-start: 4px;
        inset-inline-start: 8px;
        font: 700 11px/1.4 ui-monospace, Menlo, monospace;
        color: #334155;
        letter-spacing: 0.04em;
      }

      .panel {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f1f5f9;
        font: 13px/1.65 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        white-space: pre-wrap;
        min-height: 260px;
      }
      .hint {
        margin: 8px 0 0;
        font-size: 13px;
        color: var(--muted);
      }
    </style>
  </head>

  <body>
    <h2>Click a box. The panel walks its ancestors and names the one that traps it.</h2>

    <div class="layout">
      <div class="stage" id="stage">
        <div class="wrap-a">
          <span class="label">.wrap-a — position + z-index: 5</span>
          <button class="chip" id="chip-a" type="button">z-index: 9999</button>
        </div>
        <div class="wrap-b">
          <span class="label">.wrap-b — z-index: 2, opacity: .99</span>
          <button class="chip" id="chip-b" type="button">z-index: 3</button>
        </div>
        <div class="wrap-c">
          <span class="label">.wrap-c — transform, no z-index</span>
          <button class="chip" id="chip-c" type="button">z-index: 100</button>
        </div>
      </div>

      <div>
        <p class="panel" id="out" aria-live="polite"></p>
        <p class="hint">
          Every line is read from <code>getComputedStyle</code> at the moment you click.
        </p>
      </div>
    </div>

    <script>
      const out = document.getElementById('out');
      const chips = [...document.querySelectorAll('.chip')];

      /* Set the z-index the label promises, so markup and behaviour cannot drift apart. */
      const Z = { 'chip-a': 9999, 'chip-b': 3, 'chip-c': 100 };
      for (const chip of chips) chip.style.zIndex = Z[chip.id];

      /* The real rules for establishing a stacking context, limited to what can occur
         here. Returns the reasons — plural, because more than one can apply. */
      function contextReasons(el) {
        const style = getComputedStyle(el);
        const reasons = [];
        if (el === document.documentElement) reasons.push('root element');
        if (style.position !== 'static' && style.zIndex !== 'auto') {
          reasons.push('position: ' + style.position + ' + z-index: ' + style.zIndex);
        }
        if (style.position === 'fixed' || style.position === 'sticky') {
          reasons.push('position: ' + style.position + ' (always, z-index or not)');
        }
        if (parseFloat(style.opacity) < 1) reasons.push('opacity: ' + style.opacity);
        if (style.transform !== 'none') reasons.push('transform: ' + style.transform);
        if (style.filter !== 'none') reasons.push('filter: ' + style.filter);
        if (style.isolation === 'isolate') reasons.push('isolation: isolate');
        if (style.mixBlendMode !== 'normal') reasons.push('mix-blend-mode: ' + style.mixBlendMode);
        if (style.willChange !== 'auto') reasons.push('will-change: ' + style.willChange);
        return reasons;
      }

      const name = (el) => {
        if (el === document.documentElement) return '<html>';
        if (el === document.body) return '<body>';
        const cls = el.className && typeof el.className === 'string' ? el.className.split(' ')[0] : '';
        return '<' + el.tagName.toLowerCase() + (el.id ? '#' + el.id : cls ? '.' + cls : '') + '>';
      };

      function inspect(chip) {
        for (const c of chips) c.classList.toggle('selected', c === chip);

        const lines = [];
        let node = chip.parentElement;
        let trap = null;

        while (node) {
          const reasons = contextReasons(node);
          const creates = reasons.length > 0;
          if (creates && !trap) trap = { node, reasons };
          lines.push(
            '  ' +
              name(node).padEnd(12, ' ') +
              (creates ? '  ●  ' + reasons.join(' · ') : '  ·  no context'),
          );
          node = node.parentElement;
        }

        /* Ask the browser which element is actually painted on top where the three
           boxes overlap. This is the answer, not a deduction from the numbers. */
        const stage = document.getElementById('stage').getBoundingClientRect();
        const probe = document.elementFromPoint(
          Math.round(stage.left + 150),
          Math.round(stage.top + 150),
        );

        out.textContent =
          chip.textContent +
          '  —  inside ' +
          name(chip.parentElement) +
          '\n\n' +
          '  walking up from the box:\n\n' +
          lines.join('\n') +
          '\n\n' +
          (trap
            ? '  Nearest context: ' +
              name(trap.node) +
              '\n' +
              '  Reason: ' +
              trap.reasons[0] +
              '\n\n' +
              '  So ' +
              chip.textContent +
              ' is only compared with the other children of\n' +
              '  ' +
              name(trap.node) +
              '. Against anything outside it, what competes is\n' +
              '  ' +
              name(trap.node) +
              "'s own z-index — not this number.\n\n" +
              '  Painted on top where all three overlap: ' +
              name(probe)
            : '  No ancestor creates a context, so this z-index competes globally.');
      }

      for (const chip of chips) {
        chip.addEventListener('click', () => inspect(chip));
      }
      inspect(chips[0]);
    </script>
  </body>
</html>
