<!doctype html>
<!--
  Four ways to make something disappear, and they are not the same. Week-3 deck, act 2.

  display: none · visibility: hidden · opacity: 0 · the hidden attribute

  Students reach for whichever one they saw first and then meet a bug that has nothing to
  do with looks: an "invisible" button that is still in the tab order, or a message the
  screen reader announces to a user who cannot see it. The table below measures all four
  on the same element, on three axes that actually differ:

    · does it still take up space?      measured from getBoundingClientRect()
    · can you still Tab to it?          measured by focusing it and reading activeElement
    · is it still in the a11y tree?     inferred from the rules the browser applies

  DEMO MOVE: pick `visibility: hidden`, then press Tab in the frame. The focus ring is
  gone but the counter still moves — you are typing into something nobody can see. Then
  pick `opacity: 0` and notice the box is STILL CLICKABLE. Only `display: none` and the
  `hidden` attribute remove it from everything.

  The rule to leave them with: if it should be gone, use display:none or hidden. Use
  visibility and opacity only when you want to keep the SPACE it occupies.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>display:none vs visibility vs opacity vs hidden</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      button {
        font: inherit;
        padding: 6px 12px;
        border: 1px solid #7a8699;
        border-radius: 999px;
        background: #fff;
        color: inherit;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: #1d4ed8;
        border-color: #1d4ed8;
        color: #fff;
      }
      :focus-visible {
        outline: 3px solid #b45309;
        outline-offset: 2px;
      }

      .rail {
        padding: 10px;
        border: 2px dashed #94a3b8;
        border-radius: 8px;
        background: #fff;
      }
      .rail p {
        margin: 0;
      }
      #target {
        margin: 8px 0;
        padding: 12px;
        border: 2px solid #1d4ed8;
        border-radius: 8px;
        background: #dbeafe;
        color: #1e3a8a;
        font-weight: 700;
        font: inherit;
        cursor: pointer;
      }

      /* The four ways, one class each. */
      #target.is-none {
        display: none;
      }
      #target.is-visibility {
        visibility: hidden;
      }
      #target.is-opacity {
        opacity: 0;
      }

      table {
        margin-top: 12px;
        border-collapse: collapse;
        font-size: 13px;
        width: 100%;
      }
      th,
      td {
        padding: 5px 8px;
        border: 1px solid var(--line);
        text-align: left;
      }
      th {
        background: #f1f5f9;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      tr[aria-selected='true'] td {
        background: #fef9c3;
        font-weight: 700;
      }
      .yes {
        color: #b91c1c;
      }
      .no {
        color: #15803d;
      }
      .readout {
        margin: 12px 0 0;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f1f5f9;
        font: 13px/1.7 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>

  <body>
    <div class="controls" id="controls"></div>

    <h2>Press Tab inside this box, then click the button you cannot see</h2>
    <div class="rail">
      <p>Text above.</p>
      <button id="target" type="button">I have been clicked 0 times</button>
      <p>Text below.</p>
    </div>

    <table>
      <thead>
        <tr>
          <th>method</th>
          <th>takes up space</th>
          <th>reachable by Tab</th>
          <th>read by a screen reader</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <p class="readout" id="out" aria-live="polite"></p>

    <script>
      const target = document.getElementById('target');
      const controls = document.getElementById('controls');
      const rows = document.getElementById('rows');
      const out = document.getElementById('out');

      let clicks = 0;
      target.addEventListener('click', () => {
        clicks += 1;
        target.textContent = 'I have been clicked ' + clicks + ' times';
      });

      const MODES = [
        {
          id: 'visible',
          label: 'visible',
          apply: () => {},
          space: true,
          tab: true,
          sr: true,
          note: 'The starting point. Everything works.',
        },
        {
          id: 'none',
          label: 'display: none',
          apply: () => target.classList.add('is-none'),
          space: false,
          tab: false,
          sr: false,
          note:
            'Gone from the layout, gone from the tab order, gone from the accessibility\n' +
            'tree. The text above and below closed the gap. This is the honest "gone".',
        },
        {
          id: 'visibility',
          label: 'visibility: hidden',
          apply: () => target.classList.add('is-visibility'),
          space: true,
          tab: false,
          sr: false,
          note:
            'Invisible, but the box still occupies its space — look at the gap between\n' +
            'the two paragraphs. Use this when you need the layout to stay still.',
        },
        {
          id: 'opacity',
          label: 'opacity: 0',
          apply: () => target.classList.add('is-opacity'),
          space: true,
          tab: true,
          sr: true,
          note:
            'THE DANGEROUS ONE. It is only transparent: it still takes space, it is still\n' +
            'in the tab order, a screen reader still announces it, and it is still\n' +
            'clickable. Click where it should be and watch the counter move.',
        },
        {
          id: 'hidden',
          label: 'the hidden attribute',
          apply: () => target.setAttribute('hidden', ''),
          space: false,
          tab: false,
          sr: false,
          note:
            'Markup rather than CSS: the browser applies display:none for you. It says\n' +
            '"this is not relevant right now" in the document itself, so it survives a\n' +
            'missing stylesheet — which display:none does not.',
        },
      ];

      const mark = (value) =>
        '<span class="' + (value ? 'yes' : 'no') + '">' + (value ? 'yes' : 'no') + '</span>';

      for (const mode of MODES) {
        const row = document.createElement('tr');
        row.dataset.id = mode.id;
        row.innerHTML =
          '<td><code>' +
          mode.label +
          '</code></td><td>' +
          mark(mode.space) +
          '</td><td>' +
          mark(mode.tab) +
          '</td><td>' +
          mark(mode.sr) +
          '</td>';
        rows.append(row);

        const button = document.createElement('button');
        button.textContent = mode.label;
        button.dataset.id = mode.id;
        button.addEventListener('click', () => apply(mode));
        controls.append(button);
      }

      function apply(mode) {
        target.className = '';
        target.removeAttribute('hidden');
        mode.apply();

        for (const button of controls.children) {
          button.setAttribute('aria-pressed', String(button.dataset.id === mode.id));
        }
        for (const row of rows.children) {
          row.setAttribute('aria-selected', String(row.dataset.id === mode.id));
        }

        /* Measured, not asserted: focus it and see whether the browser accepted. */
        target.focus();
        const focusable = document.activeElement === target;
        target.blur();
        const rect = target.getBoundingClientRect();

        out.textContent =
          mode.label +
          '\n\n' +
          '  box on the page   ' +
          Math.round(rect.width) +
          ' × ' +
          Math.round(rect.height) +
          '\n' +
          '  accepts focus     ' +
          (focusable ? 'yes' : 'no') +
          '\n\n' +
          mode.note;
      }

      apply(MODES[0]);
    </script>
  </body>
</html>
