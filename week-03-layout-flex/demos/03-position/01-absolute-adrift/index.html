<!doctype html>
<!--
  MISCONCEPTION 1 — absolute positioning with no positioned ancestor.
  Embedded in the week-3 deck (act 3).

  A "NEW" badge is supposed to sit in the corner of the middle card. It is written the way
  everyone writes it:  .badge { position: absolute; top: -10px; right: -10px; }  and it is
  correct. It still flies to the corner of the PAGE, because absolute positioning is
  relative to the nearest POSITIONED ancestor, and nothing in the chain is positioned.

  The fix is one declaration on the card — `position: relative` — which moves nothing and
  changes everything.

  This is the legacy course's own diagnostic, and it is the best line in the old deck:
  "If it aligns to the page instead of the box you expected, you probably forgot
  position: relative on the ancestor." (Lesson 4.) Say it out loud.

  DEMO MOVE: start broken. Ask where the badge is and why. Someone will say "top: -10px
  means 10px above the card" — that is exactly the belief to break. Turn on the ancestor
  chain: every ancestor is `static`, so the browser walked all the way up to the initial
  containing block. Then flip the one switch.

  The ancestor chain is walked live with getComputedStyle — it is not a picture of a chain.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Absolute, with nothing to be absolute to</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--ink);
        background: #fff;
        /* The page itself must be able to show the badge escaping to its corner. */
        min-height: 320px;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        margin-bottom: 12px;
      }
      .controls label {
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .controls input {
        accent-color: #1d4ed8;
        margin-right: 4px;
      }
      input:focus-visible {
        outline: 3px solid #b45309;
        outline-offset: 2px;
      }

      /* Stands in for "the page". It is `position: relative` so that a badge with
         nothing else to hold on to lands on ITS corner rather than the browser
         viewport's — which is what keeps this demo self-contained inside an iframe,
         and stops a -10px offset giving the whole page a scrollbar. The lesson is
         unchanged: the badge ends up on the page instead of on the card. */
      .page-root {
        position: relative;
        padding: 26px 14px 14px;
        border: 2px solid #cbd5e1;
        border-radius: 12px;
      }
      .page-label {
        position: absolute;
        inset-block-start: 5px;
        inset-inline-start: 10px;
        font: 700 11px/1.4 ui-monospace, Menlo, monospace;
        letter-spacing: 0.06em;
        /* --muted, not a lighter grey: this is real text and it has to clear 4.5:1. */
        color: var(--muted);
      }

      .row {
        display: flex;
        gap: 12px;
      }
      .card {
        flex: 1;
        padding: 16px 12px;
        border: 2px solid var(--line);
        border-radius: 10px;
        background: #f8fafc;
        text-align: center;
        font-weight: 700;
        color: var(--muted);
      }

      /* The one declaration that is the whole lesson. */
      .card.anchored {
        position: relative;
      }

      .badge {
        position: absolute;
        inset-block-start: -10px;
        inset-inline-end: -10px;
        padding: 3px 10px;
        border-radius: 999px;
        background: #b91c1c;
        color: #fff;
        font: 700 12px/1.6 system-ui, sans-serif;
        letter-spacing: 0.04em;
      }

      /* Ancestor highlighting, painted with outline so it cannot move anything. */
      .show-chain .chain-static {
        outline: 2px dashed #b45309;
        outline-offset: 2px;
      }
      .show-chain .chain-positioned {
        outline: 3px solid #15803d;
        outline-offset: 2px;
      }

      .readout {
        margin: 12px 0 0;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f1f5f9;
        font: 13px/1.7 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }
      .verdict {
        margin: 10px 0 0;
        padding: 8px 12px;
        border-radius: 8px;
        border: 2px solid #b91c1c;
        background: #fef2f2;
        font-weight: 700;
        font-size: 14px;
      }
      .verdict.ok {
        border-color: #15803d;
        background: #dcfce7;
      }
    </style>
  </head>

  <body>
    <div class="controls">
      <label>
        <input type="checkbox" id="fix" />
        <code>position: relative</code> on the middle card
      </label>
      <label><input type="checkbox" id="chain" />show the ancestor chain</label>
    </div>

    <h2>The badge belongs to the middle card</h2>
    <div class="page-root">
      <span class="page-label">the page</span>
      <div class="row" id="row">
        <div class="card">one</div>
        <div class="card" id="card">
          two
          <span class="badge" id="badge">NEW</span>
        </div>
        <div class="card">three</div>
      </div>
    </div>

    <p class="verdict" id="verdict"></p>
    <p class="readout" id="out" aria-live="polite"></p>

    <script>
      const card = document.getElementById('card');
      const badge = document.getElementById('badge');
      const fix = document.getElementById('fix');
      const chain = document.getElementById('chain');
      const out = document.getElementById('out');
      const verdict = document.getElementById('verdict');

      /* Walk from the badge to the root and record what each ancestor's position is.
         This is the algorithm the browser runs, written out. */
      function walk() {
        const steps = [];
        let node = badge.parentElement;
        while (node) {
          const position = getComputedStyle(node).position;
          steps.push({ node, position, positioned: position !== 'static' });
          node = node.parentElement;
        }
        return steps;
      }

      function render() {
        card.classList.toggle('anchored', fix.checked);
        document.body.classList.toggle('show-chain', chain.checked);

        const steps = walk();
        for (const step of steps) {
          step.node.classList.remove('chain-static', 'chain-positioned');
        }

        /* The FIRST positioned ancestor wins. Everything above it is irrelevant. */
        const winner = steps.find((s) => s.positioned) ?? null;
        for (const step of steps) {
          if (winner && step === winner) step.node.classList.add('chain-positioned');
          else if (!winner || steps.indexOf(step) < steps.indexOf(winner)) {
            step.node.classList.add('chain-static');
          }
        }

        const lines = steps.map((s) => {
          const name =
            '<' +
            s.node.tagName.toLowerCase() +
            (s.node.id ? '#' + s.node.id : s.node.className ? '.' + s.node.className.split(' ')[0] : '') +
            '>';
          const mark = winner && s === winner ? '  ← this one anchors the badge' : '';
          return '    ' + name.padEnd(22, ' ') + s.position + mark;
        });

        const badgeBox = badge.getBoundingClientRect();
        const cardBox = card.getBoundingClientRect();
        const near =
          Math.abs(badgeBox.right - cardBox.right) < 40 && Math.abs(badgeBox.top - cardBox.top) < 40;

        verdict.className = near ? 'verdict ok' : 'verdict';
        verdict.textContent = near
          ? 'The badge is on the card, where it was meant to be.'
          : 'The badge landed ' +
            Math.abs(Math.round(badgeBox.right - cardBox.right)) +
            'px away from the card it belongs to.';

        out.textContent =
          '  .badge { position: absolute; top: -10px; right: -10px; }\n' +
          '  — unchanged. The badge never moves in this demo.\n\n' +
          '  walking up from the badge, looking for a positioned ancestor:\n\n' +
          lines.join('\n') +
          '\n\n' +
          (winner && winner.node === card
            ? '  The card is positioned now, so it is the first one the walk reaches — and\n' +
              '  the offsets are measured from ITS padding box. That is the whole fix: one\n' +
              '  declaration, on the ancestor, which moves nothing by itself.'
            : '  The walk went straight past the card — it is `static`, so it does not\n' +
              '  count — and stopped at the page. The offsets are measured from THERE.\n\n' +
              '  "If it aligns to the page instead of the box you expected, you probably\n' +
              '   forgot position: relative on the ancestor."');
      }

      for (const control of [fix, chain]) control.addEventListener('change', render);
      addEventListener('resize', render);
      render();
    </script>
  </body>
</html>
