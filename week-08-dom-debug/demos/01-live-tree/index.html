<!doctype html>
<!--
  The DOM is not the HTML file. Week-8 deck, act 2.

  Two panels, both real:

    LEFT   the bytes the server actually sent for THIS page, fetched at load with
           `fetch(location.href)` and printed as text. It never changes.
    RIGHT  a tree walked out of `document.getElementById('stage')` right now —
           element nodes, text nodes and comment nodes, with their attributes.

  Then five buttons mutate the stage. The right panel changes. The left panel does not.

  What makes it teach rather than merely demonstrate:

  1. THE COUNTS ARE COMPUTED, NOT WRITTEN. Node count, element count and text-node
     count come from a real walk of `childNodes`, so "an element is a node but a node
     is not an element" is a number on the screen rather than a sentence.
  2. IT ANSWERS THE QUESTION VIEW-SOURCE ASKS. Students who press Ctrl+U after their
     JavaScript ran and see none of it are not confused about JavaScript; they are
     confused about which of the two things they are looking at. Both are here at once.
  3. WHITESPACE IS A NODE AND THAT IS WHY `firstChild` SURPRISES PEOPLE. The tree
     prints text nodes made only of whitespace in grey, and the readout says what
     `stage.firstChild` and `stage.firstElementChild` each are. They are different.

  DEMO MOVE: press "add a row" three times, then ask the room what Ctrl+U will show.
  Take a vote before pressing it in a real tab.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>The DOM is not the HTML</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
        --accent: #4338ca;
        --code-bg: #0f172a;
        --code-fg: #e2e8f0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
        align-items: center;
      }
      button {
        font: inherit;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 7px;
        padding: 5px 11px;
        cursor: pointer;
        color: inherit;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      button:focus-visible {
        outline: 3px solid #f59e0b;
        outline-offset: 2px;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 14px;
        align-items: start;
      }
      @media (max-width: 820px) {
        .layout {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .panel {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #f8fafc;
        padding: 11px 12px;
      }
      .panel h3 {
        margin: 0 0 8px;
        font-size: 12px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--muted);
      }
      pre {
        margin: 0;
        background: var(--code-bg);
        color: var(--code-fg);
        border-radius: 9px;
        padding: 10px 12px;
        overflow: auto;
        max-height: 260px;
        font:
          12.5px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .tree {
        font:
          12.5px/1.7 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        max-height: 260px;
        overflow: auto;
      }
      .tree div {
        white-space: pre;
      }
      .tree .el {
        color: #1d4ed8;
      }
      .tree .attr {
        color: #7c2d12;
      }
      .tree .txt {
        color: #0f766e;
      }
      /* De-emphasised, but still 5.8:1 against the panel. The first colour tried here
         was #94a3b8, which reads as "quieter" and measures 2.45:1 — axe caught it. A
         whitespace node is the answer to a real question, so it has to be readable;
         italics carry the de-emphasis instead. */
      .tree .ws {
        color: #57637a;
        font-style: italic;
      }
      .tree .cm {
        color: #a16207;
      }
      .counts {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 10px;
        padding-top: 9px;
        border-top: 1px solid var(--line);
        font-size: 13px;
      }
      .counts b {
        font:
          600 15px/1 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        display: block;
      }
      #stage {
        border: 2px dashed var(--line);
        border-radius: 9px;
        padding: 10px 12px;
        margin-bottom: 12px;
      }
      #stage h4 {
        margin: 0 0 6px;
        font-size: 15px;
      }
      #stage ul {
        margin: 0;
        padding-inline-start: 20px;
      }
      #stage li.hot {
        background: #fef3c7;
      }
      .say {
        margin: 11px 0 0;
        padding: 9px 11px;
        border-radius: 9px;
        background: #eef2ff;
        border: 1px solid #c7d2fe;
        font-size: 13px;
      }
      .say code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <h2>What the server sent · what the document is now</h2>

    <!-- The subject. Everything below reads and rewrites exactly this element. -->
    <div id="stage">
      <h4>Reading list</h4>
      <ul id="rows">
        <li>Eloquent JavaScript</li>
      </ul>
    </div>

    <div class="bar">
      <button type="button" id="add" class="primary">add a row</button>
      <button type="button" id="attr">set an attribute</button>
      <button type="button" id="text">change the heading text</button>
      <button type="button" id="comment">insert a comment node</button>
      <button type="button" id="reset">reset</button>
    </div>

    <div class="layout">
      <div class="panel">
        <h3>The file, as served (fetched once, never re-read)</h3>
        <pre id="source">reading…</pre>
      </div>

      <div class="panel">
        <h3>The tree, right now</h3>
        <div class="tree" id="tree"></div>
        <div class="counts">
          <span>nodes<b id="c-nodes">0</b></span>
          <span>elements<b id="c-els">0</b></span>
          <span>text nodes<b id="c-text">0</b></span>
          <span>of them whitespace only<b id="c-ws">0</b></span>
        </div>
        <p class="say" id="say"></p>
      </div>
    </div>

    <script>
      const stage = document.getElementById('stage');
      /* Re-queried rather than captured. `reset` replaces the stage's children, so a
         reference taken at load points at a detached element afterwards — which is the
         week's own misconception, and it is not going to be in this file by accident. */
      const rows = () => document.getElementById('rows');
      const tree = document.getElementById('tree');
      const say = document.getElementById('say');
      const ORIGINAL = stage.innerHTML;

      const TITLES = [
        'You Do not Know JS',
        'Refactoring',
        'The Pragmatic Programmer',
        'Working Effectively with Legacy Code',
      ];
      let added = 0;

      /*
        The source panel. `fetch(location.href)` asks the server for this page again and
        prints what comes back — which is the file on disk, not the document in memory.
        Only the <div id="stage"> block is shown, because that is the part being mutated
        and 200 lines of stylesheet would bury the point.
      */
      fetch(location.href)
        .then((r) => r.text())
        .then((src) => {
          const start = src.indexOf('<div id="stage">');
          const end = src.indexOf('</div>', src.indexOf('</ul>')) + 6;
          document.getElementById('source').textContent =
            start === -1 ? src.slice(0, 900) : src.slice(start, end);
        })
        .catch(() => {
          document.getElementById('source').textContent =
            'Could not re-read the file. Open this demo through a server (Live Server), not by double-clicking it.';
        });

      const esc = (s) =>
        s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);

      /* A real walk. Nothing here is a hand-written picture of the tree. */
      function walk(node, depth, out, counts) {
        const pad = '  '.repeat(depth);
        counts.nodes += 1;

        if (node.nodeType === Node.ELEMENT_NODE) {
          counts.els += 1;
          const attrs = [...node.attributes]
            .map((a) => ` <span class="attr">${esc(a.name)}="${esc(a.value)}"</span>`)
            .join('');
          out.push(
            `<div>${pad}<span class="el">&lt;${node.tagName.toLowerCase()}&gt;</span>${attrs}</div>`,
          );
          for (const child of node.childNodes) walk(child, depth + 1, out, counts);
          return;
        }

        if (node.nodeType === Node.TEXT_NODE) {
          counts.text += 1;
          const blank = node.data.trim() === '';
          if (blank) counts.ws += 1;
          const shown = blank ? '·whitespace·' : `"${esc(node.data.trim())}"`;
          out.push(`<div>${pad}<span class="${blank ? 'ws' : 'txt'}">#text ${shown}</span></div>`);
          return;
        }

        if (node.nodeType === Node.COMMENT_NODE) {
          out.push(
            `<div>${pad}<span class="cm">&lt;!-- ${esc(node.data.trim())} --&gt;</span></div>`,
          );
        }
      }

      function draw() {
        const out = [];
        const counts = { nodes: 0, els: 0, text: 0, ws: 0 };
        walk(stage, 0, out, counts);
        tree.innerHTML = out.join('');
        document.getElementById('c-nodes').textContent = counts.nodes;
        document.getElementById('c-els').textContent = counts.els;
        document.getElementById('c-text').textContent = counts.text;
        document.getElementById('c-ws').textContent = counts.ws;

        /* The two properties that are not the same thing, answered from the live tree. */
        const first = stage.firstChild;
        const firstEl = stage.firstElementChild;
        const name = (n) =>
          !n
            ? 'null'
            : n.nodeType === Node.ELEMENT_NODE
              ? `<${n.tagName.toLowerCase()}>`
              : n.nodeType === Node.TEXT_NODE
                ? n.data.trim() === ''
                  ? '#text (whitespace)'
                  : '#text'
                : '#comment';
        say.innerHTML =
          `<code>stage.firstChild</code> is <b>${esc(name(first))}</b> · ` +
          `<code>stage.firstElementChild</code> is <b>${esc(name(firstEl))}</b>. ` +
          'The indentation in the file is a text node, and it is why the first one surprises people.';
      }

      document.getElementById('add').addEventListener('click', () => {
        const li = document.createElement('li');
        li.textContent = TITLES[added % TITLES.length];
        li.className = 'hot';
        rows().append(li);
        added += 1;
        draw();
      });

      document.getElementById('attr').addEventListener('click', () => {
        rows().dataset.count = String(rows().children.length);
        draw();
      });

      document.getElementById('text').addEventListener('click', () => {
        const h = stage.querySelector('h4');
        h.textContent =
          h.textContent === 'Reading list' ? 'Books I actually finished' : 'Reading list';
        draw();
      });

      document.getElementById('comment').addEventListener('click', () => {
        rows().before(document.createComment(' inserted from JavaScript '));
        draw();
      });

      document.getElementById('reset').addEventListener('click', () => {
        stage.innerHTML = ORIGINAL;
        added = 0;
        draw();
      });

      draw();
    </script>
  </body>
</html>
