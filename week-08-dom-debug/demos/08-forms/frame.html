<!doctype html>
<!--
  The page inside the iframe of demo 08. It exists so a form can really navigate without
  taking the demo down with it.

  There is no preventDefault here, deliberately. Submitting does what a form has done since
  1995: it serialises the fields into the URL and asks the server for the page again. Two
  things on screen prove it — the load counter (kept in sessionStorage, so it survives the
  navigation) and the query string, which is empty until you press the button.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>A form with no preventDefault</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 12px;
        font:
          14px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: #14181f;
        background: #fff;
      }
      form {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: end;
        margin: 0 0 10px;
      }
      label {
        display: block;
        font-size: 12.5px;
        color: #5c6675;
      }
      input,
      button {
        font: inherit;
        border: 1px solid #cbd5e1;
        background: #fff;
        border-radius: 7px;
        padding: 5px 10px;
        color: inherit;
      }
      button {
        cursor: pointer;
        background: #4338ca;
        border-color: #4338ca;
        color: #fff;
        font-weight: 600;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid #f59e0b;
        outline-offset: 2px;
      }
      dl {
        margin: 0;
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 3px 10px;
        font:
          12.5px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      dt {
        color: #5c6675;
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      #count {
        font-weight: 700;
      }
      .lost {
        color: #b91c1c;
        font-weight: 700;
      }
      p.hint {
        margin: 9px 0 0;
        font-size: 12.5px;
        color: #5c6675;
      }
    </style>
  </head>
  <body>
    <form>
      <div>
        <label for="note">note</label>
        <input id="note" name="note" type="text" placeholder="type something" />
      </div>
      <button type="submit">Save</button>
    </form>

    <dl>
      <dt>this page has loaded</dt>
      <dd><span id="count">1</span> time(s)</dd>
      <dt>location.search</dt>
      <dd id="search">(empty)</dd>
      <dt>the field now holds</dt>
      <dd id="field" class="lost">(empty)</dd>
    </dl>

    <p class="hint">No <code>preventDefault</code> anywhere in this page.</p>

    <script>
      /* sessionStorage survives the navigation; everything the page held in a variable
         does not. That asymmetry is the entire lesson. */
      const n = Number(sessionStorage.getItem('loads') || '0') + 1;
      sessionStorage.setItem('loads', String(n));
      document.getElementById('count').textContent = String(n);

      document.getElementById('search').textContent = location.search || '(empty)';
      const value = document.getElementById('note').value;
      document.getElementById('field').textContent =
        value === '' ? '(empty — what you typed is gone)' : value;
    </script>
  </body>
</html>
