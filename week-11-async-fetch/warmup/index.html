<!doctype html>
<!--
  The warm-up referee. GIVEN. Open it with Live Server and leave it open.

  It imports the five functions from warmup.js and reports, for each of them, what it
  expected and what it got. It never says which line is wrong.

  Nothing here touches the network. All five functions are pure — a value goes in, a
  value comes out — which is exactly what makes a network layer testable at all, and it
  is why `api.js` is a separate file rather than four `fetch` calls inside handlers.

  IT TAKES ABOUT A SECOND AND A HALF TO FINISH, and that is the week: one of the five
  functions is a debounce, and a debounce cannot be tested without letting time pass. So
  this is the first referee in the course that has to await anything.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Week 11 warm-up — five small functions</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
        --true: #0f766e;
        --false: #b91c1c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0 auto;
        padding: 24px 16px;
        max-width: 60rem;
        font:
          16px/1.6 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 4px;
      }
      p.lead {
        margin: 0 0 20px;
        color: var(--muted);
      }
      .tally {
        display: inline-block;
        font:
          700 20px/1 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        border-radius: 8px;
        padding: 8px 14px;
        border: 1px solid var(--line);
      }
      .tally.ok {
        color: var(--true);
        border-color: #99f6e4;
        background: #f0fdfa;
      }
      .tally.no {
        color: var(--false);
        border-color: #fecaca;
        background: #fef2f2;
      }
      ul {
        list-style: none;
        margin: 18px 0 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }
      li {
        display: grid;
        gap: 3px;
        border: 1px solid var(--line);
        border-inline-start-width: 5px;
        border-radius: 8px;
        padding: 10px 13px;
      }
      li.ok {
        border-inline-start-color: var(--true);
        background: #f0fdfa;
      }
      li.no {
        border-inline-start-color: var(--false);
        background: #fef2f2;
      }
      li code {
        font:
          700 14px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .what {
        color: var(--muted);
        font-size: 14px;
      }
      .said {
        font:
          13px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      #sandbox {
        display: none;
      }
    </style>
  </head>

  <body>
    <h1>Five small functions, and four of them are wrong</h1>
    <p class="lead">
      Ten minutes. No git, no submission, no marks. Fix <code>warmup.js</code> until the tally is
      five of five. Reload after every change.
    </p>

    <p><span class="tally" id="tally">—</span></p>

    <ul id="board"></ul>

    <div id="sandbox"></div>

    <script type="module" src="referee.js"></script>
  </body>
</html>
