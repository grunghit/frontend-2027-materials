<!doctype html>
<!--
  grid-template-areas, edited as ASCII art. Week-4 deck, act 4.

  Type the layout as a picture; the page becomes the picture. This is the one Grid
  feature that reads as its own documentation, and it is what CA4's dashboard is built
  from, so the room should have typed one before they are asked to write one.

  What makes it teach rather than merely demonstrate:

  1. The textarea IS the layout. There is no apply button and no second source of
     truth — every keystroke sets grid-template-areas directly, so a malformed grid
     fails instantly and visibly rather than after a click, and the connection between
     the two is impossible to miss.
  2. The three real rules are enforced with real error messages, because the browser's
     own failure mode here is silence. An invalid areas value is dropped, the property
     falls back to `none`, and the layout quietly becomes a plain auto-placed grid that
     looks broken for no stated reason. The rules: every row needs the same number of
     cells; a named area must be rectangular; and a dot is an empty cell.
  3. The non-rectangular case has its own button, because it is the interesting
     failure. An L-shaped area is not a thing Grid can express, the browser says
     nothing, and the student concludes areas "do not work".
  4. Breakpoint presets show the same five regions re-arranged into a phone, a tablet
     and a desktop shape — which is the actual technique the assignment needs, and it
     makes the point that a responsive page shell can be three pictures and nothing
     else.

  DEMO MOVE: start on the desktop preset. Delete the word `aside` from one row and
  replace it with `main` — the main region grows into it live, and nobody had to touch
  a single item's CSS. THEN press "phone" and let them see the whole layout re-flow
  from one property. Finally press the broken button and ask why nothing happened; the
  answer is in the error panel and it is the important half of this demo.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>grid-template-areas</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .presets {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
      }
      .presets button {
        font:
          600 12px/1.4 ui-monospace,
          Menlo,
          monospace;
        padding: 5px 10px;
        border: 1px solid #7a8699;
        border-radius: 999px;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
      }
      .presets button.warn {
        border-color: #b45309;
        background: #fffbeb;
        color: #7c2d12;
      }
      .split {
        display: grid;
        gap: 12px;
        grid-template-columns: minmax(0, 1fr);
      }
      @media (min-width: 46em) {
        .split {
          grid-template-columns: minmax(0, 260px) minmax(0, 1fr);
        }
      }
      label {
        display: block;
        font:
          600 12px/1.5 ui-monospace,
          Menlo,
          monospace;
        color: var(--muted);
        margin-bottom: 4px;
      }
      textarea {
        width: 100%;
        min-height: 132px;
        font:
          13px/1.5 ui-monospace,
          'SF Mono',
          Menlo,
          Consolas,
          monospace;
        padding: 8px 10px;
        border: 2px solid var(--line);
        border-radius: 8px;
        resize: vertical;
        white-space: pre;
      }
      :focus-visible {
        outline: 3px solid #b45309;
        outline-offset: 2px;
      }

      .stage {
        padding: 10px;
        border: 2px dashed #7a8699;
        border-radius: 10px;
        background: #f8fafc;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: 46px;
        gap: 8px;
      }
      .region {
        border-radius: 6px;
        display: grid;
        place-content: center;
        font:
          700 12px/1.3 ui-monospace,
          Menlo,
          monospace;
        border: 2px solid;
      }
      .masthead {
        grid-area: masthead;
        background: #ede9fe;
        border-color: #6d28d9;
        color: #4c1d95;
      }
      .sidebar {
        grid-area: sidebar;
        background: #dcfce7;
        border-color: #15803d;
        color: #14532d;
      }
      .main {
        grid-area: main;
        background: #dbeafe;
        border-color: #1d4ed8;
        color: #1e3a8a;
      }
      .aside {
        grid-area: aside;
        background: #fef3c7;
        border-color: #b45309;
        color: #7c2d12;
      }
      .footer {
        grid-area: footer;
        background: #e2e8f0;
        border-color: #94a3b8;
        color: #334155;
      }

      .note {
        margin: 10px 0 0;
        padding: 10px 12px;
        border-radius: 8px;
        border: 2px solid #15803d;
        background: #dcfce7;
        font:
          13px/1.6 ui-monospace,
          Menlo,
          monospace;
        white-space: pre-wrap;
      }
      .note.bad {
        border-color: #b91c1c;
        background: #fef2f2;
      }
    </style>
  </head>

  <body>
    <div class="presets" id="presets"></div>

    <div class="split">
      <div>
        <label for="areas">grid-template-areas</label>
        <textarea id="areas" spellcheck="false" autocomplete="off"></textarea>
      </div>
      <div>
        <h2>The layout that picture produces</h2>
        <div class="stage">
          <div class="grid" id="grid">
            <div class="region masthead">masthead</div>
            <div class="region sidebar">sidebar</div>
            <div class="region main">main</div>
            <div class="region aside">aside</div>
            <div class="region footer">footer</div>
          </div>
        </div>
      </div>
    </div>

    <p class="note" id="note" aria-live="polite"></p>

    <script>
      const PRESETS = {
        desktop:
          '"masthead masthead masthead masthead"\n' +
          '"sidebar  main     main     aside   "\n' +
          '"sidebar  main     main     aside   "\n' +
          '"footer   footer   footer   footer  "',
        tablet:
          '"masthead masthead masthead masthead"\n' +
          '"sidebar  main     main     main    "\n' +
          '"aside    aside    aside    aside   "\n' +
          '"footer   footer   footer   footer  "',
        phone:
          '"masthead masthead masthead masthead"\n' +
          '"main     main     main     main    "\n' +
          '"sidebar  sidebar  sidebar  sidebar "\n' +
          '"aside    aside    aside    aside   "\n' +
          '"footer   footer   footer   footer  "',
        'a gap in the grid':
          '"masthead masthead masthead masthead"\n' +
          '"sidebar  main     main     .       "\n' +
          '"sidebar  main     main     aside   "\n' +
          '"footer   footer   footer   footer  "',
        'not a rectangle':
          '"masthead masthead masthead masthead"\n' +
          '"sidebar  main     main     aside   "\n' +
          '"sidebar  main     aside    aside   "\n' +
          '"footer   footer   footer   footer  "',
        'ragged rows':
          '"masthead masthead masthead"\n' +
          '"sidebar  main     main     aside"\n' +
          '"footer   footer   footer  "',
      };

      const grid = document.getElementById('grid');
      const areas = document.getElementById('areas');
      const note = document.getElementById('note');
      const presets = document.getElementById('presets');

      for (const [name, value] of Object.entries(PRESETS)) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = name;
        if (name === 'not a rectangle' || name === 'ragged rows') b.className = 'warn';
        b.addEventListener('click', () => {
          areas.value = value;
          render();
        });
        presets.append(b);
      }

      /* Explain what the browser will not. These three are the only ways to write an
         invalid areas value, and all three fail silently in every browser. */
      function diagnose(text) {
        const rows = text
          .split('\n')
          .map((r) => r.trim())
          .filter(Boolean)
          .map((r) => r.replace(/^"|"$/g, '').trim().split(/\s+/));
        if (!rows.length) return 'Nothing to lay out yet.';

        const widths = new Set(rows.map((r) => r.length));
        if (widths.size > 1) {
          return (
            'Every row must have the same number of cells.\n' +
            'Yours have ' +
            [...widths].join(', ') +
            '. A grid is a rectangle, so a picture of one has to be too.'
          );
        }

        const seen = new Map();
        rows.forEach((row, y) => {
          row.forEach((name, x) => {
            if (name === '.') return;
            const box = seen.get(name) ?? { x1: x, x2: x, y1: y, y2: y, count: 0 };
            box.x1 = Math.min(box.x1, x);
            box.x2 = Math.max(box.x2, x);
            box.y1 = Math.min(box.y1, y);
            box.y2 = Math.max(box.y2, y);
            box.count += 1;
            seen.set(name, box);
          });
        });
        for (const [name, box] of seen) {
          const area = (box.x2 - box.x1 + 1) * (box.y2 - box.y1 + 1);
          if (area !== box.count) {
            return (
              'The area "' +
              name +
              '" is not a rectangle.\n' +
              'Grid can only name rectangular areas — there is no L shape, no T shape,\n' +
              'and no way to fake one. Redraw it, or use two elements.'
            );
          }
        }
        return null;
      }

      function render() {
        const text = areas.value;
        grid.style.gridTemplateAreas = '';
        grid.style.gridTemplateAreas = text;

        const problem = diagnose(text);
        const applied = getComputedStyle(grid).gridTemplateAreas;
        const rejected = applied === 'none' && text.trim() !== '';

        note.className = problem || rejected ? 'note bad' : 'note';
        note.textContent = problem
          ? problem +
            '\n\nThe browser dropped the whole declaration and fell back to plain\n' +
            'auto-placement, which is why the boxes above look shuffled rather than\n' +
            'broken. Nothing was logged. This is the failure mode to recognise.'
          : rejected
            ? 'The browser rejected that value. Check the quotes: one pair per row.'
            : 'Valid. Every row has the same number of cells and every named area is a\n' +
              'rectangle.\n\n' +
              'A dot is a deliberately empty cell — useful, and the reason "a gap in the\n' +
              'grid" is a preset here rather than a mistake.\n\n' +
              'Note what the five regions themselves say: `grid-area: main` and nothing\n' +
              'else. The picture holds the layout; the items only claim a name. That is\n' +
              'what makes a responsive page shell three pictures in three media queries\n' +
              'instead of twenty re-declared line numbers.';
      }

      areas.addEventListener('input', render);
      areas.value = PRESETS.desktop;
      render();
    </script>
  </body>
</html>
