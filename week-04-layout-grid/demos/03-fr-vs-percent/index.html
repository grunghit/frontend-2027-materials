<!doctype html>
<!--
  fr is not "percent with a nicer name". Week-4 deck, act 2.

  Two grids, side by side, given the same intent — three equal columns with a gutter.
  One is written in percentages, one in fr. They are identical at gap: 0 and they
  diverge the instant a designer asks for space between things, which is always.

  What makes it teach rather than merely demonstrate:

  1. Both grids are live and the SAME slider drives both, so the divergence is caused
     in front of the room rather than asserted. At gap 0 they agree exactly — that
     agreement is what makes the disagreement mean something.
  2. The arithmetic is printed, both ways round. A percentage resolves against the
     container's content box and knows nothing about the gap, so 33.333% x 3 plus two
     gaps is always wider than the container by exactly the total gap. `fr` resolves
     against the space that is LEFT after gaps are subtracted. Those two sentences are
     the entire lesson, and the readout shows them as numbers that move.
  3. The overflow is real, not simulated. The percentage grid is inside its own scroll
     container and genuinely bursts it; the number reported is measured, not computed
     by this file's own JavaScript.
  4. The "just use 32%" answer is available as a checkbox, so the class can watch the
     fix work at exactly one window width and fail either side of it.

  DEMO MOVE: gap at 0, both grids identical. Say "these are the same layout". Drag the
  gap to 20 in one motion and stop talking. Someone will say the percentages need to be
  smaller — tick the box, then resize the window slowly and let them watch the number
  go right and then wrong again. The sentence to leave in the room is at the bottom of
  the readout, and it is worth saying out loud before they read it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fr versus percent</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h2 {
        margin: 0 0 6px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h2 code {
        text-transform: none;
        letter-spacing: 0;
        font-size: 13px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        align-items: center;
        margin-bottom: 12px;
      }
      .controls label {
        font:
          600 13px/1.5 ui-monospace,
          Menlo,
          monospace;
        cursor: pointer;
      }
      input[type='range'] {
        accent-color: #1d4ed8;
        vertical-align: middle;
      }
      input[type='checkbox'] {
        accent-color: #1d4ed8;
        margin-right: 4px;
      }
      :focus-visible {
        outline: 3px solid #b45309;
        outline-offset: 2px;
      }

      .pair {
        display: grid;
        gap: 14px;
      }
      .stage {
        padding: 10px;
        border-radius: 10px;
        overflow-x: auto;
      }
      .stage.bad {
        border: 3px solid #b91c1c;
        background: #fff5f5;
      }
      .stage.good {
        border: 3px solid #15803d;
        background: #f0fdf4;
      }
      .grid {
        display: grid;
      }
      .cell {
        padding: 16px 8px;
        border-radius: 6px;
        text-align: center;
        font:
          700 12px/1.4 ui-monospace,
          Menlo,
          monospace;
      }
      .bad .cell {
        background: #fee2e2;
        border: 2px solid #b91c1c;
        color: #7f1d1d;
      }
      .good .cell {
        background: #dcfce7;
        border: 2px solid #15803d;
        color: #14532d;
      }

      .readout {
        margin: 12px 0 0;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f1f5f9;
        font:
          13px/1.5 ui-monospace,
          'SF Mono',
          Menlo,
          Consolas,
          monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>

  <body>
    <div class="controls">
      <label for="gap">gap</label>
      <input type="range" id="gap" min="0" max="40" step="2" value="0" />
      <output id="gap-out" for="gap">0px</output>
      <label><input type="checkbox" id="trim" />trim the percentages to 32%</label>
    </div>

    <div class="pair">
      <div>
        <h2><code>grid-template-columns: 33.333% 33.333% 33.333%</code></h2>
        <div class="stage bad" id="pct-stage">
          <div class="grid" id="pct">
            <div class="cell">one</div>
            <div class="cell">two</div>
            <div class="cell">three</div>
          </div>
        </div>
      </div>
      <div>
        <h2><code>grid-template-columns: 1fr 1fr 1fr</code></h2>
        <div class="stage good" id="fr-stage">
          <div class="grid" id="fr">
            <div class="cell">one</div>
            <div class="cell">two</div>
            <div class="cell">three</div>
          </div>
        </div>
      </div>
    </div>

    <p class="readout" id="out" aria-live="polite"></p>

    <script>
      const pct = document.getElementById('pct');
      const fr = document.getElementById('fr');
      const pctStage = document.getElementById('pct-stage');
      const gap = document.getElementById('gap');
      const gapOut = document.getElementById('gap-out');
      const trim = document.getElementById('trim');
      const out = document.getElementById('out');

      function render() {
        const g = Number(gap.value);
        const share = trim.checked ? '32%' : '33.333%';

        gapOut.textContent = g + 'px';
        pct.style.gridTemplateColumns = share + ' ' + share + ' ' + share;
        pct.style.gap = g + 'px';
        fr.style.gridTemplateColumns = '1fr 1fr 1fr';
        fr.style.gap = g + 'px';

        requestAnimationFrame(() => {
          const inner = Math.round(pctStage.clientWidth) - 20;
          const wants = Math.round(pct.scrollWidth);
          const over = wants - inner;
          const pctTracks = getComputedStyle(pct).gridTemplateColumns;
          const frTracks = getComputedStyle(fr).gridTemplateColumns;

          out.textContent =
            '  container inner width   ' +
            inner +
            'px\n' +
            '  gap x 2                 ' +
            g * 2 +
            'px\n\n' +
            '  percent resolved to     ' +
            pctTracks +
            '\n' +
            '  and the row then wants  ' +
            wants +
            'px  (' +
            (over > 0 ? '+' + over : String(over)) +
            ')\n\n' +
            '  fr resolved to          ' +
            frTracks +
            '\n\n' +
            (g === 0
              ? '  With no gap these are the same layout, and you should say so plainly.\n' +
                '  Nothing so far distinguishes the two units.\n\n' +
                '  Now drag the gap. Every real design has one.'
              : over > 0
                ? '  A percentage is a percentage OF THE CONTAINER, and the gap is not part\n' +
                  '  of that calculation. Three tracks at ' +
                  share +
                  ' already fill the container,\n' +
                  '  so the two gaps are added on top and the row is exactly ' +
                  g * 2 +
                  'px too wide.\n' +
                  '  It is off by the gap, always, and you can watch that hold as you drag.\n\n' +
                  '  fr does the subtraction first: the gaps are taken out, and the three\n' +
                  '  tracks divide WHAT IS LEFT. That is the whole difference.\n\n' +
                  '  fr is not a percentage of the container. It is a share of the leftover.'
                : '  32% x 3 is 96%, which buys back 4% of the container. At this exact width\n' +
                  '  4% happens to be about ' +
                  Math.round(inner * 0.04) +
                  'px, and the gaps need ' +
                  g * 2 +
                  'px.\n\n' +
                  '  So it fits — here. Resize the window. 4% is a different number at every\n' +
                  '  width while the gap stays ' +
                  g +
                  'px, so the arithmetic is correct at one\n' +
                  '  viewport and wrong at all the others. There is no percentage that fixes\n' +
                  '  this, because the mistake is the unit and not the number.');
        });
      }

      gap.addEventListener('input', render);
      trim.addEventListener('change', render);
      addEventListener('resize', render);
      render();
    </script>
  </body>
</html>
