<!doctype html>
<!--
  The track visualiser. Week-4 deck, acts 1 and 2. THE CENTRAL TOOL OF THE WEEK.

  Type a `grid-template-columns` value; see the tracks it produces, the line numbers
  that come with them, and what the browser actually resolved each track to in pixels.

  This is the modernised descendant of the legacy `שיעור 5/grid sizing/` set — six
  separate pages, one per sizing keyword (fixed-size, auto-size, fractional-size,
  minmax-size, repeat), each a static example you could only read. They are the preset
  buttons here, so the same six ideas are one click apart and can be COMPARED, which
  is the thing six separate files made impossible.

  What makes it teach rather than merely demonstrate:

  1. Every number comes from the browser. The track widths are read out of
     getComputedStyle(...).gridTemplateColumns, which reports USED values — the pixels
     the layout actually resolved, never the string that was typed. That distinction
     is the whole reason this tool exists: `1fr 2fr` and `repeat(2, 50%)` are different
     strings that sometimes produce the same pixels and usually do not.
  2. The line numbers are drawn from measured track edges, both positive and negative.
     Students place items on LINES, not in cells, and the off-by-one ("3 columns means
     4 lines") is the single most common early Grid error. Showing -1 at the end is
     what makes `grid-column: 1 / -1` readable later instead of magic.
  3. Bad input is caught and explained, not silently ignored. The browser drops an
     invalid `grid-template-columns` value and falls back to `none`, which renders as
     one column and looks like "grid did nothing" — a genuinely confusing failure. The
     tool compares what it set against what came back and says so.
  4. The item count is adjustable, so the implicit grid appears on its own. Add items
     past the end of the explicit tracks and new rows arrive that nobody declared; the
     readout names them as implicit and points at `grid-auto-rows`.

  DEMO MOVE: start on the `200px 200px 200px` preset and resize the window — nothing
  moves, and the third track eventually leaves the container. Ask what unit would fix
  it. Take the answer "percent" seriously: click `33% 33% 33%`, then add a gap with the
  slider and watch it burst, which is exactly what act 0 already showed them. THEN
  click `1fr 1fr 1fr`. Add the gap again. Nothing bursts. That is the moment `fr` is
  worth defining, and not before.

  Second visit, in act 2: use the `minmax` and `repeat` presets, and the custom box.

  Note for whoever maintains this: the CSS is applied by assigning to
  element.style.gridTemplateColumns, NOT by appending a <style> element. The legacy
  harness appended one per click, so a wrong answer was never undone and the third
  attempt was silently graded against the first.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grid track visualiser</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .presets {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
      }
      .presets button {
        font:
          600 12px/1.4 ui-monospace,
          Menlo,
          monospace;
        padding: 5px 10px;
        border: 1px solid #7a8699;
        border-radius: 999px;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
      }
      .presets button[aria-pressed='true'] {
        background: #1d4ed8;
        border-color: #1d4ed8;
        color: #fff;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        align-items: center;
        margin-bottom: 10px;
      }
      .row label {
        font:
          600 13px/1.5 ui-monospace,
          Menlo,
          monospace;
      }
      #custom {
        flex: 1 1 320px;
        min-width: 0;
        font:
          13px/1.6 ui-monospace,
          Menlo,
          monospace;
        padding: 6px 8px;
        border: 2px solid var(--line);
        border-radius: 6px;
      }
      input[type='range'] {
        accent-color: #1d4ed8;
        vertical-align: middle;
      }
      :focus-visible {
        outline: 3px solid #b45309;
        outline-offset: 2px;
      }

      .stage {
        padding: 10px;
        border: 2px dashed #7a8699;
        border-radius: 10px;
        background: #f8fafc;
        overflow-x: auto;
      }
      /* The rail carries the line numbers. It is a sibling of the grid, positioned
         over it, so the numbers cannot become grid items themselves and change the
         very layout they are labelling. */
      .measured {
        position: relative;
        padding-top: 20px;
      }
      .lines {
        position: absolute;
        inset-block-start: 0;
        inset-inline-start: 0;
        height: 20px;
        width: 100%;
        pointer-events: none;
      }
      .lines span {
        position: absolute;
        transform: translateX(-50%);
        font:
          700 11px/1 ui-monospace,
          Menlo,
          monospace;
        color: #b45309;
        white-space: nowrap;
      }
      .lines span b {
        color: var(--muted);
        font-weight: 400;
      }
      .grid {
        display: grid;
      }
      .cell {
        padding: 14px 8px;
        border-radius: 6px;
        background: #dbeafe;
        border: 2px solid #1d4ed8;
        color: #1e3a8a;
        font:
          700 12px/1.4 ui-monospace,
          Menlo,
          monospace;
        text-align: center;
        overflow: hidden;
      }
      .cell.implicit {
        background: #fef3c7;
        border-color: #b45309;
        color: #7c2d12;
      }

      .readout {
        margin: 12px 0 0;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f1f5f9;
        font:
          13px/1.5 ui-monospace,
          'SF Mono',
          Menlo,
          Consolas,
          monospace;
        white-space: pre-wrap;
      }
      .verdict {
        margin: 10px 0 0;
        padding: 8px 12px;
        border-radius: 8px;
        border: 2px solid #15803d;
        background: #dcfce7;
        font-weight: 700;
        font-size: 14px;
      }
      .verdict.bad {
        border-color: #b91c1c;
        background: #fef2f2;
      }
    </style>
  </head>

  <body>
    <div class="presets" id="presets"></div>

    <div class="row">
      <label for="custom">grid-template-columns</label>
      <input id="custom" type="text" value="1fr 2fr 1fr" spellcheck="false" />
    </div>

    <div class="row">
      <label for="gap">gap</label>
      <input type="range" id="gap" min="0" max="40" step="2" value="10" />
      <output id="gap-out" for="gap">10px</output>
      <label for="count">items</label>
      <input type="range" id="count" min="1" max="12" step="1" value="6" />
      <output id="count-out" for="count">6</output>
    </div>

    <h2>The tracks, and the lines that come with them</h2>
    <div class="stage">
      <div class="measured">
        <div class="lines" id="lines" aria-hidden="true"></div>
        <div class="grid" id="grid"></div>
      </div>
    </div>

    <p class="verdict" id="verdict"></p>
    <p class="readout" id="out" aria-live="polite"></p>

    <script>
      const PRESETS = [
        '200px 200px 200px',
        '33% 33% 33%',
        '1fr 1fr 1fr',
        '1fr 2fr 1fr',
        'auto 400px 1fr',
        'repeat(3, 1fr)',
        'repeat(4, minmax(120px, 1fr))',
        'min-content max-content 1fr',
      ];

      const grid = document.getElementById('grid');
      const lines = document.getElementById('lines');
      const custom = document.getElementById('custom');
      const presets = document.getElementById('presets');
      const gap = document.getElementById('gap');
      const gapOut = document.getElementById('gap-out');
      const count = document.getElementById('count');
      const countOut = document.getElementById('count-out');
      const out = document.getElementById('out');
      const verdict = document.getElementById('verdict');

      for (const value of PRESETS) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = value;
        b.dataset.value = value;
        b.addEventListener('click', () => {
          custom.value = value;
          render();
        });
        presets.append(b);
      }

      function render() {
        const wanted = custom.value.trim();
        const items = Number(count.value);

        gapOut.textContent = gap.value + 'px';
        countOut.textContent = items;

        /* Assign, never append. Setting the property to '' first means an invalid
           value leaves it empty rather than leaving the previous valid one in place,
           which is what lets us detect bad input below instead of showing a stale
           layout that looks like it worked. */
        grid.style.gridTemplateColumns = '';
        grid.style.gridTemplateColumns = wanted;
        grid.style.gap = gap.value + 'px';

        grid.replaceChildren();
        for (let i = 0; i < items; i += 1) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.textContent = i + 1;
          grid.append(cell);
        }

        for (const b of presets.children) {
          b.setAttribute('aria-pressed', String(b.dataset.value === wanted));
        }

        requestAnimationFrame(() => {
          const style = getComputedStyle(grid);
          const used = style.gridTemplateColumns;
          const tracks = used === 'none' ? [] : used.split(/\s+/);
          const rejected = wanted !== '' && used === 'none';

          /* Mark anything that landed on an implicit row. Rows past the first
             ceil(items / tracks) explicit one were never declared by anybody. */
          const columns = Math.max(tracks.length, 1);
          [...grid.children].forEach((cell, i) => {
            cell.classList.toggle('implicit', i >= columns);
          });

          /* Line numbers, drawn from measured cell edges rather than from the track
             string — so they are right even when the browser resolved something the
             author did not expect. */
          lines.replaceChildren();
          const gridBox = grid.getBoundingClientRect();
          const first = [...grid.children].slice(0, columns);
          const edges = [];
          first.forEach((cell) => {
            const r = cell.getBoundingClientRect();
            edges.push(r.left - gridBox.left);
          });
          if (first.length) {
            edges.push(first[first.length - 1].getBoundingClientRect().right - gridBox.left);
          }
          edges.forEach((x, i) => {
            const span = document.createElement('span');
            /* Centre every label on its line EXCEPT the outermost two, which are
               anchored to the edges instead. Centring the first one puts half of it at
               a negative offset where it is clipped; centring the last one pushes the
               stage into a horizontal scrollbar, which then reads to a student as the
               layout overflowing — a false alarm in a week about overflow. */
            if (i === 0) {
              span.style.insetInlineStart = '0';
              span.style.transform = 'none';
            } else if (i === edges.length - 1) {
              span.style.insetInlineEnd = '0';
              span.style.transform = 'none';
            } else {
              span.style.insetInlineStart = x + 'px';
            }
            const negative = i - edges.length;
            span.append(
              document.createTextNode(String(i + 1)),
              Object.assign(document.createElement('b'), { textContent: ' / ' + negative }),
            );
            lines.append(span);
          });

          const rows = Math.ceil(items / columns);
          const implicitRows = Math.max(0, rows - 1);

          verdict.className = rejected ? 'verdict bad' : 'verdict';
          verdict.textContent = rejected
            ? 'The browser rejected that value and fell back to a single column.'
            : columns +
              ' tracks, so ' +
              (columns + 1) +
              ' lines, numbered 1 to ' +
              (columns + 1) +
              '.';

          out.textContent =
            '  you wrote     ' +
            (wanted || '(nothing)') +
            '\n' +
            '  browser used  ' +
            used +
            '\n' +
            '  gap           ' +
            gap.value +
            'px\n' +
            '  items         ' +
            items +
            '  in ' +
            rows +
            ' row' +
            (rows === 1 ? '' : 's') +
            '\n\n' +
            (rejected
              ? '  This is the confusing one. An invalid grid-template-columns is DROPPED,\n' +
                '  and the property falls back to `none` — which is a perfectly good grid\n' +
                '  with one implicit column. So the page does not error, nothing turns red,\n' +
                '  and it simply looks like "Grid did not work".\n\n' +
                '  Check the value. A stray comma outside repeat(), a missing unit on a\n' +
                '  number that is not 0, or px written as p x will all land you here.'
              : '  Read the second line, not the first. That is what the layout actually\n' +
                '  resolved to, in pixels — the USED value. Every track you wrote as a\n' +
                '  proportion, a range or a keyword has been turned into a number by now.\n\n' +
                (implicitRows > 0
                  ? '  The amber cells are on rows NOBODY DECLARED. You wrote ' +
                    columns +
                    ' columns and\n' +
                    '  nothing about rows, so the extra items generated ' +
                    implicitRows +
                    ' implicit row' +
                    (implicitRows === 1 ? '' : 's') +
                    '.\n' +
                    '  They are sized by their content unless you say otherwise with\n' +
                    '  grid-auto-rows. This is a feature, and it is how a list of unknown\n' +
                    '  length lays itself out.\n\n'
                  : '') +
                '  The numbers above the grid are the LINES. Items are placed between\n' +
                '  lines, not "in cell 2" — which is why there is always one more line\n' +
                '  than there are tracks. The grey number is the same line counted from\n' +
                '  the end, and it is why `grid-column: 1 / -1` means "all the way across"\n' +
                '  no matter how many tracks there turn out to be.');
        });
      }

      for (const control of [custom, gap, count]) {
        control.addEventListener('input', render);
      }
      addEventListener('resize', render);
      render();
    </script>
  </body>
</html>
