<!doctype html>
<!--
  Week 1 — the first real page of your personal site.

  Open this file with LIVE SERVER, never by double-clicking it.
  Right-click in the editor → "Open with Live Server".

  Write your code wherever you see  <!- - CODE HERE - ->  and delete the marker.
  When no CODE HERE markers are left, you have finished the core tier.

  Do NOT write any CSS this week. The page is meant to look plain — week 2 is where it
  stops looking like a 1996 Word document. A page that is structured correctly is worth
  more marks today than a page that is styled.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- CODE HERE — replace this title with your own. It shows in the browser tab,
         in bookmarks and in search results. "Untitled" is not a title. -->
    <title>CHANGE ME — your name here</title>
  </head>

  <body>
    <!-- ============================================================
         1. HEADER — the top of the page.
         Inside it: exactly one <h1> with your name, and a short line about you.
         ============================================================ -->
    <!-- CODE HERE -->

    <!-- ============================================================
         2. NAV — your main navigation.
         A <nav> containing a <ul> of links. Each link points at a section of this
         page (href="#about"), and the link text says where it goes.
         Remember: not every link list is a nav — this one is.
         ============================================================ -->
    <!-- CODE HERE -->

    <!-- ============================================================
         3. MAIN — exactly one per document. Everything unique to this page.

         Inside it, at least:
           · a <section id="about">   with an <h2>, a paragraph or two, and one <img>
                                      that has a real alt describing the picture
           · a <section id="contact"> with the form from part 4

         There is an image ready for you at images/placeholder.svg — replace it with
         your own if you like. Give every <img> a width and a height.
         ============================================================ -->
    <!-- CODE HERE -->

    <!-- ============================================================
         4. THE FORM — inside the contact section.

         It needs:
           · a <fieldset> with a <legend>
           · at least four fields, each with a real <label for="…"> pointing at the
             field's id — a placeholder is not a label
           · a sensible type on each field (text, email, tel, date, …)
           · at least one field marked required
           · a submit button

         There is no server this week, so pressing submit will not send anything
         anywhere. That is expected.
         ============================================================ -->
    <!-- CODE HERE -->

    <!-- ============================================================
         5. FOOTER — closing content. Who made this, and when.
         ============================================================ -->
    <!-- CODE HERE -->
  </body>
</html>
