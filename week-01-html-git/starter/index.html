<!doctype html>
<!--
  Week 1 — the first real page of your personal site.

  Open this file with LIVE SERVER, never by double-clicking it.
  Right-click in the editor → "Open with Live Server".

  Write your code wherever you see  <!- - CODE HERE - ->  and delete the marker.
  When no CODE HERE markers are left, you have finished the core tier.

  Everything asked for below was typed once today, in a cycle. Your practice folder has
  your own version of each piece — assemble them here, on your own content.

  Do NOT write any CSS this week. The page is meant to look plain — the CSS week is where
  it stops looking like a 1996 Word document. A page that is structured correctly is worth
  more marks today than a page that is styled.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- CODE HERE — replace this title with your own. It shows in the browser tab,
         in bookmarks and in search results. "Untitled" is not a title. -->
    <title>CHANGE ME — your name here</title>
  </head>

  <body>
    <!-- ============================================================
         1. HEADER — the top of the page.                       (cycle 2)
         Inside it: exactly one <h1> with your name, and a short line about you.
         ============================================================ -->
    <!-- CODE HERE -->

    <!-- ============================================================
         2. NAV — your main navigation.                         (cycle 2)
         A <nav> containing a <ul> of links: nav > ul > li > a. Each link points at
         a section of this page (href="#about"), and the link text says where it goes.
         Remember: not every link list is a nav — this one is.
         ============================================================ -->
    <!-- CODE HERE -->

    <!-- ============================================================
         3. MAIN — exactly one per document. Everything unique to this page.

         Inside it, at least two <section>s, each with an id and an <h2>:
           · <section id="about">    a paragraph or two about you, and one <img>
                                     with a real alt describing the picture     (cycle 3)
           · <section id="…">        whatever you want the second one to be

         There is an image ready for you at images/placeholder.svg — replace it with
         your own if you like. Give every <img> a width and a height that fit a phone,
         and write the path the way cycle 3 taught you: from THIS file, no leading slash.

         At least one <strong> or <em> somewhere, chosen for meaning; no <b>, no <i>,
         and never two <br> in a row to push things apart.                (cycle 2)
         ============================================================ -->
    <!-- CODE HERE -->

    <!-- ============================================================
         4. FOOTER — closing content. Who made this, and when.          (cycle 1)
         A link to a real site outside yours belongs here or in a section: full
         https:// address, and if it opens a new tab, rel="noopener noreferrer".
         ============================================================ -->
    <!-- CODE HERE -->
  </body>
</html>
