<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Markup in, tree out</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #d3dae4;
        --accent: #0b5f8f;
        --tag: #a03060;
        --text-node: #1c6b3f;
        --bg-soft: #f1f4f8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--ink);
        background: #fff;
      }
      .layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        align-items: start;
      }
      @media (max-width: 620px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
      h2 {
        margin: 0 0 6px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      textarea {
        width: 100%;
        height: 190px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg-soft);
        color: var(--ink);
        font: 13px/1.6 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        resize: vertical;
      }
      textarea:focus-visible,
      button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .tree {
        margin: 0;
        padding: 10px 12px;
        min-height: 190px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: 13px/1.7 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        overflow: auto;
      }
      .tree ul {
        list-style: none;
        margin: 0;
        padding-left: 18px;
        border-left: 1px dotted var(--line);
      }
      .tree > ul {
        padding-left: 0;
        border-left: 0;
      }
      .el {
        color: var(--tag);
        font-weight: 700;
      }
      .attr {
        color: var(--accent);
      }
      .txt {
        color: var(--text-node);
      }
      .kind {
        color: var(--muted);
        font-size: 11px;
      }
      .hint {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      button {
        font: inherit;
        padding: 5px 12px;
        border: 1px solid var(--accent);
        border-radius: 999px;
        background: #fff;
        color: var(--accent);
        cursor: pointer;
      }
      .bar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 6px;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div>
        <div class="bar">
          <h2 style="margin: 0">1 — the text you send</h2>
          <button type="button" id="reset">reset</button>
        </div>
        <label for="src" class="hint" style="display: block; margin: 0 0 6px">
          Edit this. The tree on the right is rebuilt as you type.
        </label>
        <textarea id="src" spellcheck="false">
&lt;article&gt;
  &lt;h2&gt;Trip report&lt;/h2&gt;
  &lt;p&gt;We walked &lt;strong&gt;17 km&lt;/strong&gt;.&lt;/p&gt;
  &lt;img src="map.svg" alt="Route map"&gt;
&lt;/article&gt;</textarea
        >
      </div>

      <div>
        <h2>2 — the tree the browser built</h2>
        <div class="tree" id="tree" aria-live="polite"></div>
        <p class="hint">
          Every node is an object with a parent, children and properties. You have written this
          data structure before — it is a tree, and you traversed one in Data Structures.
        </p>
      </div>
    </div>

    <script>
      const INITIAL = document.getElementById('src').value;
      const src = document.getElementById('src');
      const out = document.getElementById('tree');

      function nodeLabel(node) {
        if (node.nodeType === Node.TEXT_NODE) {
          const text = node.nodeValue.replace(/\s+/g, ' ').trim();
          if (!text) return null;
          const span = document.createElement('span');
          span.className = 'txt';
          span.textContent = `"${text}"`;
          const kind = document.createElement('span');
          kind.className = 'kind';
          kind.textContent = '  Text';
          const frag = document.createDocumentFragment();
          frag.append(span, kind);
          return frag;
        }
        if (node.nodeType !== Node.ELEMENT_NODE) return null;

        const frag = document.createDocumentFragment();
        const name = document.createElement('span');
        name.className = 'el';
        name.textContent = node.tagName.toLowerCase();
        frag.append(name);

        for (const attr of node.attributes) {
          const a = document.createElement('span');
          a.className = 'attr';
          a.textContent = ` ${attr.name}="${attr.value}"`;
          frag.append(a);
        }

        const kind = document.createElement('span');
        kind.className = 'kind';
        kind.textContent = '  Element';
        frag.append(kind);
        return frag;
      }

      function build(node) {
        const list = document.createElement('ul');
        for (const child of node.childNodes) {
          const label = nodeLabel(child);
          if (!label) continue;
          const li = document.createElement('li');
          li.append(label);
          if (child.childNodes.length) li.append(build(child));
          list.append(li);
        }
        return list;
      }

      function render() {
        const host = document.createElement('div');
        host.innerHTML = src.value;
        out.replaceChildren(build(host));
      }

      src.addEventListener('input', render);
      document.getElementById('reset').addEventListener('click', () => {
        src.value = INITIAL;
        render();
      });
      render();
    </script>
  </body>
</html>
