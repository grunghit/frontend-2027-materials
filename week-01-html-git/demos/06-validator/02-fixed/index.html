<!doctype html>
<!--
  The same page with the three breaks repaired:
    · </div> that closed a <section>  → </section>
    · <img> with no alt              → alt describing the picture
    · two elements sharing id="route" → each id used once

  Run the validator again in front of the class. Zero errors is the floor, not the grade.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trip report — Golan, March</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        padding: 16px;
        font: 15px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #14181f;
        background: #fff;
      }
      img {
        width: 120px;
        height: 120px;
        border-radius: 8px;
      }
      a {
        color: #0b5f8f;
      }
      a:focus-visible {
        outline: 3px solid #0b5f8f;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Trip report — Golan, March</h1>
    </header>

    <main>
      <section id="route">
        <h2>The route</h2>
        <p>Seventeen kilometres, most of it uphill, all of it in the rain.</p>
      </section>

      <section id="photographs">
        <h2>The photographs</h2>
        <img src="images/trail.svg" alt="A winding trail climbing over two green hills" width="120" height="120" />
      </section>
    </main>

    <footer>
      <p><a href="../01-broken/index.html">Back to the broken version</a></p>
    </footer>
  </body>
</html>
