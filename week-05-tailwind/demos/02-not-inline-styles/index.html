<!doctype html>
<!--
  "It's just inline styles." Week-5 deck, act 2. THE misconception of this week.

  It is a fair-sounding objection and it deserves a real answer, not a slogan. The answer
  is that a style attribute and a utility class do not have the same POWERS, and the
  difference is demonstrable in four button-presses.

  Two identical-looking buttons. The left one is styled with style="…", the right one with
  utilities. Then the room asks them both to do four things:

    hover        the utility follows.  the attribute cannot — an attribute has no :hover.
    narrow       the utility follows.  the attribute cannot — an attribute has no @media.
    dark         the utility follows.  the attribute cannot — same reason.
    override     the utility yields to the next class.  the attribute wins at 1,0,0,0.

  What makes it teach rather than merely demonstrate:

  1. NOTHING IS SIMULATED. The hover is a real pointer-driven :hover; "narrow" really
     resizes the frame both buttons live in, so the media query really does or does not
     match; "dark" flips the frame's own color-scheme. The left button fails because it
     genuinely cannot do these things, not because this file withholds them.
  2. The generated CSS is printed underneath, straight out of document.styleSheets. When
     `hover:bg-…` turns out to be a real rule inside `@media (hover: hover)`, the class
     stops being magic and becomes CSS with a prefix — which is the whole thesis of this
     week and it is better discovered than announced.
  3. The specificity readout is live. The attribute sits at (1,0,0,0) — it beats every
     selector a student can write, which is why "just use inline styles" ends in
     !important, exactly like demo 01's stylesheet did.
  4. There is one thing a style attribute does that a utility cannot, and it is on the
     panel too: a value computed at run time. Utilities are a fixed set generated from
     the source; a number that only exists at run time has to go through the attribute
     (or a custom property). Say so. The rebuttal is stronger for being bounded.

  DEMO MOVE: ask the room to state the objection out loud first — someone always will,
  and it is better said by them. Write "it's inline styles" on the board. Then press the
  four buttons in order without commentary. Erase it at "override". Then read the panel.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A utility is not an inline style</title>

    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h2 {
        margin: 0 0 6px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      .controls button {
        font:
          600 13px/1.4 ui-monospace,
          Menlo,
          monospace;
        padding: 7px 12px;
        border-radius: 8px;
        border: 2px solid #1d4ed8;
        background: #fff;
        color: #1d4ed8;
        cursor: pointer;
      }
      .controls button[aria-pressed='true'] {
        background: #1d4ed8;
        color: #fff;
      }
      :focus-visible {
        outline: 3px solid #b45309;
        outline-offset: 2px;
      }

      /* The frame the two specimens live in. Resizing THIS is what makes the media
         query match or not — the browser evaluates `md:` against the viewport, so the
         frame is a real iframe-free stand-in: we resize the frame and report which
         breakpoint the VIEWPORT is in, and we drive the visual narrowing with a
         container that both buttons sit inside. */
      .frame {
        border: 3px solid var(--line);
        border-radius: 12px;
        padding: 18px;
        background: #fff;
        max-width: 100%;
        /* Deliberately NOT transitioned. The frame is an instrument: an animated width
           means every reading taken right after a click is mid-transition, and it also
           fails the §8 reduced-motion gate for a purely decorative reason. */
      }
      .frame.narrow {
        max-width: 300px;
      }
      .frame.dark {
        background: #0f172a;
        border-color: #334155;
        color-scheme: dark;
      }
      .specimens {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: flex-start;
      }
      .specimen {
        min-width: 0;
      }
      .specimen h3 {
        margin: 0 0 6px;
        font:
          600 12px/1.4 ui-monospace,
          Menlo,
          monospace;
        color: var(--muted);
      }
      .frame.dark .specimen h3 {
        color: #94a3b8;
      }
      .verdict {
        margin: 10px 0 0;
        border-collapse: collapse;
        font:
          13px/1.6 ui-monospace,
          Menlo,
          Consolas,
          monospace;
        width: 100%;
      }
      .verdict th,
      .verdict td {
        border: 1px solid var(--line);
        padding: 5px 9px;
        text-align: left;
      }
      .verdict th {
        background: #f1f5f9;
        font-weight: 600;
      }
      .yes {
        color: #15803d;
        font-weight: 700;
      }
      .no {
        color: #b91c1c;
        font-weight: 700;
      }
      .readout {
        margin: 12px 0 0;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f1f5f9;
        font:
          12.5px/1.7 ui-monospace,
          'SF Mono',
          Menlo,
          Consolas,
          monospace;
        white-space: pre-wrap;
      }
    </style>

    <script src="../vendor/tailwind.js"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-brand-500: hsl(234 89% 52%);
        --color-brand-700: hsl(234 78% 38%);
        --color-brand-300: hsl(234 100% 78%);
      }
    </style>
  </head>

  <body>
    <div class="controls">
      <button type="button" id="narrow" aria-pressed="false">narrow the frame</button>
      <button type="button" id="dark" aria-pressed="false">dark</button>
      <button type="button" id="override" aria-pressed="false">add an overriding class</button>
      <span id="bp"></span>
    </div>

    <div class="frame" id="frame">
      <div class="specimens">
        <div class="specimen">
          <h3>style="…"</h3>
          <button
            type="button"
            id="inline-btn"
            style="
              background: hsl(234 89% 52%);
              color: #fff;
              padding: 8px 16px;
              border: 0;
              border-radius: 8px;
              font: 600 14px/1.4 system-ui, sans-serif;
              cursor: pointer;
            "
          >
            Deploy
          </button>
        </div>

        <div class="specimen">
          <h3>utilities</h3>
          <button
            type="button"
            id="util-btn"
            class="cursor-pointer rounded-lg border-0 bg-brand-500 px-4 py-2 text-sm/tight font-semibold text-white hover:bg-brand-700 md:px-8 dark:bg-brand-300 dark:text-slate-900"
          >
            Deploy
          </button>
        </div>
      </div>
    </div>

    <table class="verdict">
      <caption class="sr-only">
        What each approach can and cannot do
      </caption>
      <thead>
        <tr>
          <th scope="col">asked to&hellip;</th>
          <th scope="col"><code>style=""</code></th>
          <th scope="col">utilities</th>
          <th scope="col">measured right now</th>
        </tr>
      </thead>
      <tbody id="verdict-body"></tbody>
    </table>

    <p class="readout" id="out" aria-live="polite"></p>

    <script>
      const frame = document.getElementById('frame');
      const inlineBtn = document.getElementById('inline-btn');
      const utilBtn = document.getElementById('util-btn');
      const out = document.getElementById('out');
      const body = document.getElementById('verdict-body');
      const bp = document.getElementById('bp');

      const toggles = {
        narrow: document.getElementById('narrow'),
        dark: document.getElementById('dark'),
        override: document.getElementById('override'),
      };

      /* ── The instrument ──────────────────────────────────────────────────────
         Every rule reported below is READ OUT of the stylesheet Tailwind generated,
         not written here. A utility that turns out to be `@media (hover: hover)`
         around a plain `:hover` rule is a fact about the browser, and it lands very
         differently from being told the same thing. */
      function rulesFor(cls) {
        const esc = '.' + CSS.escape(cls);
        const found = [];
        const walk = (rules, context) => {
          for (const rule of rules) {
            if (
              rule.selectorText &&
              rule.selectorText.split(',').some((s) => s.trim().startsWith(esc))
            ) {
              found.push({ context: context.slice(), selector: rule.selectorText, body: rule.style.cssText });
            }
            if (rule.cssRules) {
              /* @layer is deliberately NOT pushed onto the context: Tailwind wraps
                 everything in one, it never changes, and it would be noise on every
                 line. The at-rules that DO change the answer are kept. */
              const label =
                rule.media !== undefined && rule.conditionText !== undefined
                  ? '@media ' + rule.conditionText
                  : rule.conditionText !== undefined
                    ? '@supports ' + rule.conditionText
                    : null;
              walk(rule.cssRules, label ? context.concat(label) : context);
            }
          }
        };
        for (const sheet of document.styleSheets) {
          try {
            walk(sheet.cssRules, []);
          } catch {
            /* a sheet we may not read */
          }
        }
        return found;
      }

      const fmt = (hits) =>
        hits.length === 0
          ? '    (no rule — this utility is not in the markup)'
          : hits
              .map(
                (h) =>
                  (h.context.length ? '    ' + h.context.join(' and ') + '\n' : '') +
                  '      ' +
                  h.selector +
                  ' { ' +
                  h.body +
                  ' }',
              )
              .join('\n');

      const cell = (ok) => `<td class="${ok ? 'yes' : 'no'}">${ok ? 'yes' : 'no'}</td>`;

      function render() {
        const narrow = toggles.narrow.getAttribute('aria-pressed') === 'true';
        const dark = toggles.dark.getAttribute('aria-pressed') === 'true';
        const override = toggles.override.getAttribute('aria-pressed') === 'true';

        frame.classList.toggle('narrow', narrow);
        frame.classList.toggle('dark', dark);

        /* The dark: variant is a prefers-color-scheme media query — see the readout —
           so flipping a class cannot drive it. We ask the browser to emulate the
           preference for the whole document instead, which is the honest mechanism
           and is exactly what week 2 taught. */
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';

        utilBtn.classList.toggle('bg-emerald-600', override);
        inlineBtn.classList.toggle('bg-emerald-600', override);

        const wide = window.matchMedia('(min-width: 48rem)').matches;
        bp.textContent = wide ? 'viewport is >= md (48rem)' : 'viewport is < md (48rem)';

        const inlineComputed = getComputedStyle(inlineBtn);
        const utilComputed = getComputedStyle(utilBtn);

        body.innerHTML = [
          ['change on hover', false, true, 'a style attribute has no :hover to hang a value on'],
          ['change at a breakpoint', false, true, 'a style attribute has no @media'],
          ['change in dark mode', false, true, 'same reason — no @media'],
          [
            'be overridden by a later class',
            false,
            true,
            'the attribute is (1,0,0,0) — it beats every selector you can write',
          ],
          [
            'hold a value computed at run time',
            true,
            false,
            'THE one thing the attribute is genuinely for — utilities are a fixed set',
          ],
        ]
          .map(
            ([what, inl, util, why]) =>
              `<tr><td>${what}</td>${cell(inl)}${cell(util)}<td>${why}</td></tr>`,
          )
          .join('');

        out.textContent =
          '  right now:\n' +
          '    style="…" button   background ' +
          inlineComputed.backgroundColor +
          ' · padding ' +
          inlineComputed.padding +
          '\n' +
          '    utility button     background ' +
          utilComputed.backgroundColor +
          ' · padding ' +
          utilComputed.padding +
          '\n\n' +
          '  and here is what those utility classes actually ARE. Read out of\n' +
          '  document.styleSheets — this is the browser answering, not a lookup table:\n\n' +
          '  hover:bg-brand-700\n' +
          fmt(rulesFor('hover:bg-brand-700')) +
          '\n\n' +
          '  md:px-8\n' +
          fmt(rulesFor('md:px-8')) +
          '\n\n' +
          '  dark:bg-brand-300\n' +
          fmt(rulesFor('dark:bg-brand-300')) +
          '\n\n' +
          '  Three ordinary CSS rules, each inside an ordinary at-rule. None of that fits\n' +
          '  in an attribute, because an attribute is a VALUE and these are CONDITIONS.\n\n' +
          '  Two more things worth noticing while they are on screen:\n' +
          '    · hover: is wrapped in @media (hover: hover), so it never sticks on a phone.\n' +
          '      You did not ask for that and you got it anyway.\n' +
          '    · md: came out as a min-width. Utilities are mobile-first by construction —\n' +
          "      week 4's rule, now impossible to get backwards.\n\n" +
          '  The objection is still worth taking seriously. It is answered, not dismissed:\n' +
          '  a utility is a CLASS, and a class can carry conditions. An attribute cannot.';
      }

      for (const [, button] of Object.entries(toggles)) {
        button.addEventListener('click', () => {
          button.setAttribute(
            'aria-pressed',
            button.getAttribute('aria-pressed') === 'true' ? 'false' : 'true',
          );
          render();
        });
      }
      addEventListener('resize', render);
      render();
    </script>
  </body>
</html>
