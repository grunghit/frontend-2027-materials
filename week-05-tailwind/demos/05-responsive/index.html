<!doctype html>
<!--
  Responsive prefixes. Week-5 deck, act 4.

  Week 4 spent an act arguing that min-width composes and max-width fights, and CA4
  failed the whole row for one wrong-direction query. This demo's job is to show that
  utilities make that argument structural: `md:` IS a min-width, there is no prefix that
  is a max-width, and so the mistake week 4 graded you on has become unwriteable.

  A width slider drives a real iframe. Inside it, one card row carrying
  `grid-cols-1 md:grid-cols-2 xl:grid-cols-3`. The panel outside reports, live:

    · the frame's width in px and rem
    · which breakpoints currently MATCH, as a stack, not as a single winner
    · the generated CSS for each prefix, read out of the frame's own styleSheets
    · the resolved grid-template-columns, i.e. what actually happened

  What makes it teach rather than merely demonstrate:

  1. THE STACK IS THE POINT. At 1400px the readout shows sm, md, lg and xl all matching
     and xl winning on source order. Students expect exactly one to be "active"; seeing
     four lit at once is what makes "these compose" a mechanism rather than a slogan.
     Drag down and they switch off one at a time, from the top - and nothing ever fights.
  2. The breakpoints are reported in REM as well as px, because they are authored in rem
     and a student who has changed their browser font size will see different pixel
     numbers than the projector does. Better to meet that here than in week 6.
  3. There is no max-width prefix, and the panel says so with the reason: a max-width
     query is a rule that has to be UNDONE at the next size up, and undoing is what
     produces the tangle week 4 showed. Utilities only add.
  4. Everything is measured inside the iframe, so the frame's width is genuinely the
     viewport the media queries are evaluated against. Resizing a div would have been a
     lie, and a subtle one.

  DEMO MOVE: start at 1400 and drag DOWN slowly, narrating only the numbers. Stop at
  exactly 768 and ask what will happen at 767. Then drag one more pixel. Then ask the
  question that matters: "how would you write this with max-width instead?" - let them
  try on the board. It takes three queries and one of them has to be undone.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Responsive prefixes, live</title>

    <style>
      :root {
        color-scheme: light;
        --ink: #14181f;
        --muted: #5c6675;
        --line: #cbd5e1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h2 {
        margin: 0 0 6px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
        margin-bottom: 10px;
      }
      .controls label {
        font:
          600 13px/1.5 ui-monospace,
          Menlo,
          monospace;
      }
      input[type='range'] {
        accent-color: #1d4ed8;
        flex: 1 1 240px;
        min-width: 0;
      }
      .jump {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .jump button {
        font:
          600 12px/1.3 ui-monospace,
          Menlo,
          monospace;
        padding: 4px 8px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: #fff;
        color: #1d4ed8;
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid #b45309;
        outline-offset: 2px;
      }

      .viewport {
        border: 3px solid #1d4ed8;
        border-radius: 12px;
        padding: 6px;
        background: #eff6ff;
        overflow-x: auto;
      }
      iframe {
        display: block;
        width: 1400px;
        height: 230px;
        border: 0;
        border-radius: 8px;
        background: #fff;
        /* Deliberately NOT transitioned. A width transition looked nicer and made every
           reading wrong: the panel measured the frame one animation frame after the
           slider moved, i.e. part-way through the transition, and reported three columns
           in a 700px frame. An instrument that animates cannot also be trusted. */
      }

      .breakpoints {
        display: grid;
        gap: 3px;
        margin: 12px 0 0;
      }
      .bp {
        display: grid;
        grid-template-columns: 66px 110px 1fr;
        gap: 10px;
        align-items: center;
        padding: 5px 9px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: #f8fafc;
        font:
          12.5px/1.5 ui-monospace,
          Menlo,
          Consolas,
          monospace;
      }
      .bp.on {
        background: #f0fdf4;
        border-color: #15803d;
      }
      .bp.off {
        opacity: 0.55;
      }
      .bp .state {
        font-weight: 700;
      }
      .bp.on .state {
        color: #15803d;
      }
      .bp.off .state {
        color: #b91c1c;
      }
      .bp .won {
        background: #15803d;
        color: #fff;
        border-radius: 4px;
        padding: 0 6px;
      }
      .readout {
        margin: 12px 0 0;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f1f5f9;
        font:
          12.5px/1.7 ui-monospace,
          'SF Mono',
          Menlo,
          Consolas,
          monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>

  <body>
    <div class="controls">
      <label for="w">frame width</label>
      <input type="range" id="w" min="320" max="1400" step="1" value="1400" />
      <output id="w-out" for="w">1400px</output>
      <span class="jump" id="jump"></span>
    </div>

    <!--
      `tabindex="0"` and a label, because this box SCROLLS horizontally. A scroll
      container with no tab stop cannot be scrolled by keyboard at all — axe reports it as
      `scrollable-region-focusable`, and it is right. Found by the axe gate added in Run 7.
    -->
    <div class="viewport" tabindex="0" role="group" aria-label="the page at the chosen width">
      <!--
        A REAL iframe, because a media query is evaluated against a viewport and nothing
        else. Narrowing a <div> would have looked identical and taught the opposite of
        the truth — the queries would never have re-evaluated at all.

        srcdoc rather than a second file: an srcdoc frame inherits this document's
        origin, so the panel can read the frame's own styleSheets and report the CSS
        Tailwind generated INSIDE it.
      -->
      <iframe
        id="frame"
        title="A card row at the chosen width"
        srcdoc='
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><title>row</title>
          <script src="../vendor/tailwind.js"></script>
          <style type="text/tailwindcss">@theme { --color-brand-500: hsl(234 89% 52%); }</style>
          <style>body{margin:0;padding:14px;font:14px/1.5 system-ui,sans-serif}</style>
          </head>
          <body>
            <div id="row" class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3">
              <article class="rounded-xl border border-slate-300 bg-slate-50 p-4">
                <h3 class="text-sm font-semibold text-brand-500">Requests</h3>
                <p class="text-2xl font-bold">1.42M</p>
              </article>
              <article class="rounded-xl border border-slate-300 bg-slate-50 p-4">
                <h3 class="text-sm font-semibold text-brand-500">Latency</h3>
                <p class="text-2xl font-bold">86ms</p>
              </article>
              <article class="rounded-xl border border-slate-300 bg-slate-50 p-4">
                <h3 class="text-sm font-semibold text-brand-500">Errors</h3>
                <p class="text-2xl font-bold">0.31%</p>
              </article>
            </div>
          </body></html>
        '
      ></iframe>
    </div>

    <h2 style="margin-top: 14px">which breakpoints match, right now</h2>
    <div class="breakpoints" id="bps"></div>

    <p class="readout" id="out" aria-live="polite"></p>

    <script>
      const frame = document.getElementById('frame');
      const slider = document.getElementById('w');
      const sliderOut = document.getElementById('w-out');
      const bps = document.getElementById('bps');
      const out = document.getElementById('out');

      /* Tailwind's default breakpoints, in the unit they are authored in. The pixel
         column is DERIVED from the root font size at run time rather than written down,
         because 48rem is only 768px while nobody has changed their browser's font size —
         and somebody in every cohort has. */
      const BREAKPOINTS = [
        ['sm', 40],
        ['md', 48],
        ['lg', 64],
        ['xl', 80],
        ['2xl', 96],
      ];

      for (const [name, rem] of BREAKPOINTS) {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = name;
        button.addEventListener('click', () => {
          slider.value = String(Math.round(rem * rootPx()));
          render();
        });
        document.getElementById('jump').append(button);
      }

      const rootPx = () => parseFloat(getComputedStyle(document.documentElement).fontSize);

      /** The generated rule for one utility, read out of the FRAME's stylesheets. */
      function ruleInFrame(cls) {
        const doc = frame.contentDocument;
        if (!doc) return null;
        const esc = '.' + CSS.escape(cls);
        let found = null;
        const walk = (rules, context) => {
          for (const rule of rules) {
            if (
              rule.selectorText &&
              rule.selectorText.split(',').some((s) => s.trim().startsWith(esc))
            ) {
              found = { context, selector: rule.selectorText, body: rule.style.cssText };
            }
            if (rule.cssRules) {
              const label =
                rule.conditionText !== undefined && rule.media !== undefined
                  ? '@media ' + rule.conditionText
                  : null;
              walk(rule.cssRules, label ?? context);
            }
          }
        };
        for (const sheet of doc.styleSheets) {
          try {
            walk(sheet.cssRules, null);
          } catch {
            /* not ours */
          }
        }
        return found;
      }

      function render() {
        const width = Number(slider.value);
        frame.style.width = width + 'px';
        sliderOut.textContent = width + 'px';

        /* Give the frame a moment to re-layout before measuring it. */
        requestAnimationFrame(() => {
          const unit = rootPx();
          const rem = width / unit;

          const matching = BREAKPOINTS.filter(([, bpRem]) => rem >= bpRem);

          /* The winner is the last matching breakpoint THAT THIS MARKUP USES, not the
             last matching one overall. At 700px sm matches and md does not, so the
             winner is neither — the unprefixed grid-cols-1 is what is in force, and the
             badge correctly appears nowhere. */
          const used = ['md', 'xl'];
          const winner =
            matching
              .filter(([name]) => used.includes(name))
              .map(([name]) => name)
              .pop() ?? null;

          bps.innerHTML = BREAKPOINTS.map(([name, bpRem]) => {
            const on = rem >= bpRem;
            const applies = used.includes(name);
            return (
              '<div class="bp ' +
              (on ? 'on' : 'off') +
              '"><code>' +
              name +
              ':</code>' +
              '<span>&ge; ' +
              bpRem +
              'rem (' +
              Math.round(bpRem * unit) +
              'px)</span>' +
              '<span class="state">' +
              (on ? 'matches' : 'does not match') +
              (on && applies && name === winner
                ? ' <span class="won">this one is in force</span>'
                : '') +
              (applies ? '' : ' — not used in this markup') +
              '</span></div>'
            );
          }).join('');

          const doc = frame.contentDocument;
          const row = doc && doc.getElementById('row');
          const resolved = row ? getComputedStyle(row).gridTemplateColumns : '(frame not ready)';
          const columns = resolved.trim().split(/\s+/).length;

          const md = ruleInFrame('md:grid-cols-2');
          const xl = ruleInFrame('xl:grid-cols-3');

          out.textContent =
            '  frame is ' +
            width +
            'px, which is ' +
            rem.toFixed(2) +
            'rem at a root size of ' +
            unit +
            'px.\n' +
            '  the row resolved to ' +
            columns +
            ' column' +
            (columns === 1 ? '' : 's') +
            ':  ' +
            resolved +
            '\n\n' +
            '  the markup says:  grid-cols-1 md:grid-cols-2 xl:grid-cols-3\n' +
            '  and those prefixes are these rules, read out of the frame:\n\n' +
            (md ? '    ' + md.context + '\n      ' + md.selector + ' { ' + md.body + ' }\n' : '') +
            (xl ? '    ' + xl.context + '\n      ' + xl.selector + ' { ' + xl.body + ' }\n' : '') +
            '\n' +
            '  ' +
            matching.length +
            ' breakpoint' +
            (matching.length === 1 ? '' : 's') +
            ' match right now: ' +
            (matching.length ? matching.map(([n]) => n).join(', ') : 'none') +
            '.\n' +
            '  Notice that more than one is lit. They do not take turns and they do not\n' +
            '  compete — each one ADDS a rule, and the last one that matches is the one\n' +
            '  that ends up on top. Drag down and they switch off from the top, one at a\n' +
            '  time, and every intermediate state is a layout somebody designed.\n\n' +
            '  There is no max-* prefix, and that is a decision rather than an omission.\n' +
            '  A max-width query states what a thing STOPS being, so every one of them has\n' +
            '  to be undone by the next rule up — which is the tangle week 4 made you\n' +
            '  untangle. Utilities can only add, so the mistake CA4 failed a whole row for\n' +
            '  is now one you cannot write down.';
        });
      }

      slider.addEventListener('input', render);
      frame.addEventListener('load', render);
      render();
    </script>
  </body>
</html>
